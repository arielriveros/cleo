<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleo Creator</title>
    <!-- The pre-bundle splash below, the same as the editor's. Inline and literal: it shows while the JS
         (and the stylesheet with the theme tokens) is still downloading, so it cannot use either. -->
    <style>
        html, body { margin: 0; height: 100%; background: #0f1117; }
        .cleo-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                     justify-content: center; gap: 28px; font-family: system-ui, sans-serif; color: #e5e7eb; }
        .cleo-boot h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0.3em; }
        .cleo-boot small { display: block; margin-top: 8px; text-align: center; font-size: 10px;
                           letter-spacing: 0.3em; text-transform: uppercase; color: #9aa4b2; }
        .cleo-boot .bar { width: 380px; max-width: 85vw; height: 8px; border: 1px solid #2d2d77;
                          border-radius: 999px; background: #141620; overflow: hidden; }
        .cleo-boot .bar span { display: block; width: 30%; height: 100%; border-radius: 999px;
                               background: linear-gradient(90deg, #2d2d77, #326acc);
                               animation: cleo-boot-slide 1.2s ease-in-out infinite; }
        .cleo-boot p { margin: -16px 0 0; font-size: 12px; color: #8a8aa0; }
        @keyframes cleo-boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
    </style>
</head>

<body>
    <!-- React's first render replaces everything inside #root, splash included. -->
    <div id="root">
        <div class="cleo-boot" role="progressbar" aria-label="Loading Cleo Creator">
            <div><h1>CLEO ENGINE</h1><small>Creator</small></div>
            <div class="bar"><span></span></div>
            <p>Loading Cleo Creator…</p>
        </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
</body>

</html>
