<!doctype html>
<meta charset="utf-8">
<title>terrain POM probe</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101014; }
  #vp { width: 100%; height: 100%; display: block; }
</style>
<div id="vp"></div>
<script src="./cleo.js"></script>
<script>
// A SIDE-BY-SIDE OF THE ONE COMPARISON EVERY OTHER GATE MISSES.
//
// meshCheck's march A/B answers "is the residual march alive" and does it on a 24 m fixture whose split
// lands at mip 5. The complaint is about a 400 m landscape at tiling 31 with a brick texture, next to
// the SAME brick texture on a standard PBR material, and no harness renders that. Every conclusion so
// far has come from reading the shader and computing what it ought to produce; this page produces the
// pixels instead, and is meant to be LOOKED AT rather than reduced to a signature.
//
// One height map, four subjects, one camera. The map is a brick pattern with sharp mortar grooves --
// unambiguous relief, so "is there any" is answerable by eye and does not depend on a lighting model.
window.__ready = false;
window.__error = null;

function brickMap(px) {
  // White = high (a HEIGHT map, the engine's convention), mortar cut deep and narrow.
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const g = c.getContext('2d');
  const rows = 6, cols = 3;                       // 6 courses, 3 bricks each -> a 2:1 brick
  const bh = px / rows, bw = px / cols, mortar = Math.max(2, px * 0.012);
  g.fillStyle = '#101010'; g.fillRect(0, 0, px, px);   // mortar floor
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * bw * 0.5;
    for (let k = -1; k <= cols; k++) {
      const x = k * bw + off + mortar * 0.5, y = r * bh + mortar * 0.5;
      const w = bw - mortar, h = bh - mortar;
      // A slight crown across each brick, so the field is not a pure binary step.
      const grad = g.createLinearGradient(x, y, x, y + h);
      grad.addColorStop(0, '#d8d8d8'); grad.addColorStop(0.5, '#ffffff'); grad.addColorStop(1, '#d8d8d8');
      g.fillStyle = grad; g.fillRect(x, y, w, h);
    }
  }
  return c;
}

function brickAlbedo(px) {
  // The colour the moved UV reveals. Deliberately high contrast between brick and mortar: a parallax
  // offset is a shift in WHICH texel is sampled, so it is only visible where neighbouring texels differ.
  const c = document.createElement('canvas');
  c.width = c.height = px;
  const g = c.getContext('2d');
  const rows = 6, cols = 3, bh = px / rows, bw = px / cols, mortar = Math.max(2, px * 0.012);
  g.fillStyle = '#2a2724'; g.fillRect(0, 0, px, px);
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * bw * 0.5;
    for (let k = -1; k <= cols; k++) {
      const tone = 120 + ((r * 7 + k * 13) % 5) * 14;
      g.fillStyle = `rgb(${tone + 40}, ${Math.round(tone * 0.62)}, ${Math.round(tone * 0.48)})`;
      g.fillRect(k * bw + off + mortar * 0.5, r * bh + mortar * 0.5, bw - mortar, bh - mortar);
    }
  }
  return c;
}

function normalFromHeight(src, strength) {
  // Central differences on the height field, in the green-UP convention the engine's importers produce
  // (chunks/modelVarying.wgsl negates the bitangent to match). Without this the lighting cannot vary
  // across a groove and the relief is invisible however far the ray marched.
  const px = src.width;
  const sg = src.getContext('2d').getImageData(0, 0, px, px).data;
  const h = (x, y) => sg[(((y + px) % px) * px + ((x + px) % px)) * 4] / 255;
  const out = document.createElement('canvas');
  out.width = out.height = px;
  const img = out.getContext('2d').createImageData(px, px);
  for (let y = 0; y < px; y++)
    for (let x = 0; x < px; x++) {
      const dx = (h(x + 1, y) - h(x - 1, y)) * strength;
      const dy = (h(x, y + 1) - h(x, y - 1)) * strength;
      const len = Math.hypot(dx, dy, 1);
      const i = (y * px + x) * 4;
      img.data[i] = Math.round((-dx / len * 0.5 + 0.5) * 255);
      img.data[i + 1] = Math.round((-dy / len * 0.5 + 0.5) * 255);
      img.data[i + 2] = Math.round((1 / len * 0.5 + 0.5) * 255);
      img.data[i + 3] = 255;
    }
  out.getContext('2d').putImageData(img, 0, 0);
  return out;
}

(async () => {
  try {
    const q = new URLSearchParams(location.search);
    const backend = q.get('backend') || 'webgl2';
    const engine = new cleo.CleoEngine({ graphics: { clearColor: [0.05, 0.06, 0.09, 1], deferred: true, backend } });
    window.__engine = engine;
    if (typeof engine.initialize === 'function') await engine.initialize();
    engine.setViewport(document.getElementById('vp'));
    const scene = new cleo.Scene();
    // Scene fill is scene state, not a property of the sun. Without it every surface the sun misses is
    // black, and half of what this page exists to show sits in exactly that half.
    scene.ambientLight = [0.16 * cleo.REFERENCE_ILLUMINANCE, 0.17 * cleo.REFERENCE_ILLUMINANCE,
                          0.21 * cleo.REFERENCE_ILLUMINANCE];

    const TM = cleo.TextureManager.Instance;
    const height = brickMap(512);
    TM.addTextureFromBase64(height.toDataURL('image/png'), { mipMap: true }, 'brickH');
    // ALBEDO AND NORMAL, BOTH DERIVED FROM THE SAME HEIGHT FIELD -- and their absence is what made the
    // first run of this probe useless. Parallax occlusion mapping does exactly one thing: it moves the
    // UV a fragment samples at. It has no effect of its own on shading. With a flat grey albedo and no
    // normal map there is nothing for a moved UV to reveal, so a perfectly working march renders a
    // perfectly flat surface -- which is indistinguishable, in a screenshot, from the march being dead.
    TM.addTextureFromBase64(brickAlbedo(512).toDataURL('image/png'), { mipMap: true }, 'brickA');
    TM.addTextureFromBase64(normalFromHeight(height, 3.0).toDataURL('image/png'), { mipMap: true }, 'brickN');

    // --- the landscape, at the reported settings -------------------------------------------------
    const SIZE = 400, RES = 400;
    const terrain = new cleo.Terrain({ size: SIZE, resolution: RES });
    const land = new cleo.LandscapeNode('landscape', terrain);
    scene.addNode(land);

    const mat = cleo.TerrainMaterial.Create('pbr', {
      baseColor: [1, 1, 1], metallic: 0, roughness: 0.96,
      textures: { baseColorTexture: 'brickA', normalMap: 'brickN' },
    });
    mat.tiling = Number(q.get('tiling') || 31);
    mat.displacementScale = Number(q.get('depth') || 0.06);
    mat.textures.set('displacementMap', 'brickH');
    terrain.setLayer(0, mat);

    // --- the same map on a standard PBR plane, uv repeating every metre ---------------------------
    // The subject the terrain is being compared against. Placed off to the side and given the same
    // depth in the units ITS shader wants, so the two are asked for the same physical relief.
    // `displacementScale` is the authored control on a standard material, and its unit is UV. The plane
    // is 8 m with uv 0..1, so `Geometry.Plane`'s own uv repeats once over 8 m; the map is asked to
    // repeat every metre by tiling the material, which is what makes this the "same texture on a mesh"
    // the terrain is being judged against.
    // THE SAME MATERIAL ON THREE SUBJECTS, in one frame, under one light.
    //
    // The material editor previews on `Geometry.Sphere(48)`; a scene object is whatever the author
    // made. If those two disagree about which way relief goes, the disagreement is a property of the
    // GEOMETRY, not of the shader — `parallaxFrame` builds its basis from screen-space derivatives of
    // position and uv, while `getNormal` decodes the normal map through the interpolated `tbn`, and the
    // two only agree if the mesh's tangents match the chart its uv actually describes.
    const subjectMat = () => {
        const m = cleo.Material.PBR({
            baseColor: [1, 1, 1], metallic: 0, roughness: 0.9,
            displacementScale: Number(q.get('depth') || 0.06),
            textures: { baseColorTexture: 'brickA', normalMap: 'brickN', displacementMap: 'brickH' },
        });
        return m;
    };
    const subjects = [
        ['sphere', cleo.Geometry.Sphere(48)],
        ['cube', cleo.Geometry.Cube(1.6, 1.6, 1.6)],
        ['plane', cleo.Geometry.Plane(1.8, 1.8, 1, 1)],
    ];
    subjects.forEach(([name, g], i) => {
        const n = new cleo.ModelNode(name, new cleo.Model(g, subjectMat()));
        // A row at one distance and one height, so nothing about the comparison depends on framing.
        n.setPosition([(i - 1) * 2.2, 1.0, -3.4]);
        // The plane is XY; stand it up to face the camera like the other two.
        scene.addNode(n);
    });

    // HIGH and to one side. A sun near the horizon puts the whole frame in a grazing specular lobe;
    // what makes relief DIRECTION legible is a clear lit-side / shadow-side gradient across each
    // feature, which needs the light up and off-axis. `+pitch` is DOWN and a light's forward is where
    // it shines, so ~120 is a sun about 30 degrees past vertical, shining down and toward the camera.
    const sun = new cleo.LightNode('sun', new cleo.DirectionalLight({
      diffuse: [1.0, 0.96, 0.88], specular: [1, 1, 1], ambient: [0.16, 0.17, 0.21],
    }), true);
    sun.setPosition([0, 1, 0]);
    sun.setRotation([Number(q.get('sun') || 120), 55, 0]);
    scene.addNode(sun);

    const cam = new cleo.CameraNode('cam', new cleo.Camera({ type: 'perspective', far: 800 }));
    cam.setPosition([0, Number(q.get('camy') || 1.0), Number(q.get('camz') || 0)]);
    // +pitch looks DOWN. Guessing this the other way aims the camera at the sky and renders nothing,
    // which is the trap the mesh page documents at its own camera.
    cam.setRotation([Number(q.get('pitch') || 0), 0, 0]);
    cam.active = true;                      // `activeCamera` is a getter over this flag; there is no setter
    scene.addNode(cam);

    engine.setScene(scene);
    scene.start();
    // `scene.start()` starts the SCENE, not the render loop. Without these two the page reports ready,
    // every uniform reads as its default, the texture pack never resolves because nothing ever draws,
    // and the capture is the clear colour -- which looks exactly like "the march produces nothing".
    engine.isPaused = false;
    // Fixed, not metered. Auto exposure re-meters between the march-on and march-off captures and would
    // charge the difference to the march.
    engine.renderer.autoExposureEnabled = false;
    engine.renderer.exposure = Number(q.get('exposure') || 1.6);
    // Shadows OFF by default here. A 400 m terrain under one cascade puts the near field into acne or
    // into full shadow, and a relief effect measured inside a shadow is measured against nothing.
    engine.renderer.shadowsEnabled = q.get('shadows') === '1';
    engine.run();

    // Suspend the per-frame uniform sync before overriding, or `_writeMarchUniforms` restores the
    // authored depth before the next composite -- the trap meshCheck's probe documents.
    let saved = null, syncPacked = null;
    window.__setMarch = (v) => {
      const m = terrain.material;
      if (saved === null) saved = m.properties.get('u_dispScale0');
      if (syncPacked === null) syncPacked = terrain.syncPackedLayers.bind(terrain);
      if (v === null) { terrain.syncPackedLayers = syncPacked; syncPacked = null; }
      else terrain.syncPackedLayers = () => {};
      m.properties.set('u_dispScale0', v === null ? saved : v);
      return String(m.properties.get('u_dispScale0'));
    };
    window.__uniforms = () => {
      const m = terrain.material, p = (k) => m.properties.get(k);
      return JSON.stringify({
        tiling: mat.tiling, depth: mat.displacementScale, size: SIZE, resolution: RES,
        dispScale0: p('u_dispScale0'), tiling0: p('u_tiling0'),
        // What the shader will actually offset by, in base uv, and the same in metres — the two
        // numbers an author cannot see anywhere else.
        depthBaseUv: p('u_dispScale0') / Math.max(p('u_tiling0'), 0.01),
        depthMetres: p('u_dispScale0') * SIZE / Math.max(p('u_tiling0'), 0.01) / SIZE * SIZE,
        hasHeight0: p('u_hasHeight0'), hasNormal0: p('u_hasNormal0'),
        packId: String(m.textures.get('u_normal0') ?? null),
        // The layer as TERRAIN derived it, not as the material was authored. `_deriveLayerSurface` is
        // the only thing between the two and it is where a height map goes missing silently.
        layer0: (() => { const L = terrain.layers[0]; return L && {
          displace: L.displace, heightId: L.heightId, dispScale: L.dispScale,
          tiling: L.tiling, invertHeight: L.invertHeight }; })(),
        // Has the source image actually decoded? `heightField` returns null without caching while the
        // width is 0, so a zero here means "ask again", not "broken".
        srcDecoded: (() => { const d = TM.getTexture('brickH') && TM.getTexture('brickH').data;
          return d ? (d.constructor && d.constructor.name) + ':' + (d.width || 0) : 'no texture'; })(),
      });
    };
    window.__ready = true;
  } catch (e) {
    window.__error = String(e && e.stack || e);
    window.__ready = true;
  }
})();
</script>
