<!doctype html>
<meta charset="utf-8">
<title>naga translator runtime check</title>
<canvas id="c" width="64" height="64"></canvas>
<script src="cleo.js"></script>
<script>
// The editor's WGSL path, exercised end to end in a browser.
//
// Everything about it is runtime-only and therefore invisible to the type checker and to Node tests: a
// `webpackIgnore` dynamic import resolved by the browser, a wasm fetched over the page's own protocol,
// and a translator handed to the engine through `setWgslTranslator`. A build can succeed with every one
// of those broken.
//
// Mirrors editor/src/utils/wgslTranslator.ts deliberately — if this passes and the editor does not, the
// difference is the editor, not the approach.
window.__ready = false;
window.__error = null;

const assetUrl = (file) => new URL('naga/' + file, document.baseURI).href;

(async () => {
  try {
    // A GL context has to exist before tryCompileCustom: it builds and links a real program.
    const engine = new cleo.CleoEngine({ canvas: document.getElementById('c') });
    await engine.initialize();

    const mod = await import(/* webpackIgnore: true */ assetUrl('nagaGlsl.js'));
    await mod.default({ module_or_path: assetUrl('nagaGlsl_bg.wasm') });
    window.__nagaVersion = mod.naga_version();
    cleo.setWgslTranslator((glsl) => mod.glsl_to_wgsl(glsl, 'fragment'));
    window.__installed = cleo.hasWgslTranslator();

    const screenUniforms = [
      { name: 'intensity', type: 'float', value: 1 },
      { name: 'invert', type: 'bool', value: false },
      { name: 'mask', type: 'sampler2D', value: '' },
    ];
    const good = `
vec4 fragment() {
    vec3 c = texture(u_screenTexture, fragTexCoord).rgb;
    float d = texture(u_depth, fragTexCoord).r;
    vec3 w = reconstructWorldPos(fragTexCoord, d);
    float fog = clamp(length(w - u_viewPos) / 100.0, 0.0, 1.0);
    vec2 ct = fragTexCoord - 0.5;
    vec3 t = c * (1.0 - dot(ct, ct) * u_intensity) * texture(u_mask, fragTexCoord).r;
    if (u_invert) t = vec3(1.0) - t;
    return vec4(toSrgb(t * u_exposure * (0.5 + 0.5 * sin(u_time * PI)) + fog * 0.0), 1.0);
}
`;

    const slim = (r) => ({
      ok: !!r.ok,
      error: r.error ? String(r.error).slice(0, 300) : null,
      hasWgsl: !!r.wgsl,
      wgslHead: r.wgsl ? String(r.wgsl).slice(0, 200) : null,
      wgslError: r.wgslError ? String(r.wgslError).slice(0, 300) : null,
    });

    window.__results = () => ({
      // Compiles AND translates: the state a portable custom material should reach.
      screenGood: slim(cleo.tryCompileCustom('screen', good, screenUniforms)),
      // Compiles on WebGL2, cannot be checked for WebGPU — the engine's own limitation, reported as such.
      forward: slim(cleo.tryCompileCustom('forward', 'vec4 fragment() { return vec4(getNormal(), 1.0); }', [])),
      // Compiles on WebGL2, fails naga: a `while` with a non-constant bound is fine in GLSL ES and is
      // what a real portability warning looks like.
      screenOdd: slim(cleo.tryCompileCustom('screen',
        'vec4 fragment() { float x = 0.0; for (int i = 0; i < 4; i++) { x += dFdx(u_time); } return vec4(x); }',
        [])),
      // Broken source: the GL error must still win, with no WGSL noise layered on top.
      broken: slim(cleo.tryCompileCustom('screen', 'vec4 fragment() { return notAThing(); }', [])),
    });

    window.__ready = true;
  } catch (e) {
    window.__error = String((e && e.stack) || e);
  }
})();
</script>
