    // Handed over as the four BundleData halves plus the texture payloads; the driver runs the
    // editor's own packBundleAssets over them so geometry that appears in several places — a model
    // asset, a terrain material's foliage rule, the scene's copy of that same rule, and the scattered
    // layer's prototype — collapses to ONE interned chunk. Written as format 1 it would be four full
    // copies of every vertex.
    const vfs = { version: 1, folders: [], entries: [] };
    const folder = (p) => { if (!vfs.folders.includes(p)) vfs.folders.push(p); return p; };
    const entry = (dir, name, kind, assetId) =>
      vfs.entries.push({ path: `${folder(dir)}/${name}`, kind, assetId, created: 0 });

    entry('/Scenes', 'Realistic Landscape.scene', 'scene', sceneId);
    for (const a of modelAssets)
      entry(/_lod[1-9]$/.test(a.name) ? '/Models/LOD levels' : '/Models', a.name + '.model', 'model', a.id);
    for (const a of materialAssets) entry('/Materials', a.name + '.mat', 'material', a.id);
    for (const a of terrainMaterialAssets) entry('/Terrain Materials', a.name + '.tmat', 'terrainMaterial', a.id);
    for (const id of textures.keys()) entry('/Textures', id, 'texture', id);

    const manifest = {
      formatVersion: 2, kind: 'project', createdAt: Date.now(),
      mainSceneId: sceneId, openSceneId: sceneId,
      projectName: 'Realistic Landscape',
      // The cover image is filled in by the driver from a capture of this window. `screenshotOffscreen`
      // is the wrong tool for it: that path is for ASSET previews, so it skips the sky, the clouds and
      // the god rays and keys alpha off scene depth — a landscape comes out of it as black silhouettes
      // on transparency. Nothing in the editor writes a scene thumbnail either, which is why the
      // shipped 3D example has none.
      sceneMetas: [{
        id: sceneId, name: 'Realistic Landscape', updatedAt: Date.now(), thumbnail: '', dimension: '3D',
        refs: {
          materialIds: materialAssets.map(a => a.id),
          modelIds: modelAssets.map(a => a.id),
          templateIds: [],
          terrainMaterialIds: terrainMaterialAssets.map(a => a.id),
          tilesetIds: [],
          textureIds: [...textures.keys()],
        },
      }],
    };

    const libraries = {
      materials: materialAssets, terrainMaterials: terrainMaterialAssets, models: modelAssets,
      templates: [], scripts: [], animationFields: [], animations: [], tilesets: [],
    };
    stripTangentFrames(libraries);

    // The pieces cross to the driver as strings: executeJavaScript serializes its result as JSON, so a
    // typed array would arrive as an object with numeric keys. Chunked on the way out because
    // libraries/models.json alone is tens of megabytes of decimal geometry.
    const pieces = new Map();
    // Stringified one piece at a time and MEASURED, because this is where the pipeline's real ceiling
    // is. Geometry serializes as JSON decimals (~362 bytes a triangle) and appears four times over — in
    // the model library, in the terrain material's foliage rule, in the scene's copy of that rule, and
    // in the scattered layer — so a scene of unique geometry hits V8's ~512 MB string limit long before
    // it hits any disk or GPU limit. A RangeError here is not a bug to route around, it is the budget
    // telling you the number.
    const sizes = [];
    const put = (key, value) => {
      try {
        const text = JSON.stringify(value);
        sizes.push({ key, mb: +(text.length / 1e6).toFixed(1) });
        pieces.set(key, { text, base64: false });
      } catch (e) {
        sizes.push({ key, mb: -1, error: String(e && e.message || e) });
        throw new Error(`piece "${key}" could not be serialized (${e && e.message}); `
          + `unique geometry is too large for the JSON intermediate — see the sizes report`);
      }
    };
    window.__sizes = () => sizes;
    put('manifest', manifest);
    put('vfs', vfs);
    put('scene:' + sceneId, sceneData);
    for (const [k, v] of Object.entries(libraries)) put('lib:' + k, v);
    const texRows = [];
    for (const [id, t] of textures) {
      let bin = '';
      for (let i = 0; i < t.bytes.length; i += 0x8000)
        bin += String.fromCharCode.apply(null, t.bytes.subarray(i, i + 0x8000));
      pieces.set('tex:' + id, { text: btoa(bin), base64: true });
      texRows.push({ id, mime: t.mime, config: t.config });
    }
    put('textureIndex', texRows);

    // Move the live camera and settle. The driver uses this to capture the scene from several angles:
    // one 960-pixel hero shot is not enough to tell "the terrain is not being drawn" apart from "the
    // terrain is drawn and the framing is bad", and that ambiguity cost a full rebuild to resolve.
    window.__setCamera = async (pos, rot, frames = 40) => {
      camera.setPosition(pos);
      camera.setRotation(rot);
      await peak(frames);
      const active = engine.scene.activeCamera;
      return {
        at: pos, rot, triangles: cleo.frameStats.triangles, objects: cleo.frameStats.objects,
        activeIsOurs: active === camera,
        activePos: active ? Array.from(active.worldPosition) : null,
        activeFwd: active ? Array.from(active.worldForward) : null,
      };
    };
    // A readback through the renderer's own offscreen path, independent of the OS compositor. Alpha is
    // keyed off scene depth there, so the sky is transparent — composited over a flat colour here so
    // the geometry is at least legible in a diagnostic shot.
    window.__readback = (size) => renderer.screenshotOffscreen(engine.scene, size);
    window.__debugView = async (v, frames = 25) => { renderer.debugView = v; await peak(frames); return v; };
    window.__heroCamera = { pos: eye, rot: camRot };
    window.__terrainProbe = (x, z) => ({ height: terrain.heightAt(x, z), origin: Array.from(terrain.origin ?? [0, 0, 0]) });

    // What the probe actually captured, as the editor's own inspector renders it. `probeBaked` below
    // only says a bake RAN; a capture that comes back black passes that and still leaves the scene
    // with no bounce light, which is exactly the failure this exists to catch. Taken for both the live
    // scene and (in `__verify`) the reparsed one, because "the bake works" and "the bake works after a
    // round trip" are different claims.
    const probeShotOf = async (p, size) => {
      if (!p) return { found: false };
      return {
        found: true, baked: p.lastBakeTime > 0, hasMaps: p.hasBakedMaps,
        intensity: p.intensity, resolution: p.resolution,
        pos: Array.from(p.worldPosition), size: Array.from(p.size), bounded: p.bounded,
        uri: await renderer.renderProbePreview(p, size),
      };
    };
    window.__probeShot = (size = 512) => probeShotOf(probe, size);
    window.__reparsedProbeShot = (size = 512) =>
      probeShotOf([...(engine.scene.lightProbes ?? [])][0], size);

    // Lets the driver write a processed atlas out for inspection: "did the dilation run" and "did it
    // produce the right pixels" are different questions, and only the bytes answer the second.
    window.__textureBytes = (id) => {
      const t = textures.get(id);
      if (!t) return null;
      let bin = '';
      for (let i = 0; i < t.bytes.length; i += 0x8000)
        bin += String.fromCharCode.apply(null, t.bytes.subarray(i, i + 0x8000));
      return btoa(bin);
    };
    /**
     * Swap the live scene for an empty one, so the transfer below is not competing with the renderer.
     *
     * `CleoEngine`'s loop re-registers itself from inside its own rAF callback and never stops. At this
     * scene's cost that is a saturated main thread, and `executeJavaScript` from the driver simply
     * never gets scheduled — the build sat idle for forty minutes at 52 seconds of CPU, which reads
     * exactly like a hang and is actually starvation. An empty scene still renders, just not anything.
     */
    window.__quiesce = () => {
      engine.isPaused = true;
      engine.setScene(new cleo.Scene());
      return true;
    };

    window.__pieces = () => [...pieces.entries()].map(([key, p]) => ({ key, size: p.text.length, base64: p.base64 }));
    window.__pieceChunk = (key, off, len) => pieces.get(key).text.substr(off, len);
    window.__report = () => ({
      stats,
      canvas: [renderer.canvas.width, renderer.canvas.height],
      sceneModels: scene.models.size,
      camera: { at: eye.map(v => +v.toFixed(1)), rotation: camRot.map(v => +v.toFixed(1)), layer: camLayer },
      sunForward: Array.from(sun.worldForward),
      coverage: coverage.map(v => +(v * 100).toFixed(1)),
      heightRange: [+hMin.toFixed(2), +hMax.toFixed(2)],
      terrainLayers: terrain.layers.filter(l => l && l.material).length,
      layerTextures: terrain.layers.filter(Boolean).map(l => l.albedoId),
      cards: CARD.map((c, i) => ({ id: c.id, coverage: +(c.coverage * 100).toFixed(1) })),
      scattered: scattered.placed,
      foliage: terrain.foliage.map(f => ({
        name: f.name, kind: f.kind, count: f.count, levels: f.levels.length, cull: f.cullDistance,
        // The impostor hand-off distance, or null for a layer that simply stops at `cull`. Reported
        // because "the grass has three LODs" and "the grass turns into cards at 30 m" are separate
        // claims and the second is the one that used to be false.
        impostor: f.billboardTextureId ? f.billboardDistance : null,
        clipped: f.count >= 200000,
        scale: [+f.params.minScale.toFixed(2), +f.params.maxScale.toFixed(2)],
      })),
      tufts: tuftFacts,
      models: modelAssets.map(a => ({
        name: a.name,
        triangles: a.nodeJson.children.reduce((n, c) => n + (c.model?.geometry?.indices?.length ?? 0) / 3, 0),
      })),
      probeBaked: probe.lastBakeTime > 0,
      reparse,
      contextLost: window.__contextLost,
      textureCount: textures.size,
      dilated: dilationLog,
      masked: maskedLog,
      materials: materialFacts,
      pieceBytes: [...pieces.values()].reduce((n, p) => n + p.text.length, 0),
    });
    log('done');
    window.__ready = true;
  } catch (e) {
    window.__error = String((e && e.stack) || e);
    console.error(window.__error);
  }
})();
</script>
</body>
</html>
