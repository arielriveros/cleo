<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Realistic Landscape builder</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101014; }
  #vp { position: absolute; inset: 0; }
</style>
<script src="cleo.js"></script>
</head>
<body>
<div id="vp"></div>
<script>
// Assembles the "Realistic Landscape" example project with the engine's own classes and hands the
// finished pieces back to tools/terrain/buildLandscape.js, which packs them into a bundle.
//
// Everything here runs against the REAL dist/cleo.js in a real GPU process. That is deliberate: the
// alternative is hand-writing scene JSON, which drifts from the parser the editor actually runs, and
// the failure mode is a project that imports with pieces silently missing. Building it live also lets
// the builder RENDER what it just made and refuse to emit a scene that draws nothing.
window.__ready = false;
window.__error = null;

// A lost GL context does not announce itself: `gl.createTexture()` starts returning null, so the next
// texture fails with "used after destroy" from a handle that was never created, and every capture
// comes back blank. Both symptoms point anywhere except the cause, so the cause gets a name.
window.__contextLost = false;
addEventListener('webglcontextlost', (e) => {
  window.__contextLost = true;
  console.error('[build] WebGL context LOST — the scene is too heavy for this GPU');
}, true);

const log = (m) => console.info('[build] ' + m);

// --------------------------------------------------------------------------------------------
// Determinism
//
// Seeded before the engine exists, and for the whole page. `generateFoliageEverywhere` draws every
// candidate position from Math.random and `FoliageLayer.pushInstance` draws a yaw and a scale per
// instance, so an unseeded build produces a different forest — and a different multi-megabyte
// committed artifact — every run. Ids are counter-derived for the same reason.
let __seed = 0x5eed1a2b;
Math.random = () => {
  __seed ^= __seed << 13; __seed >>>= 0;
  __seed ^= __seed >> 17;
  __seed ^= __seed << 5;  __seed >>>= 0;
  return __seed / 0x100000000;
};
let __idCounter = 0;
// 32 hex chars, the shape cryptoRandomId produces, so the ids look native in the libraries.
const newId = () => {
  let h = '';
  for (let i = 0; i < 4; i++) {
    let x = (0x9e3779b9 * (++__idCounter) + i * 0x85ebca6b) >>> 0;
    x ^= x >>> 15; x = (x * 0x2545f491) >>> 0; x ^= x >>> 13;
    h += (x >>> 0).toString(16).padStart(8, '0');
  }
  return h;
};

const BUILD = 'app://build/';
const SIZE = 256;             // metres per side
const RES = 257;              // vertices per side -> a 1 m grid, 8x8 chunks at chunkQuads 32
const CHUNK_QUADS = 32;

// Where each prototype's LOD levels take over, and where its instances stop being drawn at all.
//
// These are the scene's real performance budget. Every one of these meshes is modelled geometry, not
// a card: a grass clump is 714-2,489 triangles and a pine is 53k, so the near bands have to be short.
// Worked at the authored densities below, the visible set lands around 4-5M triangles.
// The LOD0 band is the only real lever on cost, and it is short on purpose: these prototypes now ship
// at their authored detail (the searsia entirely, the pine at 601k triangles), so a long LOD0 band puts
// a third of a million triangles on screen per tree.
const LOD_DISTANCE = {
  // The pine\'s LOD1 band reaches far further than it did, paid for by 40% fewer pines.
  // A pine needs roughly a million triangles to read as full — its needles are geometry, not
  // cards — so at the 12k LOD2 gets it is visibly bare, and reaching further with LOD1 is
  // worth more than the tree count.
  pine:          [0, 22, 90],
  searsiaMedium: [0, 14, 42],
  searsiaSmall:  [0, 12, 36],
};
// Cull distances are the ONE lever that cuts the colour pass and the shadow cascades together: the
// foliage shadow pass culls cells against this same camera distance, not against the cascade. They are
// short because the frame budget here is not academic — a 14M-triangle frame with three cascades over
// a million instances took the GPU process down with it (exit_code 34, a driver reset), and a lost
// context surfaces as blank captures and textures that were never created rather than as anything that
// names the cause. Aerial fog saturates around 120 m anyway, so this costs little that is visible.
const CULL = { pine: 120, searsiaMedium: 100, searsiaSmall: 80 };
// Mesh grass IS the ground cover, out to `GRASS_CARD_DISTANCE`; past that each layer's own billboard
// impostor takes over, to `CULL`.
//
// It used to be the other way round — five standalone card rules at 11.3 instances/m² against four mesh
// rules at 0.38, both starting at distance 0 — so what you stood in was a field of flat quads with a
// few clumps scattered over it. Foliage has no NEAR cut (only `cullDistance` and the LOD bands), so a
// standalone card rule is visible at arm's length by construction; the same cards reached through
// `FoliageLayer.billboardDistance` cannot be. The engine has had that path since the mesh-LOD work
// (renderer.ts: the impostor bucket taken when d >= layer.billboardDistance); this scene was not
// using it.
//
// Three mesh levels, not two: ring area grows with the square of the radius, so 14-30 m holds four
// times the clumps of 6-14 m, and running that ring on LOD1 would cost more than LOD0 and LOD1 together.
for (const n of ['a', 'b', 'c', 'd', 'e']) { LOD_DISTANCE['grass_' + n] = [0, 7, 15]; CULL['grass_' + n] = 70; }
// 26, paired with a fatter LOD2 (see decimateTrees). The hand-off has to be invisible in BOTH
// directions: too far out and the thinnest mesh level carries a wide ring it cannot fill, which put a
// bald band between the near grass and the cards behind it. 26 rather than 30 is also 0.4M triangles
// — the 15-30 m ring is the single most expensive band in the frame, because ring area is quadratic.
const GRASS_CARD_DISTANCE = 26;
for (const n of ['07', '08', '09', '10', '11', '12', '13']) { LOD_DISTANCE['rock_' + n] = [0, 40]; CULL['rock_' + n] = 70; }

// An afternoon sun placed BEHIND the camera's right shoulder.
//
// It started ahead of the camera, for the backlit rim and the god rays, and that is what made the
// foliage read as black: a leaf here is one thin double-sided sheet with no translucency, so a leaf
// facing the camera with the sun beyond it has N·L below zero and is lit by ambient alone. Real
// backlit foliage glows because light passes THROUGH it, which this lighting model does not do. With
// the sun behind, the camera-facing side of every leaf is the lit side. God rays stay enabled and
// still work with the sun off screen — they are simply not the centrepiece of this framing any more.
//
// Rotation IS the sun for a directional light: the position is ignored, and the renderer, the
// atmosphere and the clouds all read `worldForward`. The mapping is
//
//     forward = ( sin(yaw)·cos(pitch),  −sin(pitch),  cos(yaw)·cos(pitch) )
//
// so POSITIVE pitch points the light down — 24° here is the sun's elevation. Worth stating because the
// sign is easy to get backwards, and the first attempt (pitch 200) lit the terrain from underneath.
// The driver reads the resulting vector back and fails the build if the sun is below the horizon.
const SUN_ROTATION = [38, 215, 0];

// --------------------------------------------------------------------------------------------
// Noise
//
// Classic 2D Perlin over a seeded permutation. The landform has to be reproducible for the same reason
// the foliage does: this build's output is committed.

function makeNoise(seed) {
  let s = seed >>> 0 || 1;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 0x100000000; };
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  const P = new Uint8Array(512);
  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => {
    switch (h & 7) {
      case 0: return  x + y; case 1: return -x + y; case 2: return  x - y; case 3: return -x - y;
      case 4: return  x;     case 5: return -x;     case 6: return  y;     default: return -y;
    }
  };
  const lerp = (a, b, t) => a + (b - a) * t;
  return (x, y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const u = fade(xf), v = fade(yf);
    const aa = P[P[X] + Y], ab = P[P[X] + Y + 1], ba = P[P[X + 1] + Y], bb = P[P[X + 1] + Y + 1];
    const x1 = lerp(grad(aa, xf, yf), grad(ba, xf - 1, yf), u);
    const x2 = lerp(grad(ab, xf, yf - 1), grad(bb, xf - 1, yf - 1), u);
    return lerp(x1, x2, v);   // roughly [-1, 1]
  };
}

function fbm(noise, x, y, freq, octaves, gain = 0.5, lacunarity = 2.0) {
  let sum = 0, amp = 1, norm = 0, f = freq;
  for (let i = 0; i < octaves; i++) {
    sum += noise(x * f, y * f) * amp;
    norm += amp; amp *= gain; f *= lacunarity;
  }
  return sum / norm;
}

/**
 * Ridged multifractal: fold each octave about zero so its troughs become creases.
 *
 * Plain fBm alone gave a landform with no slope steeper than about 22 degrees, which left the rocky
 * paint layer at literally 0% coverage — the whole map was meadow. Ridges are what put real relief in
 * a terrain; smooth hills are the degenerate case.
 */
function ridged(noise, x, y, freq, octaves, gain = 0.5, lacunarity = 2.0) {
  let sum = 0, amp = 1, norm = 0, f = freq;
  for (let i = 0; i < octaves; i++) {
    sum += (1 - Math.abs(noise(x * f, y * f))) * amp;
    norm += amp; amp *= gain; f *= lacunarity;
  }
  return sum / norm * 2 - 1;   // back to roughly [-1, 1]
}

/** The value at `q` of the sorted copy of `values` — used to set thresholds by area, not by guess. */
function percentile(values, q) {
  const sorted = Float32Array.from(values).sort();
  return sorted[Math.max(0, Math.min(sorted.length - 1, Math.round(q * (sorted.length - 1))))];
}

const smoothstep = (a, b, t) => {
  const u = Math.max(0, Math.min(1, (t - a) / ((b - a) || 1e-6)));
  return u * u * (3 - 2 * u);
};
const clamp01 = (v) => Math.max(0, Math.min(1, v));

// --------------------------------------------------------------------------------------------
// Fetch helpers

async function bytesOf(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return new Uint8Array(await r.arrayBuffer());
}
async function jsonOf(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${r.status} ${url}`);
  return r.json();
}
const mimeOf = (name) => name.toLowerCase().endsWith('.png') ? 'image/png' : 'image/jpeg';

// Every texture payload the bundle ships, keyed by the id the materials reference. The id is the
// FILENAME, which is what the editor's own importer uses (`uniqueTextureId(file.name)`) — a uuid would
// leave the Assets explorer showing a wall of hex.
const textures = new Map();   // id -> { bytes, mime, config }
const masks = new Map();      // texture id -> coverage mask, reused across that material's map set

// --------------------------------------------------------------------------------------------
// Atlas dilation
//
// Every foliage atlas here is cut-outs on a PURE BLACK background — 89% of the grass sheet, 61% of
// the searsia leaves, 29% of the pine needles, and the gaps between the rock UV islands. The alpha
// that was meant to discard that background does not exist: these ship as JPEG.
//
// Mip-mapping then averages the black in. The 1x1 mip of the grass sheet is [15,15,10], so by the
// time a clump is a few pixels across it IS black — which is why the foliage read as black silhouettes
// at range, and why the rocks lost their surface detail to a dark seam at every island boundary.
//
// The fix is the standard one for cut-out atlases: fill the background with the surrounding real
// content so every mip level averages only real content.

const DILATE_LUMA = 12;             // below this is background; JPEG ringing keeps it off exact zero
const DILATE_MIN_FRACTION = 0.03;   // leave a fully covered map (a trunk, the ground set) alone

function coverageMask(img) {
  const data = img.data;
  const n = data.length / 4;
  const mask = new Uint8Array(n);
  let covered = 0;
  for (let i = 0; i < n; i++) {
    const l = (data[i * 4] * 299 + data[i * 4 + 1] * 587 + data[i * 4 + 2] * 114) / 1000;
    if (l >= DILATE_LUMA) { mask[i] = 1; covered++; }
  }
  return { mask, background: 1 - covered / n };
}

/**
 * Shrink a mask by `r`, dropping its outermost ring(s).
 *
 * The ring is the anti-aliased edge of each cut-out, blended toward the black background it was
 * composited against — so those texels are dark, and they are literally the black edges around every
 * leaf and blade. Excluding them from the seed set means the fill both draws from real interior colour
 * AND paints over the dark rim.
 *
 * Skipped when it would eat most of the mask: a grass blade is only a few texels wide.
 */
function erodeMask(mask, w, h, r) {
    const out = new Uint8Array(mask.length);
    let kept = 0, had = 0;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = y * w + x;
            if (!mask[i]) continue;
            had++;
            let ok = 1;
            for (let dy = -r; dy <= r && ok; dy++) {
                const ny = y + dy;
                if (ny < 0 || ny >= h) continue;
                for (let dx = -r; dx <= r; dx++) {
                    const nx = x + dx;
                    if (nx < 0 || nx >= w) continue;
                    if (!mask[ny * w + nx]) { ok = 0; break; }
                }
            }
            out[i] = ok;
            kept += ok;
        }
    }
    return kept >= had * 0.5 ? out : mask;
}

/**
 * Fill every background texel with a local average of the real content around it (pull-push).
 *
 * The first version of this took each background texel's NEAREST real texel, which is the textbook
 * answer and was wrong here: the nearest real texel to a background texel is by definition an edge
 * texel, and edge texels are the dark anti-aliased rim. Flooding from them spread the darkness instead
 * of removing it — the grass atlas's 1x1 mip only came up from [15,15,10] to [50,45,29] when the mean
 * of its actual blades is [139,138,95].
 *
 * Pull-push averages instead. Pull builds a pyramid where each level sums colour and coverage from the
 * four texels below, so a level's colour/weight is the mean of the real content under it. Push then
 * walks back down filling any texel with no coverage from its parent's mean. Near a blade the fill is
 * essentially that blade's colour; far from everything it is the atlas average. Linear in the texel
 * count, and it is the mip chain's own arithmetic run backwards, which is the thing being fixed.
 */
function fillBackground(img, mask) {
    const w0 = img.width, h0 = img.height, data = img.data;
    const levels = [];

    let col = new Float32Array(w0 * h0 * 3);
    let wt = new Float32Array(w0 * h0);
    for (let i = 0; i < w0 * h0; i++) {
        if (!mask[i]) continue;
        wt[i] = 1;
        col[i * 3] = data[i * 4];
        col[i * 3 + 1] = data[i * 4 + 1];
        col[i * 3 + 2] = data[i * 4 + 2];
    }
    levels.push({ w: w0, h: h0, col, wt });

    let cw = w0, ch = h0;
    while (cw > 1 || ch > 1) {
        const nw = Math.max(1, cw >> 1), nh = Math.max(1, ch >> 1);
        const nc = new Float32Array(nw * nh * 3), nwt = new Float32Array(nw * nh);
        for (let y = 0; y < nh; y++) {
            for (let x = 0; x < nw; x++) {
                let r = 0, g = 0, b = 0, a = 0;
                for (let dy = 0; dy < 2; dy++) {
                    const sy = Math.min(ch - 1, y * 2 + dy);
                    for (let dx = 0; dx < 2; dx++) {
                        const si = sy * cw + Math.min(cw - 1, x * 2 + dx);
                        r += col[si * 3]; g += col[si * 3 + 1]; b += col[si * 3 + 2]; a += wt[si];
                    }
                }
                const ni = y * nw + x;
                nc[ni * 3] = r; nc[ni * 3 + 1] = g; nc[ni * 3 + 2] = b; nwt[ni] = a;
            }
        }
        levels.push({ w: nw, h: nh, col: nc, wt: nwt });
        cw = nw; ch = nh; col = nc; wt = nwt;
    }

    for (let L = levels.length - 2; L >= 0; L--) {
        const cur = levels[L], up = levels[L + 1];
        for (let y = 0; y < cur.h; y++) {
            for (let x = 0; x < cur.w; x++) {
                const i = y * cur.w + x;
                if (cur.wt[i] > 0) continue;
                const ui = Math.min(up.h - 1, y >> 1) * up.w + Math.min(up.w - 1, x >> 1);
                if (up.wt[ui] <= 0) continue;
                // Levels above were summed during the pull, so normalize by their coverage; a filled
                // texel then carries colour at weight 1, matching level 0's convention.
                cur.col[i * 3] = up.col[ui * 3] / up.wt[ui];
                cur.col[i * 3 + 1] = up.col[ui * 3 + 1] / up.wt[ui];
                cur.col[i * 3 + 2] = up.col[ui * 3 + 2] / up.wt[ui];
                cur.wt[i] = 1;
            }
        }
    }

    const base = levels[0];
    for (let i = 0; i < w0 * h0; i++) {
        if (mask[i] || base.wt[i] <= 0) continue;
        data[i * 4] = Math.round(base.col[i * 3]);
        data[i * 4 + 1] = Math.round(base.col[i * 3 + 1]);
        data[i * 4 + 2] = Math.round(base.col[i * 3 + 2]);
    }
}

/**
 * Decode, optionally dilate, and hand back image bytes plus the coverage mask.
 *
 * `reuseMask` is how a material's normal and ORM maps get dilated against the DIFFUSE's silhouette.
 * Deriving a mask from a normal map's own luma would be wrong, and an ORM map's black background reads
 * as ambient occlusion 0 — a second, independent reason the foliage came out dark.
 */
async function prepareTexture(bytes, mime, reuseMask, wantAlpha) {
  const bitmap = await createImageBitmap(new Blob([bytes], { type: mime }));
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width; canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bitmap, 0, 0);
  bitmap.close();
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);

  let mask = reuseMask, background;
  if (!mask) {
    const c = coverageMask(img);
    mask = c.mask; background = c.background;
  } else {
    let covered = 0;
    for (let i = 0; i < mask.length; i++) covered += mask[i];
    background = 1 - covered / mask.length;
  }

  if (background < DILATE_MIN_FRACTION && !wantAlpha) return { bytes, mask, dilated: false, background };

  // The RGB fill still happens even when an alpha channel is going on: the cutout removes the
  // background from the SILHOUETTE, but mip-mapping still averages colour across the cutout boundary,
  // and unfilled black on the far side of that boundary darkens every distant leaf.
  fillBackground(img, erodeMask(mask, img.width, img.height, 1));

  if (wantAlpha) {
    // Straight (non-premultiplied) alpha, which is what the sampler wants and what PNG preserves.
    // Widened a texel first, for the same reason the grass cards are: mips average alpha, and an
    // alpha-tested leaf thins and then disappears as its mips fall under the 0.5 threshold.
    for (let i = 0; i < mask.length; i++) img.data[i * 4 + 3] = mask[i] ? 255 : 0;
    widenAlpha(img);
    ctx.putImageData(img, 0, 0);
    const parsed = cleo.parseBase64DataUri(canvas.toDataURL('image/png'));
    return { bytes: parsed.bytes, mask, dilated: true, alpha: true, background };
  }

  ctx.putImageData(img, 0, 0);
  // Re-encoded as JPEG at high quality. The source is JPEG already and the flooded regions are smooth,
  // so this costs far less than the lossless PNG a byte-exact round trip would need.
  const parsed = cleo.parseBase64DataUri(canvas.toDataURL('image/jpeg', 0.94));
  return { bytes: parsed.bytes, mask, dilated: true, background };
}

const dilationLog = [];
const maskedLog = [];

/**
 * The coverage mask of a diffuse map, decoded once and cached.
 *
 * Needed BEFORE the texture is registered, because whether it ships with an alpha channel depends on
 * whether the geometry that samples it actually lands on the background — and that can only be
 * measured against the mask.
 */
const maskCache = new Map();
async function diffuseMask(url) {
  if (maskCache.has(url)) return maskCache.get(url);
  const bitmap = await createImageBitmap(new Blob([await bytesOf(url)], { type: mimeOf(url) }));
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width; canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(bitmap, 0, 0);
  bitmap.close();
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const entry = { ...coverageMask(img), w: canvas.width, h: canvas.height };
  maskCache.set(url, entry);
  return entry;
}

/**
 * The fraction of a primitive's RENDERED SURFACE that lands on the atlas background.
 *
 * This is what decides whether a material needs an alpha cutout, and it is measured rather than
 * listed. The distinction matters both ways: the bark and trunk maps have no background at all, and
 * the ROCK atlas has plenty — 22% of its texels — but its closed meshes never sample it, so masking a
 * rock would punch holes rather than cut leaves. Points are sampled uniformly over each triangle,
 * area-weighted by picking triangles in proportion to their UV area.
 *
 * The V FLIP is the whole difficulty. glTF's origin is top-left with v increasing downward, but
 * `GLTFLoader` stores `1 - v` (gltfLoader.ts:615) and the upload then flips the texture again
 * (`UNPACK_FLIP_Y_WEBGL`), so the two cancel at draw time. Reading the image directly here cancels
 * nothing, so the row wanted is `(1 - v) * (h - 1)`.
 *
 * Getting it backwards samples the MIRROR image, and on a mostly-black atlas that still reads as "lots
 * of background" — it confirms the wrong answer instead of failing. It measured the searsia leaves at
 * 95% where the true figure is 62.6%, and flipped two rock LODs from 0% to 100%, which masked a solid
 * rock. Both decisions still came out usable by luck, which is exactly why it needed catching.
 */
function backgroundFraction(geometry, mask, w, h, samples = 40000) {
  const uv = geometry.uvs, idx = geometry.indices;
  const tris = idx.length / 3;
  if (!tris || !uv.length) return 0;

  const area = new Float64Array(tris);
  let total = 0;
  for (let t = 0; t < tris; t++) {
    const a = idx[t * 3], b = idx[t * 3 + 1], c = idx[t * 3 + 2];
    const e1x = uv[b * 2] - uv[a * 2], e1y = uv[b * 2 + 1] - uv[a * 2 + 1];
    const e2x = uv[c * 2] - uv[a * 2], e2y = uv[c * 2 + 1] - uv[a * 2 + 1];
    total += (area[t] = Math.abs(e1x * e2y - e1y * e2x) * 0.5);
  }
  if (total <= 0) return 0;
  const cum = new Float64Array(tris);
  let run = 0;
  for (let t = 0; t < tris; t++) cum[t] = (run += area[t] / total);

  let hits = 0;
  for (let i = 0; i < samples; i++) {
    const r = Math.random();
    let lo = 0, hi = tris - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
    const a = idx[lo * 3], b = idx[lo * 3 + 1], c = idx[lo * 3 + 2];
    const r1 = Math.sqrt(Math.random()), r2 = Math.random();
    const u = (1 - r1) * uv[a * 2] + r1 * (1 - r2) * uv[b * 2] + r1 * r2 * uv[c * 2];
    const v = (1 - r1) * uv[a * 2 + 1] + r1 * (1 - r2) * uv[b * 2 + 1] + r1 * r2 * uv[c * 2 + 1];
    const wrap = (t) => ((t % 1) + 1) % 1;
    const x = Math.min(w - 1, Math.max(0, Math.round(wrap(u) * (w - 1))));
    const y = Math.min(h - 1, Math.max(0, Math.round((1 - wrap(v)) * (h - 1))));
    if (!mask[y * w + x]) hits++;
  }
  return hits / samples;
}

async function registerTexture(url, id, opts = {}) {
  if (textures.has(id)) return id;
  const raw = await bytesOf(url);
  const prep = opts.dilate === false
    ? { bytes: raw, mask: null, dilated: false }
    : await prepareTexture(raw, mimeOf(id), opts.maskFrom ? masks.get(opts.maskFrom) : null,
                           !!opts.alpha);
  if (prep.mask) masks.set(id, prep.mask);
  if (prep.dilated) dilationLog.push({ id, background: +(prep.background * 100).toFixed(1) });
  if (prep.alpha) maskedLog.push(id);

  const mime = prep.alpha ? 'image/png' : mimeOf(id);
  const config = { wrapping: 'repeat', mipMap: true };
  const got = cleo.TextureManager.Instance.addTextureFromBytes(prep.bytes, mime, config, id);
  if (!got) throw new Error('texture rejected: ' + id);
  textures.set(id, { bytes: prep.bytes, mime, config });
  return id;
}

// --------------------------------------------------------------------------------------------
// Grass cards
//
// The engine already has instanced BILLBOARD foliage — a crossed quad, 4 triangles, an alpha cutout at
// 0.5 and its own shadow program — and it is the only way ground cover reaches a believable density
// here. A grass clump mesh is 714-2,489 triangles: at 6/m² inside 30 m that is 10.7M triangles for the
// grass alone. The same coverage in billboards is 0.15M.
//
// The one thing the path needs and the source does not provide is ALPHA. These atlases are JPEG, so
// the blades sit on black with nothing to cut against — a 3-channel texture samples a = 1 everywhere
// and the cutout renders two solid rectangles. The coverage mask the atlas fill already computes IS
// that alpha, so the cards are composited here out of the atlas's own blades.
//
// Two constraints from the billboard path, both easy to get wrong:
//   * The quad's v = 0 is at its BASE, and the texture upload flips Y, so v = 0 samples the BOTTOM row
//     of the image. Roots go at the bottom of the card.
//   * The sampler wraps `repeat` over UVs of exactly 0..1, so the outermost texels blend with the
//     opposite edge. The card keeps a transparent border.

const CARD_SIZE = 512;

/** Label the mask's connected components — one per blade — with their bounding boxes. */
function bladeIslands(mask, w, h) {
  const label = new Int32Array(w * h).fill(-1);
  const out = [];
  const stack = [];
  for (let start = 0; start < w * h; start++) {
    if (!mask[start] || label[start] >= 0) continue;
    const id = out.length;
    let x0 = w, y0 = h, x1 = 0, y1 = 0, area = 0;
    stack.push(start); label[start] = id;
    while (stack.length) {
      const i = stack.pop();
      const x = i % w, y = (i / w) | 0;
      area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && mask[i - 1] && label[i - 1] < 0) { label[i - 1] = id; stack.push(i - 1); }
      if (x < w - 1 && mask[i + 1] && label[i + 1] < 0) { label[i + 1] = id; stack.push(i + 1); }
      if (y > 0 && mask[i - w] && label[i - w] < 0) { label[i - w] = id; stack.push(i - w); }
      if (y < h - 1 && mask[i + w] && label[i + w] < 0) { label[i + w] = id; stack.push(i + w); }
    }
    out.push({ x0, y0, x1, y1, area, w: x1 - x0 + 1, h: y1 - y0 + 1 });
  }
  // The base of a blade is its WIDER end. Which end that is decides which way up it gets drawn, and
  // getting it wrong plants the tuft tip-down.
  for (const b of out) {
    let top = 0, bottom = 0;
    const band = Math.max(1, Math.round(b.h * 0.15));
    for (let y = b.y0; y < b.y0 + band; y++) for (let x = b.x0; x <= b.x1; x++) if (mask[y * w + x]) top++;
    for (let y = b.y1 - band + 1; y <= b.y1; y++) for (let x = b.x0; x <= b.x1; x++) if (mask[y * w + x]) bottom++;
    b.rootAtBottom = bottom >= top;
  }
  return out.filter(b => b.area >= 400 && b.h > b.w).sort((a, c) => c.area - a.area);
}

/**
 * Composite `count` grass cards from one blade atlas.
 *
 * RGB comes from the FILLED atlas (so bilinear filtering at a blade's edge picks up neighbouring blade
 * colour rather than black) while alpha comes from the UNERODED mask, so the blades keep their authored
 * width. The alpha is then widened by a texel: mipmapping averages alpha, and an alpha-tested blade
 * thins and finally vanishes as its mips drop under 0.5 — pre-widening buys back about one level.
 */
async function buildGrassCards(url, count, rand) {
  const raw = await bytesOf(url);
  const bitmap = await createImageBitmap(new Blob([raw], { type: 'image/jpeg' }));
  const w = bitmap.width, h = bitmap.height;
  const src = document.createElement('canvas');
  src.width = w; src.height = h;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(bitmap, 0, 0);
  bitmap.close();
  const img = sctx.getImageData(0, 0, w, h);
  const { mask } = coverageMask(img);
  fillBackground(img, erodeMask(mask, w, h, 1));
  for (let i = 0; i < w * h; i++) img.data[i * 4 + 3] = mask[i] ? 255 : 0;
  sctx.putImageData(img, 0, 0);

  const blades = bladeIslands(mask, w, h);
  if (blades.length < 4) throw new Error(`only ${blades.length} blades found in ${url}`);

  // The atlas mixes green blades with pale dry straw, and sorted by area alone the straw dominates —
  // the first cards came out looking like a field of dead reeds. Ordered by greenness instead, with
  // the straw kept but rationed to the last slot of each card.
  for (const b of blades) {
    let r = 0, g = 0, bl = 0, n = 0;
    for (let y = b.y0; y <= b.y1; y += 2)
      for (let x = b.x0; x <= b.x1; x += 2) {
        const i = y * w + x;
        if (!mask[i]) continue;
        r += img.data[i * 4]; g += img.data[i * 4 + 1]; bl += img.data[i * 4 + 2]; n++;
      }
    b.green = n ? (g - r) / n : -999;
  }
  blades.sort((a, c) => c.green - a.green);
  const dry = blades.filter(b => b.green < 0);
  const green = blades.filter(b => b.green >= 0);

  const cards = [];
  for (let c = 0; c < count; c++) {
    const card = document.createElement('canvas');
    card.width = CARD_SIZE; card.height = CARD_SIZE;
    const ctx = card.getContext('2d', { willReadFrequently: true });
    ctx.clearRect(0, 0, CARD_SIZE, CARD_SIZE);

    const n = 11;
    for (let i = 0; i < n; i++) {
      // One straw blade per card; the rest green.
      const b = (i === n - 1 && dry.length)
        ? dry[c % dry.length]
        : (green.length ? green[(i * 2 + c * 3) % green.length] : blades[i % blades.length]);
      const height = CARD_SIZE * (0.55 + rand() * 0.42);
      const scale = height / b.h;
      const angle = (rand() * 2 - 1) * 0.62;                 // +-35 degrees
      const baseX = CARD_SIZE * 0.5 + (rand() * 2 - 1) * CARD_SIZE * 0.22;
      const baseY = CARD_SIZE - 4;
      ctx.save();
      ctx.translate(baseX, baseY);
      ctx.rotate(angle);
      ctx.scale(scale, b.rootAtBottom ? scale : -scale);
      // Drawn with the blade's own bounding box as the source rect, anchored so its base sits on the
      // origin we just translated to.
      ctx.drawImage(src, b.x0, b.y0, b.w, b.h, -b.w / 2, b.rootAtBottom ? -b.h : 0, b.w, b.h);
      ctx.restore();
    }

    const out = ctx.getImageData(0, 0, CARD_SIZE, CARD_SIZE);
    // Pull-push the RGB out under the transparent texels — the same treatment the source atlas got
    // above, one level down and for the same reason. `clearRect` leaves RGB 0 wherever no blade was
    // drawn, `widenAlpha` then grows alpha over exactly those black texels, and every mip level
    // averages more of that black into the blades. A card is only ever seen past
    // `GRASS_CARD_DISTANCE` now, which is several mips down: precisely where it mattered most.
    const cardMask = new Uint8Array(CARD_SIZE * CARD_SIZE);
    for (let i = 0; i < cardMask.length; i++) cardMask[i] = out.data[i * 4 + 3] > 0 ? 1 : 0;
    fillBackground(out, cardMask);
    widenAlpha(out);
    // A transparent border, because the sampler wraps.
    for (let y = 0; y < CARD_SIZE; y++)
      for (let x = 0; x < CARD_SIZE; x++)
        if (x < 2 || y < 2 || x >= CARD_SIZE - 2 || y >= CARD_SIZE - 2)
          out.data[(y * CARD_SIZE + x) * 4 + 3] = 0;
    ctx.putImageData(out, 0, 0);

    // The SAME albedo grade the grass mesh material carries, applied to the card's pixels.
    //
    // An impostor's material is built by the engine (`Material.Basic({ color: [1,1,1], texture })` in
    // `_applyMeshPrototype`), so a rule cannot tint it — and an untinted card next to a graded mesh
    // makes the hand-off at 30 m a visible seam of pale straw against green. Applied in LINEAR space
    // because that is where the mesh multiply happens: `pow(texel, 2.2) * baseColor` in the PBR
    // G-buffer chunk against `toLinear(c.rgb)` in the billboard one. Reading the factor from
    // ALBEDO_LIFT rather than repeating it is what keeps the two from drifting apart.
    const grade = ALBEDO_LIFT.grass_medium_02;
    if (Array.isArray(grade)) {
      for (let i = 0; i < CARD_SIZE * CARD_SIZE; i++)
        for (let k = 0; k < 3; k++) {
          const lin = Math.pow(out.data[i * 4 + k] / 255, 2.2) * grade[k];
          out.data[i * 4 + k] = Math.round(Math.min(1, Math.pow(lin, 1 / 2.2)) * 255);
        }
      ctx.putImageData(out, 0, 0);
    }

    let cover = 0;
    for (let i = 0; i < CARD_SIZE * CARD_SIZE; i++) if (out.data[i * 4 + 3] >= 128) cover++;
    cards.push({ bytes: cleo.parseBase64DataUri(card.toDataURL('image/png')).bytes,
                 coverage: cover / (CARD_SIZE * CARD_SIZE) });
  }
  return cards;
}

/** Grow alpha by one texel (RGB untouched), to survive a mip level of alpha averaging. */
function widenAlpha(img) {
  const w = img.width, h = img.height, d = img.data;
  const a = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3];
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      let m = a[i];
      if (x > 0 && a[i - 1] > m) m = a[i - 1];
      if (x < w - 1 && a[i + 1] > m) m = a[i + 1];
      if (y > 0 && a[i - w] > m) m = a[i - w];
      if (y < h - 1 && a[i + w] > m) m = a[i + w];
      d[i * 4 + 3] = m;
    }
}

// --------------------------------------------------------------------------------------------
// Models
//
// The glTF is handed to the loader WITHOUT its texture files, on purpose. With a non-empty file list
// the loader resolves image URIs against it and returns undefined for anything absent, so no texture
// is uploaded and no uuid-keyed duplicate is registered. The materials it builds are discarded anyway,
// because the slots this scene wants are not the ones glTF describes:
//
//   * The ARM map goes into occlusion AND roughness AND metallic. A texture in more than one of those
//     three slots is what tells TexturePacker the map is already ORM-packed, so it takes the identity
//     path and hands the same texture back instead of baking a copy.
//   * `transparent` is forced off. Every source file declares alphaMode BLEND, which the loader turns
//     into a transparent material — that routes each leaf into the forward transparent pass, out of
//     the G-buffer, out of deferred lighting and out of the shadow maps. The diffuse maps are JPEG and
//     carry no alpha at all, and this vegetation is modelled geometry rather than alpha cards, so the
//     blend mode costs the deferred path and buys nothing.

async function loadModel(dir, base) {
  const gltfUrl = `${BUILD}${dir}/${base}.gltf`;
  const json = await jsonOf(gltfUrl);
  const files = [
    new File([await bytesOf(gltfUrl)], `${base}.gltf`),
    new File([await bytesOf(`${BUILD}${dir}/${base}.bin`)], `${base}.bin`),
  ];
  const parts = await new cleo.GLTFLoader().loadFromFiles(files);
  const prims = json.meshes[0].primitives;
  if (parts.length !== prims.length)
    throw new Error(`${base}: loader returned ${parts.length} parts for ${prims.length} primitives`);

  const out = [];
  for (let i = 0; i < parts.length; i++) {
    const gm = json.materials[prims[i].material];
    const uriOf = (t) => t === undefined || t === null ? null : json.images[json.textures[t].source].uri;
    const slots = {};
    const albedo = uriOf(gm.pbrMetallicRoughness?.baseColorTexture?.index);
    const normal = uriOf(gm.normalTexture?.index);
    const orm = uriOf(gm.pbrMetallicRoughness?.metallicRoughnessTexture?.index);
    const albedoId = albedo ? albedo.split('/').pop() : null;

    // Does this primitive need an alpha cutout? MEASURED, not listed.
    //
    // These atlases are cut-outs on black and ship as JPEG, so the alpha that was meant to discard the
    // background does not exist and the quad is drawn whole. Which primitives care is not obvious from
    // the material name or the atlas: the searsia leaves put 63% of their rendered surface on the
    // background and the twigs 34%, while every bark and trunk map is at 0.0% and the ROCK atlas has
    // 22% background that its closed meshes never sample — masking that one would punch holes.
    let cutoff = 0, background = 0;
    if (albedo) {
      const m = await diffuseMask(`${BUILD}${dir}/${albedo}`);
      background = backgroundFraction(parts[i].geometry, m.mask, m.w, m.h);
      // 5%: comfortably above the sampling noise and the stray texel at a UV seam, comfortably below
      // anything that is actually a cut-out.
      if (background > 0.05) cutoff = 0.5;
    }

    // Diffuse FIRST: it is the only map whose own pixels say where the cut-out is, and the normal and
    // ORM maps share its UVs, so they are filled against that same silhouette.
    const claim = (uri) => registerTexture(`${BUILD}${dir}/${uri}`, uri.split('/').pop(),
      { maskFrom: albedoId });
    if (albedo) slots.baseColorTexture = await registerTexture(`${BUILD}${dir}/${albedo}`, albedoId,
      { alpha: cutoff > 0 });
    if (normal) slots.normalMap = await claim(normal);
    if (orm) {
      const id = await claim(orm);
      // `_arm` is Poly Haven's name for an occlusion-roughness-metallic pack, the same channel order
      // glTF's ORM uses. Anything else here (the rocks ship a plain `_rough`) is a single grayscale
      // map, read from red, so it takes the roughness slot alone.
      if (/_arm[_.]/i.test(id)) { slots.occlusionMap = id; slots.roughnessMap = id; slots.metallicMap = id; }
      else slots.roughnessMap = id;
    }

    const lift = ALBEDO_LIFT[gm.name] ?? 1;
    const tint = Array.isArray(lift) ? lift : [lift, lift, lift];
    const material = cleo.Material.PBR({
      baseColor: tint,
      metallic: gm.pbrMetallicRoughness?.metallicFactor ?? 0,
      roughness: gm.pbrMetallicRoughness?.roughnessFactor ?? 1,
      alphaCutoff: cutoff,
      textures: slots,
    }, { side: gm.doubleSided ? 'double' : 'front', transparent: false, castShadow: true });

    materialFacts.push({ material: gm.name, background: +(background * 100).toFixed(1), cutoff, lift });
    out.push({ name: gm.name, model: new cleo.Model(parts[i].geometry, material), textureIds: Object.values(slots) });
  }
  return out;
}

/**
 * A deliberate albedo grade on the darkest source maps, as a `baseColor` multiplier.
 *
 * Measured mean albedo over LIT texels, converted to linear: pine bark 4.6%, trunk 3.4%, twig 8.0%,
 * searsia 16.4%. For scale, the soil these trees stand on is 20.1% and real pine bark reflects 10-15%
 * — at 3-5% the trunks render near-black under anything short of direct sun, which is what they did.
 * The factors below put them in a plausible range and leave everything else at 1.0.
 *
 * This is a grade, not a fix: the source maps are what they are, and the number is here in the open
 * rather than buried in an exposure or a light colour where it would silently move the whole scene.
 */
const ALBEDO_LIFT = {
  pine_tree_01_bark: 2.2,
  pine_tree_01_trunk_b: 2.4,
  pine_tree_01_dead_branches: 2.2,
  pine_tree_01_twig: 1.4,
  searsia_burchellii: 1.1,
  searsia_burchellii_leaves: 1.1,
  searsia_burchellii_twigs: 1.1,
  // The one entry that is a COLOUR rather than a brightness. The grass atlas is pale olive-khaki
  // (mean around [155,146,109]); at 0.16 clumps/m² of near-field detail that read as dry accent, but
  // as the ground cover over a green terrain it reads as straw. A mild green-ward multiplier lands it
  // near [120,145,60] without touching the dry straw blade each card keeps for variety.
  grass_medium_02: [0.72, 0.98, 0.45],
};

/** What the cutout measurement decided, per material — reported so a regression is one number away. */
const materialFacts = [];

// A model asset is a holder Node with one child ModelNode per source material — the shape the editor's
// own importer produces with "merge" left off, which is what keeps the Assets explorer, the material
// links and the foliage flattener all working on it unchanged.
const modelAssets = [];
const materialAssets = [];

async function buildModelAsset(name, parts, extra = {}) {
  const holder = new cleo.Node(name);
  const materialIds = [];
  const textureIds = new Set();
  for (const p of parts) {
    holder.addChild(new cleo.ModelNode(p.name, p.model));
    let asset = materialAssets.find(a => a.name === p.name);
    if (!asset) {
      asset = { id: newId(), name: p.name, material: p.model.material.serialize(), textureIds: p.textureIds, thumbnail: '' };
      materialAssets.push(asset);
    }
    materialIds.push(asset.id);
    p.textureIds.forEach(t => textureIds.add(t));
  }
  holder.updateTransforms();
  const nodeJson = await holder.serialize();
  // Link each child to its shared material asset. Written onto the JSON rather than through
  // setVariable so this stays clear of the node-variable access machinery; the editor reads exactly
  // these keys (`__materialId`, see utils/materials.ts).
  nodeJson.children.forEach((c, i) => {
    c.variables = { ...(c.variables || {}), __materialId: { type: 'string', value: materialIds[i] } };
  });
  const asset = { id: newId(), name, nodeJson, textureIds: [...textureIds], materialIds, thumbnail: '', ...extra };
  modelAssets.push(asset);
  return asset;
}

// --------------------------------------------------------------------------------------------

(async () => {
  try {
    const engine = new cleo.CleoEngine({
      graphics: { clearColor: [0.62, 0.74, 0.88, 1.0], deferred: true },
    });
    window.__engine = engine;
    if (typeof engine.initialize === 'function') await engine.initialize();
    engine.setViewport(document.getElementById('vp'));
    const renderer = engine.renderer;

    // ---------------------------------------------------------------------------------------
    // 1. Art
    log('loading models');
    const LEVELS = {
      pine: ['pine/pine_lod0', 'pine/pine_lod1', 'pine/pine_lod2'],
      searsiaMedium: ['searsiaMedium/searsia_medium_lod0', 'searsiaMedium/searsia_medium_lod1', 'searsiaMedium/searsia_medium_lod2'],
      searsiaSmall: ['searsiaSmall/searsia_small_lod0', 'searsiaSmall/searsia_small_lod1', 'searsiaSmall/searsia_small_lod2'],
    };
    for (const n of ['a', 'b', 'c', 'd', 'e'])
      LEVELS['grass_' + n] = [`grass/grass_medium_02_${n}_lod0`, `grass/grass_medium_02_${n}_lod1`,
                              `grass/grass_medium_02_${n}_lod2`];
    for (const n of ['07', '08', '09', '10', '11', '12', '13'])
      LEVELS['rock_' + n] = [`rocks/rock_moss_set_02_rock${n}_lod0`, `rocks/rock_moss_set_02_rock${n}_lod1`];

    const art = {};   // key -> [{ name, parts, asset }] most detailed first
    for (const [key, paths] of Object.entries(LEVELS)) {
      art[key] = [];
      for (const p of paths) {
        const slash = p.lastIndexOf('/');
        art[key].push({ name: p.slice(slash + 1), parts: await loadModel(p.slice(0, slash), p.slice(slash + 1)), asset: null });
      }
    }
    // A LOD level is a library REFERENCE, so every level needs its own asset and level 0 points at the
    // rest by id — which is what `resolvedLods` reads when the editor instantiates one. Built back to
    // front so the ids exist before level 0 needs them.
    for (const [key, levels] of Object.entries(art))
      for (let i = levels.length - 1; i >= 0; i--)
        levels[i].asset = await buildModelAsset(levels[i].name, levels[i].parts, i > 0 ? {} : {
          lods: levels.slice(1).map((l, k) => ({ distance: LOD_DISTANCE[key][k + 1], modelId: l.asset.id })),
          cullDistance: CULL[key],
        });
    log(`${modelAssets.length} model assets, ${materialAssets.length} materials, ${textures.size} textures`);
    log('dilated: ' + (dilationLog.map(d => `${d.id} ${d.background}%`).join(', ') || 'none'));

    // The ground maps. Roughness and AO are not shipped: a terrain layer samples albedo, normal and
    // displacement only — `Terrain._deriveLayerSurface` turns metallic and roughness into scalars.
    // Two ground surfaces, neither dilated: a tiling set has no cut-out background, and a displacement
    // map's dark half is signal rather than emptiness.
    //
    // Ground103 is BROWN SOIL, not grass; Ground110 is gravel/scree for the rocky layers. An early
    // build tinted the soil hard green to fake ground cover and the terrain read as a flat green
    // field, so it then shipped untinted — and past the foliage cull a 256 m vista was beige under
    // pale fog with no green in it anywhere. The layer tints below are the middle of those two: mild
    // enough that the near field is still soil between the clumps, present enough to carry the meadow
    // to the horizon.
    const solid = { dilate: false };
    const ground = async (dir, file, id) =>
      registerTexture(`${BUILD}ground/${file}`, id, solid);
    const SOIL = {
      color: await ground('', 'Ground103_1K-PNG_Color.png', 'Ground103_Color.png'),
      normal: await ground('', 'Ground103_1K-PNG_NormalGL.png', 'Ground103_NormalGL.png'),
      disp: await ground('', 'Ground103_1K-PNG_Displacement.png', 'Ground103_Displacement.png'),
    };
    const GRAVEL = {
      color: await ground('', 'Ground110_1K-JPG_Color.jpg', 'Ground110_Color.jpg'),
      normal: await ground('', 'Ground110_1K-JPG_NormalGL.jpg', 'Ground110_NormalGL.jpg'),
      disp: await ground('', 'Ground110_1K-JPG_Displacement.jpg', 'Ground110_Displacement.jpg'),
    };

    log('building grass cards');
    const cards = await buildGrassCards(BUILD + 'grass/textures/grass_medium_02_diff_1k.jpg', 3, Math.random);
    const CARD = cards.map((c, i) => {
      const id = `grass_card_${i}.png`;
      // Registered directly: these are authored RGBA and must NOT go through the atlas fill, which
      // would read their transparent background as something to flood.
      cleo.TextureManager.Instance.addTextureFromBytes(c.bytes, 'image/png', { wrapping: 'repeat', mipMap: true }, id);
      textures.set(id, { bytes: c.bytes, mime: 'image/png', config: { wrapping: 'repeat', mipMap: true } });
      log(`  ${id} ${(c.coverage * 100).toFixed(1)}% opaque, ${(c.bytes.length / 1e3).toFixed(0)} kB`);
      return { id, coverage: c.coverage };
    });

    // ---------------------------------------------------------------------------------------
    // 2. Landform
    log('generating heightfield');
    const noise = makeNoise(0x1a7e55);
    const half = SIZE / 2, element = SIZE / (RES - 1);
    const heights = new Float32Array(RES * RES);
    // Grid (r, c) -> world (x, z) exactly as Terrain.heightAt inverts it, so the splat painted below
    // lands on the surface it was computed from rather than drifting half a cell off it.
    const worldOf = (i) => i * element - half;

    for (let r = 0; r < RES; r++) {
      const z = worldOf(r);
      for (let c = 0; c < RES; c++) {
        const x = worldOf(c);
        let h = 28 * fbm(noise, x, z, 1 / 190, 5)
              + 15 * ridged(noise, x + 900, z - 400, 1 / 72, 4)
              +  3.0 * fbm(noise, x - 310, z + 780, 1 / 17, 3);
        // A valley along the NE-SW diagonal, so the vista has somewhere to lead the eye.
        const d = Math.abs((x - z) * Math.SQRT1_2);
        h -= 15 * Math.exp(-((d / 38) ** 2));
        heights[r * RES + c] = h;
      }
    }
    // Lift the field clear of zero, so nothing sits exactly on the origin plane.
    let hMin = Infinity, hMax = -Infinity;
    for (const h of heights) { if (h < hMin) hMin = h; if (h > hMax) hMax = h; }
    const lift = 1 - hMin;
    for (let i = 0; i < heights.length; i++) heights[i] += lift;
    hMin = 1; hMax += lift;

    // Slope from the same central differences Terrain._normalAt uses, so the auto height/slope masks
    // in the terrain shader agree with the splat painted against them.
    const slope = new Float32Array(RES * RES);
    for (let r = 0; r < RES; r++)
      for (let c = 0; c < RES; c++) {
        const cl = Math.max(0, c - 1), cr = Math.min(RES - 1, c + 1);
        const rd = Math.max(0, r - 1), ru = Math.min(RES - 1, r + 1);
        const dhx = (heights[r * RES + cr] - heights[r * RES + cl]) / ((cr - cl) * element);
        const dhz = (heights[ru * RES + c] - heights[rd * RES + c]) / ((ru - rd) * element);
        slope[r * RES + c] = 1 - 1 / Math.hypot(dhx, dhz, 1);   // 0 flat .. 1 vertical
      }

    // ---------------------------------------------------------------------------------------
    // 3. Splat
    //
    // Painted from the height and slope fields that made the terrain, plus one low-frequency mask for
    // the woodland, so the ground cover reads as a consequence of the landform rather than as noise
    // sprinkled over it. Channel = paint layer, and the DOMINANT channel is also what decides which
    // material's foliage rules may place an instance on a given square metre.
    log('painting splat');
    // Thresholds are PERCENTILES of the fields themselves, not absolute numbers. An absolute slope
    // cutoff is a guess about a landform that has not been generated yet, and the first one was wrong
    // by enough to give the rocky layer 0% of the map — the terrain simply never got that steep. By
    // area, scree is the steepest fifth and the creek bed is the lowest sixth, whatever the noise did.
    const sSteep = percentile(slope, 0.80), sCliff = percentile(slope, 0.96);
    const hLow = percentile(heights, 0.17), hBed = percentile(heights, 0.04);
    log(`slope band ${sSteep.toFixed(3)}..${sCliff.toFixed(3)}, low ground below ${hLow.toFixed(1)} m`);

    const splat = new Uint8Array(RES * RES * 4);
    const coverage = [0, 0, 0, 0];
    for (let r = 0; r < RES; r++)
      for (let c = 0; c < RES; c++) {
        const i = r * RES + c, x = worldOf(c), z = worldOf(r);
        const h = heights[i], s = slope[i];
        const rocky = smoothstep(sSteep, sCliff, s);
        const dirt = smoothstep(hLow, hBed, h) * (1 - rocky);
        const wood = clamp01(fbm(noise, x + 4200, z - 1700, 1 / 78, 3) * 1.6 + 0.30)
          * smoothstep(4, 11, h) * (1 - rocky) * (1 - dirt);
        const w = [Math.max(0, 1 - rocky - dirt - wood), wood, rocky, dirt];
        const sum = w[0] + w[1] + w[2] + w[3] || 1;
        // The last channel takes the rounding remainder, so every texel's weights sum to exactly 255
        // and no square metre ends up with a dominant layer decided by a rounding error.
        let acc = 0, dom = 0, best = 0;
        for (let k = 0; k < 4; k++) {
          const v = k === 3 ? 255 - acc : Math.round((w[k] / sum) * 255);
          splat[i * 4 + k] = v; acc += v;
          if (v > best) { best = v; dom = k; }
        }
        coverage[dom]++;
      }
    for (let k = 0; k < 4; k++) coverage[k] /= RES * RES;
    log('layer coverage ' + coverage.map(v => (v * 100).toFixed(1) + '%').join(' / '));

    // ---------------------------------------------------------------------------------------
    // 4. Terrain materials and their foliage
    //
    // One source texture set, four layers. The variety comes from tint, tiling, roughness and
    // displacement rather than from four downloads — which is also how a real paint set gets built.
    //
    // Each tint MULTIPLIES the ground albedo, so it is normalized to peak at 1.0 and only shifts hue.
    // Authored as standalone colours around 0.5 they halved the ground's brightness on top of the
    // sRGB->linear decode, and the whole terrain came out as dark olive.
    log('building terrain materials');
    const terrainMaterialAssets = [];

    // Density is instances per SQUARE METRE, and `generateFoliageEverywhere` draws candidates over the
    // WHOLE terrain and rejects any that do not land on its own layer. So a rule's effective density is
    // `density * coverage`, and the authored figure is divided by the coverage measured above to make
    // the number mean what it says.
    // What each height-driven rule actually ended up as, in metres, so the driver can gate it. The
    // clumps are 12-40 cm authored and differ 2.6x between variants; a shared scale range silently made
    // one of them ankle-deep and another invisible, and nothing in the frame stats could show that.
    const tuftFacts = [];

    // Authored height of a prototype's LOD0, in metres.
    //
    // The grass clumps are 12-40 cm tall and differ by 2.6x between variants, so one shared
    // `minScale`/`maxScale` across them means one is knee-high and another is invisible. Worse, they
    // were sharing the range the CARDS used — and a card is a 1x1 quad whose scale IS its height in
    // metres, so 0.85-1.6 read as 85-160 cm there and as 10-25 cm here. Measured from the geometry
    // rather than tabulated, so restaging different art cannot silently shrink the ground cover.
    const protoHeight = (key) => {
      let lo = Infinity, hi = -Infinity;
      for (const part of art[key][0].parts) {
        const pos = part.model.geometry.positions;
        for (let i = 1; i < pos.length; i += 3) { if (pos[i] < lo) lo = pos[i]; if (pos[i] > hi) hi = pos[i]; }
      }
      return Math.max(1e-4, hi - lo);
    };

    const foliageRule = (key, opts) => {
      const levels = art[key];
      const flat = (lvl) => lvl.parts.map(p => p.model.serialize());
      // `height` is the wanted tuft height in METRES; the scale range falls out of the measurement.
      // `minScale`/`maxScale` stay available for the props, whose authored size is already right.
      const h = opts.height ? protoHeight(key) : 0;
      const minScale = opts.height ? opts.height[0] / h : opts.minScale;
      const maxScale = opts.height ? opts.height[1] / h : opts.maxScale;
      if (opts.height) tuftFacts.push({ name: opts.name, authored: +h.toFixed(3),
                                        world: [+(minScale * h).toFixed(2), +(maxScale * h).toFixed(2)] });
      return {
        kind: 'mesh',
        name: opts.name,
        modelId: levels[0].asset.id,
        models: flat(levels[0]),
        lods: levels.slice(1).map((l, i) => ({ models: flat(l), distance: LOD_DISTANCE[key][i + 1] })),
        cullDistance: CULL[key],
        // Past this distance the layer draws each instance as a textured cross-quad instead of the
        // mesh. Optional — only the grass uses it; a tree read as a flat card would be worse than a
        // tree that simply stops.
        billboard: opts.card ? { textureId: opts.card, distance: GRASS_CARD_DISTANCE } : undefined,
        castShadows: !!opts.castShadows,
        density: opts.want / Math.max(0.02, coverage[opts.layer]),
        // Without this marker TerrainMaterial.parse takes the rule for a pre-per-m² one and divides
        // the density by 100 on the way in — the scene would open with 1% of its foliage.
        densityUnit: 'm2',
        minScale, maxScale,
        collision: opts.collision ?? null,
      };
    };

    const makeTerrainMaterial = (name, surface, tint, roughness, cfg, rules, exclude) => {
      const tm = cleo.TerrainMaterial.Create('pbr', {
        baseColor: tint, metallic: 0, roughness,
        textures: { baseColorTexture: surface.color, normalMap: surface.normal },
      });
      tm.tiling = cfg.tiling;
      tm.auto = !!cfg.auto;
      if (cfg.hRange) tm.hRange = cfg.hRange;
      if (cfg.sRange) tm.sRange = cfg.sRange;
      // The displacement map lives in the material's own texture map, not the PBR slot set: the
      // terrain shader reads it for the parallax offset and the height-aware blend.
      tm.textures.set('displacementMap', surface.disp);
      tm.displacementScale = cfg.displacementScale;
      tm.heightBlend = cfg.heightBlend;
      tm.foliageInclude = rules;
      tm.foliageExclude = exclude ?? [];
      const asset = {
        id: newId(), name, material: tm.serialize(),
        textureIds: [surface.color, surface.normal, surface.disp], thumbnail: '',
      };
      terrainMaterialAssets.push(asset);
      return asset;
    };

    // One rule per PROTOTYPE across the whole terrain: a prototype named by rules on two layers becomes
    // two FoliageLayers and its geometry is embedded twice in the scene blob. a/c/e carry the meadow,
    // d the forest understory, b the creek bed — five meshes, five rules, nothing duplicated. (`b` was
    // staged and shipped and referenced by nothing at all until now.)
    const GRASS = ['a', 'b', 'c', 'd', 'e'];
    const GRASS_RULE_NAMES = GRASS.map(n => 'grass clump ' + n);

    // Layer 0 — soil under dense ground cover, tinted toward green.
    //
    // It was untinted, on the reasoning that the ground cover standing on it is what should read as
    // grass. True where the cover is drawn, and the cover stops at 70 m: past that a 256 m vista was
    // beige soil under pale fog with nothing green in it at all. The tint is what carries the meadow
    // to the horizon. Kept mild — this multiplies an albedo that is already a photographed soil, and
    // a strong green here turns the near field into felt.
    const meadow = makeTerrainMaterial('Meadow Soil', SOIL, [0.86, 0.93, 0.70], 0.95,
      { tiling: 52, displacementScale: 0.05, heightBlend: 1.4 },
      [
        // THREE rules rather than one dense one. `want` is per m² of the WHOLE terrain and a rule places
        // about `want * 65536` instances, so `FoliageLayer`'s MAX_INSTANCES (200,000) is a hard ceiling
        // near 3.0 on any single rule — splitting is what buys density. On the layer itself the density
        // is `want / coverage`, so 0.5 across three rules is ~2.4 clumps/m² of meadow, against the 0.49
        // the mesh rules used to contribute while the cards did the actual covering.
        ...['a', 'c', 'e'].map((n, i) => foliageRule('grass_' + n, {
          // Tall for grass, deliberately: this is a VISTA scene and its camera stands 2 m up looking
          // out, so almost everything on screen is 20 m away or more. At 34-70 cm the cover was
          // physically honest and read as ground texture rather than as a meadow. 45-95 cm is still
          // inside what real meadow grass does and it reads from the viewpoint the scene is built for.
          name: 'grass clump ' + n, layer: 0, want: 0.45, height: [0.45, 0.95],
          card: CARD[i].id,
        })),
        // One rule per PROTOTYPE across the whole terrain, not one per layer. A prototype named by
        // rules on two layers becomes two FoliageLayers, and its geometry is then embedded four times
        // in the scene rather than two — which is what pushed the scene JSON over V8's string limit.
        foliageRule('searsiaSmall', {
          // No shadow cascades for the small shrub: a foliage layer that casts is redrawn once per
          // cell PER CASCADE, and at ~200 instances of a 1.9 m plant that was the single largest line
          // in the frame's triangle count for a shadow nobody reads.
          name: 'meadow shrub', layer: 0, want: 0.003, minScale: 0.8, maxScale: 1.7,
          collision: { shape: 'cylinder', radius: 0.35, height: 2 },
        }),
        foliageRule('rock_12', {
          name: 'field stone', layer: 0, want: 0.002, minScale: 0.6, maxScale: 1.4,
          collision: { shape: 'sphere', radius: 0.55 },
        }),
      ]);

    // Darker and greener than the meadow: leaf litter under canopy, not open ground.
    const forest = makeTerrainMaterial('Forest Floor', SOIL, [0.68, 0.78, 0.58], 0.92,
      { tiling: 44, auto: true, hRange: [3, 34], sRange: [0, 0.55], displacementScale: 0.07, heightBlend: 1.8 },
      [
        foliageRule('pine', {
          name: 'pine', layer: 1, want: 0.0010, minScale: 0.7, maxScale: 1.35, castShadows: true,
          collision: { shape: 'cylinder', radius: 0.5, height: 8 },
        }),
        // One rule for the searsia, with a wide scale range instead of two rules at different sizes:
        // every rule builds its own FoliageLayer carrying its own copy of the prototype, so a second
        // rule on the same mesh pays for that mesh twice in the scene blob.
        foliageRule('searsiaMedium', {
          name: 'forest shrub', layer: 1, want: 0.002, minScale: 0.75, maxScale: 1.6,
          collision: { shape: 'cylinder', radius: 0.4, height: 2.6 },
        }),
        foliageRule('rock_09', {
          name: 'mossy stone', layer: 1, want: 0.003, minScale: 0.6, maxScale: 1.2,
          collision: { shape: 'sphere', radius: 0.5 },
        }),
        foliageRule('grass_d', {
          name: 'grass clump d', layer: 1, want: 0.45, height: [0.36, 0.72],
          card: CARD[2].id,
        }),
      ]);

    // Layer 2 — Ground110, the gravel/scree set, on the steepest fifth of the terrain.
    const rocky = makeTerrainMaterial('Rocky Slope', GRAVEL, [1.00, 1.00, 1.00], 0.80,
      { tiling: 30, auto: true, hRange: [0, 60], sRange: [0.38, 1], displacementScale: 0.12, heightBlend: 2.6 },
      ['07', '10', '11', '13'].map(n => foliageRule('rock_' + n, {
        name: 'boulder ' + n, layer: 2, want: 0.005, minScale: 0.7, maxScale: 1.9,
        collision: { shape: 'sphere', radius: 0.6 },
      })),
      // Nothing green on scree. The exclude list is by rule NAME and applies wherever this layer has
      // real weight rather than only where it dominates, which is what keeps the meadow's cover from
      // creeping up the last few metres of a rock face.
      GRASS_RULE_NAMES);

    // Layer 3 — the same gravel at half the tiling, so the creek bed reads as coarse pebbles rather
    // than as more of the slope above it.
    const dirt = makeTerrainMaterial('Creek Gravel', GRAVEL, [1.00, 0.97, 0.92], 0.88,
      { tiling: 16, auto: true, hRange: [0, 9], sRange: [0, 0.4], displacementScale: 0.06, heightBlend: 1.2 },
      [
        foliageRule('rock_08', {
          name: 'creek stone', layer: 3, want: 0.007, minScale: 0.5, maxScale: 1.1,
          collision: { shape: 'sphere', radius: 0.4 },
        }),
        // The creek bed gets the last unused prototype, short and sparse: coverage here is 9%, so
        // `want / coverage` is a big multiplier and a meadow figure would carpet it.
        foliageRule('grass_b', {
          name: 'grass clump b', layer: 3, want: 0.25, height: [0.25, 0.50],
          card: CARD[1].id,
        }),
      ]);

    // ---------------------------------------------------------------------------------------
    // 5. Terrain
    //
    // Built by DESERIALIZING a blob rather than by sculpting. `Terrain.deserialize` is the one path
    // that installs heights, splat, layer materials and foliage together and refreshes the chunk
    // geometry, and it is the same path the editor takes when it opens this scene — so anything the
    // builder can round-trip through it is something the editor cannot fail to read.
    log('building terrain');
    const u16 = new Uint16Array(heights.length);
    const span = (hMax - hMin) || 1;
    for (let i = 0; i < heights.length; i++) u16[i] = Math.round(((heights[i] - hMin) / span) * 65535);
    const terrain = cleo.Terrain.deserialize({
      size: SIZE, resolution: RES, chunkQuads: CHUNK_QUADS,
      heightFormat: 'u16', heightMin: hMin, heightMax: hMax,
      heights: cleo.bytesToBase64(new Uint8Array(u16.buffer)),
      splatRes: RES, splat: cleo.bytesToBase64(splat),
      layers: [meadow, forest, rocky, dirt].map(a => ({
        materialId: a.id, material: a.material, textureId: null,
        tiling: a.material.tiling, auto: a.material.auto,
        hRange: a.material.hRange, sRange: a.material.sRange,
      })),
      foliage: [],
      foliageColliders: { enabled: true, radius: 45, maxBodies: 320 },
    });
    const scattered = terrain.generateFoliageEverywhere();
    log(`foliage: ${scattered.placed} instances across ${scattered.layers} layers`
      + (scattered.reason ? ` (${scattered.reason})` : ''));
    if (scattered.placed === 0) throw new Error('foliage generation placed nothing: ' + scattered.reason);

    // ---------------------------------------------------------------------------------------
    // 6. Scene
    log('assembling scene');
    const scene = new cleo.Scene();

    const sun = new cleo.LightNode('sun', new cleo.DirectionalLight({
      diffuse: [1.0, 0.94, 0.82], specular: [1.0, 0.97, 0.9], ambient: [0.26, 0.29, 0.34],
    }), true);
    sun.setRotation(SUN_ROTATION);
    scene.addNode(sun);

    scene.addNode(new cleo.LandscapeNode('Landscape', terrain));

    scene.addNode(new cleo.SkyAtmosphereNode('sky atmosphere', {
      exposure: 1.15, mieG: 0.78, sunDiskSize: 1.4, resolution: 256,
      // The atmosphere paints everything below its own horizon with this, and a 256 m terrain does
      // not reach that horizon — so whatever is here shows up as a wedge between the far hills and the
      // sunset. The default dark brown read as a wall of shadow, and even a mid grey stayed dark once
      // the Nishita bake attenuated it at a low sun. Near-white is what makes it read as the aerial
      // haze it is standing in for.
      groundColor: [0.88, 0.86, 0.80],
      // Aerial perspective and light shafts are both opt-in (default false) and are most of what makes
      // a 256 m vista read as distance rather than as a flat backdrop.
      // Fog dialled back from 0.0022/50/0.55. At those figures `1 - exp(-(dist - 50) * density)` was
      // already 0.36 at 250 m and the height falloff still left ~70% strength on the hilltops, so a
      // 256 m map was a third veiled everywhere and the beige ground read as grey. Aerial perspective
      // should say "far", not "washed out": it now starts further out and tops out at a third rather
      // than at over half.
      fogEnabled: true, fogDensity: 0.0016, fogStart: 90, fogMaxOpacity: 0.34,
      fogHeight: 12, fogHeightFalloff: 0.02, fogColorBlend: 0.1,
      godRaysEnabled: true, godRayDensity: 0.55, godRayExposure: 0.22,
      godRayAnisotropy: 0.72, godRayMaxDistance: 180,
    }));

    scene.addNode(new cleo.VolumetricCloudsNode('volumetric clouds', {
      coverage: 0.46, density: 1.05, cloudType: 0.62,
      baseAltitude: 900, thickness: 850,
      windSpeed: 7, windDirection: [0.8, 0, 0.6],
      steps: 48, lightSteps: 6, opacity: 0.95,
    }));

    // Bounded, so the deferred path's two probe slots resolve deterministically, and wide enough to
    // cover the playable middle of the map. None of its cubemaps are serialized — the probe re-bakes
    // on load — so this costs the bundle nothing.
    const probe = new cleo.LightProbeNode('light probe', { resolution: 256, mode: 'baked', intensity: 1.15 });
    probe.size = [230, 110, 230];
    probe.blendDistance = 45;
    probe.setPosition([0, terrain.heightAt(0, 0) + 22, 0]);
    scene.addNode(probe);

    // The vista, CHOSEN rather than authored.
    //
    // A hand-picked spot was tried first and flattening the terrain under it to stand on was worse than
    // the problem: the flat patch fell below the low-ground percentile, so it painted as creek dirt, and
    // the shot opened on a barren bowl with the landscape hanging above the frame. Picking a real high
    // point instead means the viewpoint follows the noise, the foreground is whatever the splat put
    // there, and neither has to be re-tuned when the seed changes.
    //
    // Wanted: high, standable, out in the ring rather than at the centre, and on a layer that carries
    // ground cover — a vantage point looking over bare scree is not a landscape shot.
    let camX = 0, camZ = 0, camScore = -Infinity, camLayer = -1;
    for (let r = 2; r < RES - 2; r++)
      for (let c = 2; c < RES - 2; c++) {
        const i = r * RES + c, x = worldOf(c), z = worldOf(r);
        const ring = Math.hypot(x, z);
        if (ring < 55 || ring > 112) continue;
        if (slope[i] > sSteep) continue;                        // not standable
        const dom = [0, 1, 2, 3].reduce((b, k) => splat[i * 4 + k] > splat[i * 4 + b] ? k : b, 0);
        if (dom === 2 || dom === 3) continue;                   // scree or creek bed: no cover
        // Height above the valley floor is what makes the shot; the ring term keeps it from creeping in.
        const score = heights[i] - ring * 0.05;
        if (score > camScore) { camScore = score; camX = x; camZ = z; camLayer = dom; }
      }
    const eye = [camX, terrain.heightAt(camX, camZ) + 2.6, camZ];
    // Aimed at the valley floor rather than above it. The atmosphere paints everything below its own
    // horizon, and a 256 m terrain does not reach that horizon, so every degree of sky the framing
    // gives away comes back as an empty haze band between the far hills and the sunset.
    const target = [0, terrain.heightAt(0, 0) + 3, 0];
    const dir = [target[0] - eye[0], target[1] - eye[1], target[2] - eye[2]];
    const dLen = Math.hypot(dir[0], dir[1], dir[2]) || 1;
    // Inverting `forward = (sin(yaw)cos(pitch), -sin(pitch), cos(yaw)cos(pitch))` — the same mapping
    // SUN_ROTATION documents, and the reason a hand-guessed yaw pointed the camera off the map.
    const camRot = [
      Math.asin(Math.max(-1, Math.min(1, -dir[1] / dLen))) * 180 / Math.PI,
      Math.atan2(dir[0], dir[2]) * 180 / Math.PI,
      0,
    ];
    log(`camera at ${camX.toFixed(0)}, ${eye[1].toFixed(1)}, ${camZ.toFixed(0)}`
      + ` on layer ${camLayer}, rotation ${camRot.map(v => v.toFixed(1)).join(', ')}`);
    const camera = new cleo.CameraNode('camera', new cleo.Camera({ type: 'perspective', fov: 50, near: 0.15, far: 900 }));
    camera.setPosition(eye);
    camera.setRotation(camRot);
    camera.active = true;
    scene.addNode(camera);

    engine.setScene(scene);
    scene.start();
    // Without this nothing ever renders: `CleoEngine` does not start its own loop, and every check
    // downstream — the probe bake, the atmosphere bake, the frame stats, the window capture — is
    // downstream of a frame having actually happened.
    engine.run();
    // `_paused` defaults to TRUE, and `Scene.update` gates `node.update()` on it. `CameraNode.update`
    // is what copies the node's world transform onto the `Camera` object the renderer actually draws
    // with, so a paused engine renders every frame from a Camera still sitting at the origin — which
    // here is underneath the terrain, looking out sideways at its edge. The frame stats and the frustum
    // culling both looked healthy the whole time, because they are computed from that same stale
    // camera; only the picture was wrong. Unpausing also runs physics, which is what builds the
    // heightfield body and the pooled foliage colliders, so the scene is walked before it is shipped.
    engine.isPaused = false;

    // ---------------------------------------------------------------------------------------
    // 7. Look
    const settings = renderer.getRenderSettings();
    Object.assign(settings, {
      clearColor: [0.62, 0.74, 0.88, 1.0],
      quality: 'custom',
      exposure: 1.1,
      bloomThreshold: 1.15, bloomKnee: 0.6, bloomIntensity: 0.35,
      ssaoEnabled: true, ssaoRadius: 0.6, ssaoPower: 1.6, ssaoBias: 0.03,
      motionBlurEnabled: false,
      frustumCulling: true,
      // The default 100/3 would end the shadows a quarter of the way across a 256 m terrain.
      shadowsEnabled: true, shadowDistance: 130, shadowCascades: 3, shadowMapResolution: 2048,
      shadowSplitLambda: 0.72, shadowNormalBias: 1.8, shadowDepthBias: 0.035,
      shadowFilterMode: 1, shadowFilterRadius: 2.0, shadowCascadeBlend: 0.12,
      // Every foliage rule carries its own cullDistance, so this is only the ceiling for anything that
      // does not; the cell size stays at the tuned default.
      foliageCullDistance: 240, foliageCellSize: 13,
      terrainLodEnabled: true, terrainLodDistance1: 140, terrainLodDistance2: 340,
      terrainLodStep1: 2, terrainLodStep2: 4,
    });
    renderer.applyRenderSettings(settings);

    // Let the atmosphere bake, the probe capture it (that order is load-bearing — the probe draws the
    // sky first, so an unbaked atmosphere bakes flat clear-colour into the IBL), the textures finish
    // decoding and the terrain LOD settle.
    log('rendering');
    // Sampled as a PEAK over many frames, not read once. Shadow cascades are staggered (the distant
    // ones re-render every 2nd and 4th frame) and the foliage LOD buckets settle over a few frames, so
    // a single-frame reading of frameStats is a lottery — which is exactly how a scene that draws
    // millions of triangles can report a handful.
    const peak = async (frames) => {
      const best = { drawCalls: 0, instancedDrawCalls: 0, triangles: 0, instances: 0, objects: 0, shadedMpx: 0 };
      for (let i = 0; i < frames; i++) {
        await new Promise(r => requestAnimationFrame(r));
        for (const k of Object.keys(best)) best[k] = Math.max(best[k], cleo.frameStats[k]);
      }
      return best;
    };
    const stats = await peak(150);

    /**
     * Drop the derived tangent frame from every geometry in a serialized graph.
     *
     * `Model.serialize` writes positions, normals, UVs, indices AND tangents/bitangents — 6 of the 14
     * floats a vertex costs. `Geometry`'s constructor recomputes both when they are absent, so this is
     * derived data being stored, and dropping it costs one `_calculateTangents` per prototype on load.
     *
     * It has to happen HERE, at the serialization boundary, not when the foliage rules are built. A
     * foliage prototype's geometry is embedded four times over — the model library, the terrain
     * material asset, the scene's copy of that material on the layer, and the scattered layer — and the
     * scattered layer re-serializes from LIVE `Model` objects whose Geometry has already recomputed the
     * tangents it was handed without. Stripping the rules alone reached two of the four copies.
     *
     * The reason to care is that the JSON intermediate is this pipeline's real ceiling: geometry
     * serializes as decimals at ~370 bytes a triangle, V8 refuses a string past ~512 MB, and the scene
     * piece carries two of the four copies.
     */
    const stripTangentFrames = (value) => {
      if (Array.isArray(value)) {
        for (const v of value) if (v && typeof v === 'object') stripTangentFrames(v);
        return;
      }
      if (!value || typeof value !== 'object') return;
      const g = value.geometry;
      if (g && typeof g === 'object' && Array.isArray(g.positions)) {
        delete g.tangents;
        delete g.bitangents;
      }
      for (const k of Object.keys(value)) {
        const child = value[k];
        if (child && typeof child === 'object') stripTangentFrames(child);
      }
    };

    // ---------------------------------------------------------------------------------------
    // 8. Serialize
    log('serializing');
    // `true` = use the cache and do NOT embed texture data. The payloads ship once as bundle assets;
    // embedding them here would put a second copy of a 14 MB texture set inside the scene blob.
    const sceneJson = await scene.serialize(true);
    const sceneId = newId();
    const sceneData = {
      scene: sceneJson.scene,
      config: { graphics: { clearColor: settings.clearColor }, render: settings },
      savedAt: Date.now(),
    };
    // Applied BEFORE the round trip below, so the re-parse exercises exactly what ships — including the
    // `_calculateTangents` that has to run in place of the frames just dropped.
    stripTangentFrames(sceneData);

    // What the scene blob is actually made of, measured piece by piece.
    //
    // Worth reporting because the whole-scene stringify is the pipeline's ceiling and its failure says
    // nothing about which part is heavy. Each part serializes fine on its own; only the total does not.
    const landJson = sceneData.scene.children.find(c => c.type === 'landscape');
    const sceneParts = [];
    if (landJson) {
      landJson.terrain.layers.forEach((l, i) => {
        if (l?.material) sceneParts.push({ part: `layer ${i} material`, mb: +(JSON.stringify(l.material).length / 1e6).toFixed(1) });
      });
      let scattered = 0;
      for (const f of landJson.terrain.foliage) scattered += JSON.stringify(f).length;
      sceneParts.push({ part: 'scattered layers', mb: +(scattered / 1e6).toFixed(1) });
    }
    log('scene parts: ' + sceneParts.map(p => `${p.part} ${p.mb}MB`).join(', '));
    window.__sceneParts = () => sceneParts;

    // ---------------------------------------------------------------------------------------
    // 9. Round trip
    //
    // The real gate. Parse the JSON that is about to be written into a fresh Scene and render it —
    // the same work the editor does on open, so a scene that survives this is a scene that opens. A
    // structural mistake is otherwise invisible until someone clicks the gallery card.
    // Deferred until the DRIVER asks, after it has taken its screenshots, and it disposes the original
    // scene first. Run inline it meant two complete copies of the terrain resident at once — every
    // foliage prototype's geometry twice on the heap and twice on the GPU — and at this scene's size
    // that stopped being slow and started being a timeout.
    const reparse = { ok: false, error: null, triangles: 0, foliage: 0, layers: 0, ran: false };
    window.__verify = async () => {
      reparse.ran = true;
      try {
        // Hand the GPU back before asking it for a second terrain: swap the scene out, let several
        // frames drain so nothing in flight still references the old buffers, and only then dispose.
        const land0 = [...scene.landscapes][0];
        engine.setScene(new cleo.Scene());
        for (let i = 0; i < 8; i++) await new Promise(r => requestAnimationFrame(r));
        if (land0) land0.terrain.dispose();
        for (let i = 0; i < 8; i++) await new Promise(r => requestAnimationFrame(r));
        if (window.__contextLost) throw new Error('WebGL context was lost before the round trip');

        const check = new cleo.Scene();
        check.parse(JSON.parse(JSON.stringify({ scene: sceneData.scene })), true);
        engine.setScene(check);
        check.start();
        if (!check.activeCamera) throw new Error('no active camera after reparse');
        const land = [...check.landscapes][0];
        if (!land) throw new Error('no landscape after reparse');
        reparse.layers = land.terrain.layers.filter(l => l && l.material).length;
        reparse.foliage = land.terrain.foliage.reduce((n, f) => n + f.count, 0);
        reparse.triangles = (await peak(45)).triangles;
        // The probe on the REPARSED scene: it deserializes with `needsBake` true and captures on the
        // first frame above, so this is the bake the editor gets when someone opens the example.
        const rp = [...check.lightProbes][0];
        reparse.probe = rp ? { found: true, baked: rp.lastBakeTime > 0, hasMaps: rp.hasBakedMaps } : { found: false };
        reparse.ok = true;
      } catch (e) {
        reparse.error = String((e && e.stack) || e);
      }
      return reparse;
    };
    // Left rendering the real scene: the driver's cover image is a capture of this window.
    await peak(45);

    // ---------------------------------------------------------------------------------------
    // 10. Bundle pieces
    //
