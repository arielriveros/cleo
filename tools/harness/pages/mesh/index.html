<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cleo mesh check</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #202028; }
  #vp { position: absolute; inset: 0; }
</style>
<script src="cleo.js"></script>
</head>
<body>
<div id="vp"></div>
<script>
// Drives the engine's public API directly — no editor, no project gate, no 206 MB import.
//
// The point is the vertex layout: a Cube plus a Sphere with a PBR material exercise the full
// five-attribute model vertex (position, normal, uv, tangent, bitangent) through initializeVAO, which
// is what M1 rewrote. A scrambled stride or offset shows up here as visibly wrong geometry, and shows
// up nowhere in the type checker or the DOM-free unit tests.
window.__ready = false;
window.__error = null;

(async () => {
  try {
    // `?forward=1` builds the same scene through the FORWARD renderer instead of the deferred one.
    //
    // The two are separate pipelines with separate shaders: deferred draws through geometryPBR into a
    // G-buffer and lights it in deferredLighting, while forward runs materials/pbr.fs per object. A
    // harness that only ever ran deferred left every forward material shader unexercised — converting
    // one would change nothing any check could see. `_deferred` is construction-time config with no
    // setter, so the mode is chosen here rather than toggled later.
    const forwardMode = new URLSearchParams(location.search).get('forward') === '1';
    // `?backend=webgpu` asks for a WebGPU device instead of WebGL2 — a REQUEST, which
    // resolveBackendRequest still gets the last word on. The gate it checks is opened by
    // `?cleoWebgpuProbe=1`, which the engine reads straight off location.search and this page
    // therefore never has to forward. See tools/harness/webgpuBootCheck.js.
    const backend = new URLSearchParams(location.search).get('backend') || undefined;
    // `?seed=1` — a deterministic Math.random for the WHOLE page, installed BEFORE the engine exists.
    //
    // Opt-in, and that is the entire design. The full-scene block below seeds only itself, and says
    // why: a page-wide seed also reseeds the SSAO hemisphere kernel and its 4x4 rotation-noise
    // texture, which are built at renderer construction and are baked into baselines recorded before
    // any of this existed. So the default is untouched and every existing baseline stays valid.
    //
    // What it buys is the one thing the cross-backend diff cannot get any other way: two windows, two
    // renderers, ONE SSAO kernel. Without it `ssao` and `debugSSAO` differ between the backends for a
    // reason that has nothing to do with either backend, and the only honest thing to do with them is
    // not compare them at all. See tools/harness/backendDiff.js.
    if (new URLSearchParams(location.search).get('seed') === '1') {
      let seed = 0x9e3779b9;
      Math.random = () => {
        // xorshift32: no library, no state beyond one word, and identical on every machine.
        seed ^= seed << 13; seed >>>= 0;
        seed ^= seed >> 17;
        seed ^= seed << 5;  seed >>>= 0;
        return seed / 0x100000000;
      };
    }
    const engine = new cleo.CleoEngine({
      graphics: { clearColor: [0.08, 0.08, 0.11, 1.0], deferred: !forwardMode, backend },
    });
    // Exposed BEFORE initialize(), which can now REJECT. deviceProbe is only interesting when startup
    // failed, and the __renderer assignment further down never runs in that case.
    window.__engine = engine;
    window.__renderer = engine.renderer;
    window.__pipeline = forwardMode ? 'forward' : 'deferred';
    // Which programs actually BIND, as opposed to merely compiling.
    //
    // `__shaderNames` answers "what did the renderer build for this scene", which turned out to be all
    // 57 of them regardless of content — so it cannot tell you whether a shader contributes pixels.
    // ShaderManager.bind is the one choke point every draw goes through — the RHI pipelines route
    // through it too — so wrapping it gives the real answer. Kept in the harness rather than the
    // engine: this is a measurement, not a feature, and it has no business on the hot path of a
    // shipped build.
    //
    // Installed HERE, before `initialize()`, because the one-shot bakes run during startup and never
    // again: the shared BRDF integration LUT during renderer init, the IBL irradiance/prefilter
    // convolutions and the cloud noise volume during scene start. Wrapping after `scene.start()` —
    // where this used to live — missed every one of them, and they were reported as never binding.
    const _shaderUse = new Set();
    const _sm = engine.renderer._shaderManager;
    const _bind = _sm.bind.bind(_sm);
    _sm.bind = (name) => { _shaderUse.add(name); return _bind(name); };
    window.__resetShaderUse = () => { _shaderUse.clear(); };
    window.__shadersUsed = () => Array.from(_shaderUse).sort();

    // `initialize()` arrived with async device acquisition (roadmap M0). Guarded so this page can also
    // be pointed at an OLDER build of cleo.js — which is the whole mechanism behind an A/B against a
    // previous commit: same scene, same driver, two engines.
    if (typeof engine.initialize === 'function') await engine.initialize();
    engine.setViewport(document.getElementById('vp'));

    // Install the GLSL -> WGSL translator, exactly as the editor does.
    //
    // Without it a custom material has no WGSL, so it cannot build a WebGPU program and the renderer
    // skips it — which is invisible in a WebGL2-only baseline and shows up in the cross-backend diff
    // as WebGPU submitting three fewer draws and one fewer fullscreen pass than WebGL2, forever. The
    // gate can only watch the custom-material path if this page supplies what the editor supplies.
    //
    // Non-fatal on purpose: a missing naga build should not take out the other twenty-odd checks on
    // this page, and `window.__translator` says which of the two runs happened.
    // Recorded BEFORE installing, because that is the invariant worth keeping: the engine bundle
    // must ship no translator of its own, or every published game carries 1.3 MB of naga.
    window.__translatorBefore = cleo.hasWgslTranslator();
    window.__translator = false;
    try {
      const nagaUrl = (f) => new URL('naga/' + f, document.baseURI).href;
      const naga = await import(/* webpackIgnore: true */ nagaUrl('nagaGlsl.js'));
      await naga.default({ module_or_path: nagaUrl('nagaGlsl_bg.wasm') });
      cleo.setWgslTranslator((glsl) => naga.glsl_to_wgsl(glsl, 'fragment'));
      window.__translator = cleo.hasWgslTranslator();
    } catch (e) {
      console.warn('naga translator unavailable: ' + e);
    }


    // A real texture, so the 2D upload path (texImage2D from an HTMLImageElement, sampler parameters,
    // mip generation) is actually exercised. Drawn here rather than embedded so the bytes are a valid
    // PNG the browser will decode.
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 64;
    const g = canvas.getContext('2d');
    for (let y = 0; y < 8; y++)
      for (let x = 0; x < 8; x++) {
        g.fillStyle = (x + y) % 2 ? '#e8e2d0' : '#3c6ea5';
        g.fillRect(x * 8, y * 8, 8, 8);
      }
    cleo.TextureManager.Instance.addTextureFromBase64(canvas.toDataURL('image/png'), { mipMap: true }, 'checker');

    const scene = new cleo.Scene();

    // A sky atmosphere bakes into a CUBEMAP and generates its mip chain, which is the cube upload path
    // plus createCubemapTarget — neither of which a plain textured quad reaches.
    scene.addNode(new cleo.SkyAtmosphereNode('sky'));

    const camera = new cleo.CameraNode('camera', new cleo.Camera({ type: 'perspective', far: 100 }));
    camera.setPosition([4, 4, 4]);
    // Exactly the editor's default framing (createEmptyScene): +pitch looks DOWN in this engine, and
    // guessing the sign the other way put every model outside the frustum.
    camera.setRotation([30, -135, 0]);
    // Scene.activeCamera is a getter that returns the first camera flagged active; there is no setter.
    camera.active = true;
    scene.addNode(camera);

    // The scene fill. It used to ride on the sun's own `ambient`, which every shading path added to
    // every pixel whether or not the sun reached it; it is scene state now, and a page that builds its
    // scene in code has to set it rather than inherit it from a save's migration. Same numbers, times
    // REFERENCE_ILLUMINANCE, so this configuration means exactly what it meant.
    scene.ambientLight = [0.18 * cleo.REFERENCE_ILLUMINANCE, 0.19 * cleo.REFERENCE_ILLUMINANCE,
                          0.24 * cleo.REFERENCE_ILLUMINANCE];
    const sun = new cleo.LightNode('sun', new cleo.DirectionalLight({
      diffuse: [1.0, 0.97, 0.9], specular: [1, 1, 1], ambient: [0.18, 0.19, 0.24],
      // Twenty times the real sun, and unphysical on purpose. It is the only thing in any harness
      // scene that reaches `discLightSample`, and the only thing that makes the renderer's
      // `_sunPenumbraScale` return anything but 1 — so without it, both are dead code as far as
      // every gate is concerned. It is measurable but only just: it widens `noShadows` from 11 to
      // 17 differing cells while every one of them stays inside the noise floor. Coverage, again,
      // rather than a gate.
      angularRadius: 0.1,
    }), true);
    sun.setPosition([0, 1, 0]);
    sun.setRotation([100, 25, 0]);
    scene.addNode(sun);

    // One object per MATERIAL MODEL, so every material shader family is actually drawn.
    //
    // The scene was all-PBR, which left the Blinn-Phong path (materials/default.fs, and its deferred
    // twin geometryDefault.fs) and the unlit Basic path completely unexercised — converting either
    // would have changed nothing any check could see. The Blinn-Phong one carries a specular tint and a
    // texture so its Blinn specular term and its sRGB decode both matter.
    const phong = new cleo.ModelNode('phong', new cleo.Model(
      cleo.Geometry.Sphere(24, 0.55),   // (segments, radius) — NOT (radius, segments)
      cleo.Material.Default({
        diffuse: [0.85, 0.25, 0.35], specular: [1, 1, 1], ambient: [0.2, 0.06, 0.09],
        shininess: 48, textures: { baseTexture: 'checker' },
      }),
    ));
    phong.setPosition([1.5, 0.55, 1.1]);
    scene.addNode(phong);

    // Unlit: writes zero albedo + authored emissive, which is also what drives the bloom mask.
    const unlit = new cleo.ModelNode('unlit', new cleo.Model(
      cleo.Geometry.Cube(0.5, 0.5, 0.5),
      cleo.Material.Basic({ color: [0.15, 0.95, 0.55] }),
    ));
    unlit.setPosition([2.6, 0.25, -0.9]);
    scene.addNode(unlit);

    // A baked light probe.
    //
    // Image-based lighting had NO coverage at all, which is how a probe regression could reach a user
    // before any check noticed. The probe bakes an irradiance + prefiltered cube pair from the scene and
    // the deferred lighting pass blends it in by volume containment, so this exercises the whole IBL
    // path: the bake shaders (irradiance, prefilter, brdf) and the per-pixel probe blend.
    const probe = new cleo.LightProbeNode('probe', { intensity: 1.0, mode: 'baked' });
    probe.setPosition([0, 1.2, 0]);
    scene.addNode(probe);
    window.__probe = probe;

    // A point light and a shadow-casting spot light.
    //
    // Not decoration: deferredLighting.fs loops over `u_pointLights[i]` / `u_spotlights[i]`, arrays of
    // STRUCTS whose members the renderer uploads one field at a time by name. How GL reports the members
    // of an array of structs is driver-dependent, and moving those arrays into a std140 block changes the
    // reflected names — so without a light of each kind in the scene, converting that shader would leave
    // both loops, and spot shadows with them, completely unverified.
    const lamp = new cleo.LightNode('lamp', new cleo.PointLight({
      diffuse: [1.0, 0.55, 0.2], specular: [1, 0.7, 0.4], ambient: [0, 0, 0],
      constant: 1.0, linear: 0.14, quadratic: 0.07,
      // A HALF-METRE BULB, for COVERAGE rather than for a gate, and the distinction was measured
      // rather than assumed. Sphere lights are a per-pixel effect over a small part of the frame,
      // and the 8x8 quantised signature cannot resolve them at any sane size: toggling this between
      // 0.05 and 0 moves ZERO of the 128 values even against a mirror-finish sphere, 0.5 moves zero,
      // and it takes a full 1 m bulb to move two. So this does NOT gate `sphereLightSample` against
      // a numerical regression. What it does do is EXECUTE it, every run, on a real driver — which
      // is what catches a NaN, a divide by zero, or a shader that stops compiling, and those are
      // the failures this path is most likely to have. Anything finer needs a dedicated probe page.
      sourceRadius: 0.5,
    }));
    lamp.setPosition([2.2, 1.1, 1.6]);
    scene.addNode(lamp);

    const spot = new cleo.LightNode('spot', new cleo.Spotlight({
      diffuse: [0.35, 0.6, 1.0], specular: [0.4, 0.6, 1], ambient: [0, 0, 0],
      constant: 1.0, linear: 0.09, quadratic: 0.02, cutOff: 22, outerCutOff: 34,
    }), true);   // castShadows: exercises the spot-shadow atlas and spotShadowFor()
    spot.setPosition([-2.6, 3.4, 2.2]);
    spot.setRotation([125, -40, 0]);
    scene.addNode(spot);

    // Cube: flat faces, sharp normals — a wrong stride turns it into spikes or nothing at all.
    const cube = new cleo.ModelNode('cube', new cleo.Model(
      cleo.Geometry.Cube(1.4, 1.4, 1.4),
      cleo.Material.PBR({ baseColor: [0.85, 0.35, 0.25], metallic: 0.1, roughness: 0.45, textures: { baseColorTexture: 'checker' } }),
    ));
    cube.setPosition([-1.4, 0.7, 0]);
    scene.addNode(cube);

    // Sphere: smooth normals and a full UV sphere — catches a normal/uv swap that a cube can hide.
    const sphere = new cleo.ModelNode('sphere', new cleo.Model(
      cleo.Geometry.Sphere(48, 0.85),
      cleo.Material.PBR({ baseColor: [0.3, 0.55, 0.9], metallic: 0.8, roughness: 0.25 }),
    ));
    sphere.setPosition([1.4, 0.85, 0]);
    scene.addNode(sphere);

    // A wide flat quad underneath, so shadows and the ground plane are visible.
    const floor = new cleo.ModelNode('floor', new cleo.Model(
      cleo.Geometry.Cube(8, 0.2, 8),
      cleo.Material.PBR({ baseColor: [0.55, 0.55, 0.58], metallic: 0.0, roughness: 0.9, textures: { baseColorTexture: 'checker' } }),
    ));
    floor.setPosition([0, -0.2, 0]);
    scene.addNode(floor);

    // Four nodes SHARING one Model instance. The renderer groups by mesh|material object identity, so
    // this is what drives _drawInstancedGroup -> setupInstanceMatrixBuffer, i.e. the per-instance mat4
    // spread across attribute slots 5..8 that the shared layout binder now owns.
    const shared = new cleo.Model(
      cleo.Geometry.Cube(0.45, 0.45, 0.45),
      cleo.Material.PBR({ baseColor: [0.95, 0.8, 0.2], metallic: 0.2, roughness: 0.5 }),
    );
    for (let i = 0; i < 4; i++) {
      const n = new cleo.ModelNode('inst' + i, shared);
      n.setPosition([-2.4 + i * 1.6, 0.25, -2.2]);
      scene.addNode(n);
    }

    // A SKINNED mesh — the path that binds the dedicated bone-index and bone-weight buffers through
    // vertexAttribIPointer. Nothing else in this scene reaches initializeAnimatedVAO, and a wrapper
    // object passed where a raw WebGLBuffer was expected there threw only at runtime, only on a
    // skinned draw, and only once a shadow cascade asked for one.
    const addSkinned = (name, material, position) => {
      const geo = cleo.Geometry.Cube(0.8, 2.2, 0.8);
      const vertexCount = geo.positions.length / 3;
      // Two joints, weighted purely to joint 0 so the pose is the bind pose and the draw is comparable.
      const boneIds = new Int32Array(vertexCount * 4);
      const weights = new Float32Array(vertexCount * 4);
      for (let i = 0; i < vertexCount; i++) weights[i * 4] = 1;
      const identity = () => cleo.Vec.mat4.create();
      const skin = {
        joints: [
          { nodeIndex: 0, inverseBindMatrix: identity() },
          { nodeIndex: 1, inverseBindMatrix: identity(), parentIndex: 0 },
        ],
        skeleton: 0,
      };
      const node = new cleo.ModelNode(name, new cleo.AnimatedModel(geo, material, skin, boneIds, weights, []));
      node.setPosition(position);
      scene.addNode(node);
    };

    /** N nodes sharing ONE Model, which is what the renderer groups into an instanced draw. */
    const addInstanced = (name, model, count, origin, step) => {
      for (let i = 0; i < count; i++) {
        const n = new cleo.ModelNode(name + i, model);
        n.setPosition([origin[0] + i * step, origin[1], origin[2]]);
        scene.addNode(n);
      }
    };

    try {
      addSkinned('skinned', cleo.Material.PBR({ baseColor: [0.6, 0.85, 0.5], roughness: 0.6 }), [0, 1.1, -2.6]);

      // Every material type crossed with every topology.
      //
      // Measuring which programs actually BIND (rather than merely compile) showed six of the converted
      // shaders were never reached by this scene: the Basic and Blinn-Phong paths existed only as plain
      // static models, so their skinned and instanced variants — separate programs with separate vertex
      // stages — were converted to WGSL with nothing checking them. The material/topology grid below is
      // what closes that, and it is deliberately exhaustive rather than "one more object": the gap was
      // invisible precisely because the scene looked varied enough.
      // `?extras=<bitmask>` selects which of the four to build, for bisecting a fault to one of them.
      const extras = Number(new URLSearchParams(location.search).get('extras') ?? 15);

      if (extras & 1) addSkinned('phongSkinned', cleo.Material.Default({
        diffuse: [0.35, 0.55, 0.85], specular: [1, 1, 1], ambient: [0.08, 0.12, 0.2], shininess: 32,
      }), [-2.2, 1.1, -2.6]);
      if (extras & 2) addSkinned('basicSkinned', cleo.Material.Basic({ color: [0.95, 0.6, 0.15] }), [2.2, 1.1, -2.6]);

      if (extras & 4) addInstanced('phongInst', new cleo.Model(
        cleo.Geometry.Cube(0.4, 0.4, 0.4),
        cleo.Material.Default({
          diffuse: [0.9, 0.45, 0.7], specular: [0.8, 0.8, 0.8], ambient: [0.2, 0.1, 0.16], shininess: 24,
        }),
      ), 3, [-2.4, 0.22, 2.6], 1.3);

      if (extras & 8) addInstanced('basicInst', new cleo.Model(
        cleo.Geometry.Cube(0.35, 0.35, 0.35),
        cleo.Material.Basic({ color: [0.2, 0.7, 0.95] }),
      ), 3, [1.9, 0.2, 2.6], 1.0);

      window.__skinned = true;
    } catch (e) {
      window.__skinnedError = String((e && e.message) || e);
    }

    // A tilemap chunk — TileMesh owns its own buffers and its own vertex layout, and both moved during
    // the RHI migration. Placed unrotated in the XY plane, which is the orientation the chunk-visibility
    // test assumes; rotating the node flat is what made an earlier attempt cull every chunk.
    try {
      const tileset = cleo.gridTileset('tilecheck.ts', 'checker', 8, 8);
      const tilemap = new cleo.Tilemap({ kind: 'orthogonal', cellWidth: 1, cellHeight: 1 });
      tilemap.registerTileset(tileset);
      tilemap.addLayer({ tilesetId: tileset.id });
      for (let c = 0; c < 6; c++)
        for (let r = 0; r < 4; r++)
          tilemap.setTile(0, c, r, (c + r) % 8);
      const mapNode = new cleo.TilemapNode('tiles', tilemap);
      mapNode.setPosition([-6, 0.5, -4]);
      scene.addNode(mapNode);
      window.__tilemapInfo = () => {
        const layer = tilemap.layers[0];
        let cells = 0;
        for (const chunk of layer.chunks.values()) cells += chunk.count;
        return {
          inScene: engine.scene ? engine.scene.tilemaps.size : -1,
          layers: tilemap.layers.length,
          tileset: !!tilemap.tilesetOf(0),
          visible: layer.cfg.visible, opacity: layer.cfg.opacity,
          chunks: layer.chunks.size, cells,
        };
      };
    } catch (e) {
      window.__tilemapError = String((e && e.message) || e);
    }

    // ---------------------------------------------------------------------------------------------
    // `?scene=full` — the content the base scene deliberately lacks.
    //
    // Terrain, foliage and volumetric clouds were the last shader families converted to WGSL and the
    // ONLY ones in the whole migration never held to a pixel gate, because nothing in this scene
    // contained them. They are opt-in rather than always-on for one reason: adding them to the default
    // scene would move every existing baseline at once, and a baseline that moves for two reasons at
    // the same time can no longer attribute either. This variant carries its own baselines instead.
    //
    // Everything here is DETERMINISTIC on purpose. Terrain height comes from a closed-form function and
    // foliage instances from a fixed lattice rather than `scatterFoliage`, which draws from an unseeded
    // RNG — a signature gate cannot hold a scene that reshuffles itself between runs.
    // ---------------------------------------------------------------------------------------------
    // `every` is `full` PLUS the material/geometry gap, so it runs the block below and then its
    // own; `every2d` is the ortho profile and runs neither. See each block for what it adds.
    const sceneParam = new URLSearchParams(location.search).get('scene');
    const everyScene = sceneParam === 'every';
    const twoDScene = sceneParam === 'every2d';
    const fullScene = sceneParam === 'full' || everyScene;
    window.__sceneProfile = twoDScene ? 'every2d' : everyScene ? 'every' : fullScene ? 'full' : 'base';
    window.__fullSceneError = null;
    window.__everySceneError = null;
    window.__twoDSceneError = null;

    if (fullScene) try {
      // A seeded Math.random for the duration of this block, restored in the finally.
      //
      // FoliageLayer.pushInstance draws a yaw and a scale from Math.random per instance, so a scene
      // built twice from identical code produced 250 differently-oriented, differently-sized props —
      // enough to move 4-6 of the 128 signature values past the noise floor, in different cells every
      // run. Within one run the picture was stable, which is what made it look like a real regression
      // rather than a coin toss.
      //
      // Scoped to this block on purpose. Replacing Math.random for the whole page would also reseed the
      // SSAO kernel and noise texture, which are built at renderer init and are baked into baselines
      // recorded before any of this existed — a change with no upside here and a blast radius over
      // every other check.
      const _random = Math.random;
      let _seed = 0x9e3779b9;
      Math.random = () => {
        // xorshift32: no library, no state beyond one word, and identical on every machine.
        _seed ^= _seed << 13; _seed >>>= 0;
        _seed ^= _seed >> 17;
        _seed ^= _seed << 5;  _seed >>>= 0;
        return _seed / 0x100000000;
      };
      try {
      // Small and LOW-resolution. Resolution drives the heightfield grid and therefore the chunk count;
      // a coarse grid is enough to exercise the splat blend and the LOD index buffers, which is what
      // these shaders are being gated on — not visual quality.
      // renderDensity 2: four render vertices per height cell, so the displaced layer below carries one
      // more octave of its height map in real geometry instead of in the parallax march. It also puts
      // the density vertex mapping under the same visual gate as everything else — the mapping breaks
      // silently (a frozen tail of vertices, or indices addressing a quarter of the buffer) rather than
      // throwing, so a picture is the only thing that catches it.
      // `targetVertsPerTile` 8 against the rock layer's tiling of 8 on a 33 grid derives density 2 — the
      // dense-chunk path under test, at a cost this scene can carry. The editor default of 32 would ask
      // for density 8 here (66k vertices in one chunk, 743k triangles once the shadow cascades draw it),
      // which would slow every harness run to gate the same code.
      const terrain = new cleo.Terrain({
        size: 24, resolution: 33, targetVertsPerTile: everyScene ? 8 : 0, renderDensity: 1,
      });

      // Sculpt through the PUBLIC brush rather than writing `terrain.heights` directly: the height array
      // is exposed but the chunk-geometry refresh that follows a write is not, so a direct write would
      // leave the GPU buffers holding the flat original. A flat terrain is also the degenerate case —
      // constant slope means the height/slope masking in the terrain shaders never takes its branch.
      const mounds = [[-6, 0, -6], [5, 0, -4], [0, 0, 5], [7, 0, 7], [-5, 0, 6]];
      for (const p of mounds)
        terrain.sculpt([p[0], 0, p[2]], { radius: 5, strength: 2.2, falloff: 0.7, mode: 'raise' }, 1);
      terrain.sculpt([0, 0, 0], { radius: 6, strength: 1.0, falloff: 1.0, mode: 'smooth' }, 1);

      const landscape = new cleo.LandscapeNode('landscape', terrain);
      landscape.setPosition([0, -1.6, -4]);
      scene.addNode(landscape);

      // Foliage instances are placed on a fixed lattice via the layer's own push/commit, then Y-sampled
      // off the sculpted surface. `castShadows` is opt-in per layer and off by default (it costs an
      // instanced draw per layer per cascade), so it is set explicitly — without it the instanced depth
      // programs never bind and half the point of adding foliage is lost.
      const populate = (layer, step, inset) => {
        const half = terrain.size / 2 - inset;
        for (let z = -half; z <= half; z += step)
          for (let x = -half; x <= half; x += step)
            layer.pushInstance(x, terrain.heightAt(x, z) - 1.6, z - 4);
        layer.commit();
      };

      // Billboard: camera-facing quads whose silhouette lives in the texture alpha, so they also drive
      // the alpha-cutout depth program.
      const grass = cleo.FoliageLayer.Billboard('grass', 'checker', { density: 0.4, minScale: 0.6, maxScale: 0.9 });
      grass.castShadows = true;
      terrain.addFoliage(grass);
      populate(grass, 1.5, 1);

      // Mesh: the non-billboard instanced path — a real model through the lit geometry program and the
      // plain (non-cutout) instanced depth program.
      const props = cleo.FoliageLayer.Mesh('props', new cleo.Model(
        cleo.Geometry.Cube(0.3, 0.7, 0.3),
        cleo.Material.PBR({ baseColor: [0.35, 0.28, 0.18], metallic: 0.0, roughness: 0.85 }),
      ), { density: 0.08, minScale: 0.9, maxScale: 1.1 });
      props.castShadows = true;
      terrain.addFoliage(props);
      populate(props, 4, 3);

      window.__landscape = landscape;
      window.__foliageCounts = () => terrain.foliage.map(f => ({ name: f.name, count: f.count }));

      // Volumetric clouds. The raymarch runs against the scene depth after the skybox, so this needs no
      // placement — the node carries its own slab altitudes.
      //
      // Every parameter that makes the frame depend on TIME is pinned. Wind drifts the noise field, and
      // jitter dithers each ray's start from a per-frame seed; with either left on, two runs of the same
      // scene produce different pixels and a signature baseline is meaningless. Temporal upscale stays
      // ON — it is what binds cloudTemporalResolve and cloudUpsample, and with a static field its
      // history converges instead of drifting.
      //
      // Coverage and density are pushed well above the defaults for the same reason the terrain is
      // sculpted: a cloud layer too faint to see is a pass that cannot fail visibly, which is not a gate.
      const clouds = new cleo.VolumetricCloudsNode('clouds', {
        coverage: 0.75, density: 1.2, cloudType: 0.45, opacity: 1.0,
        windSpeed: 0, jitter: false, temporalUpscale: true,
      });
      scene.addNode(clouds);

      // Sprites. The engine ships them and NOTHING in this scene contained one, so every pixel the
      // sprite path produces was ungated — including the camera-facing constraint, which is CPU-side
      // matrix surgery no unit test covers either. Two of them, because the interesting difference is
      // between the constraints: 'spherical' rebuilds the rotation from the camera basis every frame,
      // 'free' uses the node's own transform, and a bug that drops the constraint makes the first look
      // like the second — which is exactly how it failed once.
      const spriteTiles = cleo.gridTileset('spritecheck.ts', 'checker', 8, 8);
      const billboard = new cleo.SpriteNode('billboard',
        new cleo.Sprite({ tileset: spriteTiles, tileIndex: 9, tint: [1.0, 0.5, 0.2] }), 'spherical');
      billboard.setPosition([-2.2, 1.0, 1.6]);
      scene.addNode(billboard);

      const flat = new cleo.SpriteNode('flatSprite',
        new cleo.Sprite({ tileset: spriteTiles, tileIndex: 18, tint: [0.3, 0.9, 1.0] }), 'free');
      flat.setPosition([3.4, 1.4, 0.6]);
      flat.setRotation([0, -40, 0]);
      scene.addNode(flat);
      window.__spriteCount = () => (engine.scene ? engine.scene.sprites.size : -1);

      // A gizmo, and the skeleton overlay. Both draw ALWAYS ON TOP — depth test off — and neither had
      // any pixel coverage: gizmos are editor-only and the overlay is opt-in, so the two draw paths
      // that deliberately ignore the depth buffer were the two nothing checked. They also inherit
      // cull and blend state from whatever drew last, which is precisely the kind of implicit
      // dependency a migration to explicit pipeline state has to be able to see itself break.
      const gizmo = new cleo.ModelNode('gizmo', new cleo.Model(
        cleo.Geometry.Cube(0.9, 0.9, 0.9),
        cleo.Material.Basic({ color: [1.0, 0.25, 0.55] }),
      ));
      // Deliberately BEHIND the spheres in depth: a gizmo that stops ignoring the depth buffer
      // disappears behind them, which is the regression this position exists to make visible.
      gizmo.setPosition([0.1, 0.9, -1.4]);
      gizmo.isGizmo = true;
      scene.addNode(gizmo);
      window.__gizmoCount = () => {
        let n = 0;
        for (const m of (engine.scene ? engine.scene.models : [])) if (m.isGizmo) n++;
        return n;
      };

      // A screen-space custom material on the active camera.
      //
      // The harness COMPILED all three custom preludes and drew none of them, so the whole
      // screen-material chain — a runtime-compiled program, its ping-ponged compose buffers, and the
      // engine + user sampler ordering its prelude declares — had no pixel coverage at all. This one
      // uses BOTH engine samplers and a user sampler, because the ordering between them is exactly
      // what a bind group derived from the prelude interface can get wrong.
      const tint = cleo.CustomMaterial.Create('pbr', 'screen');
      tint.uniforms = [{ name: 'mixAmount', type: 'float', value: 0.85 },
                       { name: 'rampTex', type: 'sampler2D' }];
      tint.textures.set('rampTex', 'checker');
      tint.fragmentSource = [
        'vec4 fragment() {',
        '    vec3 src = texture(u_screenTexture, fragTexCoord).rgb;',
        '    float d = texture(u_depth, fragTexCoord).r;',
        // screenUV(), not fragTexCoord: a USER texture indexed by the render target's own V
        // renders mirrored on one backend and not the other, because the two APIs number a
        // target's rows from opposite ends. This tiles 4x either way, so the difference is
        // four bands of checker in the wrong place rather than an obviously broken image —
        // which is exactly why the scene carries it.
        '    vec3 ramp = texture(u_rampTex, screenUV() * 4.0).rgb;',
        '    // Stepped on depth, not weighted by it: device depth is non-linear, so (1.0 - d) is',
        '    // about 0.01 over most of a scene and a weighted mix is invisible. A step makes the',
        '    // effect large where geometry is and exactly zero on the sky, which is what proves',
        '    // u_depth is bound to the depth buffer and not to something else.',
        '    float w = d < 1.0 ? u_mixAmount : 0.0;',
        '    return vec4(mix(src, src * ramp * 2.0, w), 1.0);',
        '}',
      ].join(String.fromCharCode(10));
      tint.refreshType();
      camera.screenMaterials = [tint];
      window.__screenMaterialCount = () => (engine.scene && engine.scene.activeCamera
        ? engine.scene.activeCamera.screenMaterials.length : -1);
      window.__clouds = clouds;
      } finally { Math.random = _random; }
    } catch (e) {
      window.__fullSceneError = String((e && e.stack) || e);
    }

    // ---------------------------------------------------------------------------------------------
    // `?scene=every` — every STATIC feature the renderer can be asked for.
    //
    // `full` closed the shader-family gap (terrain, foliage, clouds). This closes the MATERIAL and
    // GEOMETRY gap, which is a different axis and had never been walked at all: no gated scene had an
    // authored normal/emissive/occlusion map, a transparent or wireframe or double-sided material, a
    // multi-material submesh model, a model LOD group, an instanced mesh carrying LOD index buffers,
    // or a material with two DIFFERENT channel maps.
    //
    // That last one is the sharp end. `TexturePacker.resolve` takes an identity fast path when one
    // source serves every channel, so two maps have to genuinely differ to reach `_bake` — which was
    // the last WebGL2-only path in the engine and is ported in the same commit as this scene.
    //
    // Additive over `full` rather than a scene of its own: everything `full` builds is a feature too,
    // and rebuilding it here would be a second copy to keep in step. It carries its own baselines, for
    // the reason the `full` block already gives — a baseline that moves for two reasons at once can no
    // longer attribute either.
    // ---------------------------------------------------------------------------------------------
    if (everyScene) try {
      // Three more textures, each a DIFFERENT image, because that is the whole point: a pack spec
      // whose channels all resolve to one source never bakes. Drawn rather than embedded so the upload
      // path is the real one, and small because the packer resamples to the largest source anyway.
      const solid = (name, r, g, b, opts) => {
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const cg = c.getContext('2d');
        // A gradient, not a flat fill: a constant map hides an orientation or a channel-swizzle bug,
        // which is exactly the class of bug a packed texture can have.
        for (let y = 0; y < 32; y++)
          for (let x = 0; x < 32; x++) {
            const t = (x + y) / 62;
            cg.fillStyle = `rgb(${Math.round(r * t)}, ${Math.round(g * t)}, ${Math.round(b * t)})`;
            cg.fillRect(x, y, 1, 1);
          }
        cleo.TextureManager.Instance.addTextureFromBase64(c.toDataURL('image/png'), opts || { mipMap: true }, name);
        return name;
      };
      solid('metalGrad', 255, 40, 40);
      solid('roughGrad', 40, 255, 40);
      solid('aoGrad', 40, 40, 255);
      // A height map with detail at BOTH scales: broad lobes the terrain's vertices can carry, and
      // grain finer than one vertex, which only the parallax march can. That second band is the entire
      // subject of the geometry/march split, and no other fixture on this page contains any.
      (() => {
        const n = 256;
        const c = document.createElement('canvas');
        c.width = c.height = n;
        const cg = c.getContext('2d');
        const img = cg.createImageData(n, n);
        // Deterministic by construction rather than by seeding Math.random: this runs on every profile
        // and a fixture that differs between two runs would show up as backend divergence.
        const hash = (x, y) => {
          const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
          return s - Math.floor(s);
        };
        const valueNoise = (x, y, period) => {
          const xi = Math.floor(x / period), yi = Math.floor(y / period);
          const xf = (x / period) - xi, yf = (y / period) - yi;
          const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
          const a = hash(xi, yi), b = hash(xi + 1, yi);
          const cc = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
          return (a + (b - a) * sx) + ((cc + (d - cc) * sx) - (a + (b - a) * sx)) * sy;
        };
        for (let y = 0; y < n; y++)
          for (let x = 0; x < n; x++) {
            const v = 0.45 * valueNoise(x, y, 64)    // broad: the vertices carry this
                    + 0.35 * valueNoise(x, y, 12)    // mid
                    + 0.20 * valueNoise(x, y, 3);    // grain: only the march can carry this
            const p = (y * n + x) * 4;
            img.data[p] = img.data[p + 1] = img.data[p + 2] = Math.round(Math.max(0, Math.min(1, v)) * 255);
            img.data[p + 3] = 255;
          }
        cg.putImageData(img, 0, 0);
        cleo.TextureManager.Instance.addTextureFromBase64(c.toDataURL('image/png'), { mipMap: true }, 'heightRocks');
      })();
      // TERRAIN occlusion, which needs its OWN map rather than `aoGrad`: the packer reads channel 0,
      // and aoGrad's red ramps 0 -> 40/255, so every terrain fragment would sit in near-total shadow
      // and the layer's parallax/displacement signal would be buried under it. A full 0 -> 1 diagonal
      // ramp keeps the mean near 0.5 and, tiled 8x across the terrain, gives the 8x8 signature real
      // per-cell variance to lose if the occlusion stops arriving.
      solid('aoTerrain', 255, 255, 255);
      // A normal map has to be a NORMAL map: a flat (128,128,255) would leave the TBN path
      // mathematically idle and a wrong basis would look identical to a right one.
      const nrm = document.createElement('canvas');
      nrm.width = nrm.height = 32;
      const ng = nrm.getContext('2d');
      for (let y = 0; y < 32; y++)
        for (let x = 0; x < 32; x++) {
          const bump = Math.sin(x * 0.6) * Math.cos(y * 0.6);
          ng.fillStyle = `rgb(${Math.round(128 + bump * 90)}, ${Math.round(128 - bump * 90)}, 255)`;
          ng.fillRect(x, y, 1, 1);
        }
      cleo.TextureManager.Instance.addTextureFromBase64(nrm.toDataURL('image/png'), { mipMap: true }, 'normalGrad');

      // 1. The channel-pack trigger, and every authored map slot at once.
      //
      // metallicMap and roughnessMap are DIFFERENT textures, which is what sends this through
      // `TexturePacker._bake` instead of the identity fast path. occlusionMap makes it a three-source
      // pack; normalMap and emissiveMap exercise the two remaining slots a PBR material can carry.
      const packed = new cleo.ModelNode('packedMaps', new cleo.Model(
        cleo.Geometry.Sphere(32, 0.7),
        cleo.Material.PBR({
          baseColor: [1, 1, 1], metallic: 1, roughness: 1,
          textures: {
            baseColorTexture: 'checker', normalMap: 'normalGrad', emissiveMap: 'aoGrad',
            metallicMap: 'metalGrad', roughnessMap: 'roughGrad', occlusionMap: 'aoGrad',
          },
        }),
      ));
      packed.setPosition([-3.4, 0.9, 2.6]);
      scene.addNode(packed);
      window.__packedMaterial = () => {
        const n = engine.scene && [...engine.scene.models].find(m => m.name === 'packedMaps');
        if (!n) return 'missing';
        // `ormTexture` is the DERIVED slot `_syncPBR` writes back, not one of the authored three.
        // An id under the packed prefix is the proof `_bake` ran; the authored id would mean the
        // identity fast path took it, and the whole point of this material is to miss that path.
        return String(n.model.material.textures.get('ormTexture') ?? null);
      };

      // 1b. Parallax occlusion mapping on a STANDARD material.
      //
      // Terrain has had a height map in this scene for a while, but the standard-material POM path is
      // a different shader (chunks/pbrGBuffer.wgsl and its forward twin) reading a different sampler,
      // and nothing gated it at all. A cube rather than a sphere: POM is a flat-surface approximation
      // and a face gives it the large, planar, obliquely-viewed area where the march actually does
      // something — and where a mirrored V axis, the defect this feature was built to fix, is visible
      // as relief running the wrong way.
      //
      // `heightGrad` is a RIDGED field, not the smooth ramp the `solid` helper draws: a monotonic ramp
      // has no local maxima, so the march can never step over one, and a POM bug that shows up as
      // stepping over a ridge would pass against it.
      const hgt = document.createElement('canvas');
      hgt.width = hgt.height = 64;
      const hg = hgt.getContext('2d');
      for (let y = 0; y < 64; y++)
        for (let x = 0; x < 64; x++) {
          const v = Math.round(255 * (0.5 + 0.5 * Math.sin(x * 0.5) * Math.sin(y * 0.5)));
          hg.fillStyle = `rgb(${v}, ${v}, ${v})`;
          hg.fillRect(x, y, 1, 1);
        }
      cleo.TextureManager.Instance.addTextureFromBase64(hgt.toDataURL('image/png'), { mipMap: true }, 'heightGrad');

      const parallax = new cleo.ModelNode('parallaxCube', new cleo.Model(
        cleo.Geometry.Cube(1.4, 1.4, 1.4),
        cleo.Material.PBR({
          baseColor: [0.8, 0.75, 0.7], metallic: 0.0, roughness: 0.7,
          // Deeper than the 0.05 default so the march runs several steps at this camera angle; a depth
          // small enough to resolve in one step would gate the plumbing and not the algorithm.
          displacementScale: 0.12,
          // Silhouette clipping ON. A Cube's faces are mapped 0..1, which is exactly the case the
          // clip test is for, and a discard nothing ever executes is a discard nothing gates. It
          // bites the height field into the cube's outline; the straight-edged result is what the
          // technique CANNOT do, so a baseline with clean edges here would mean the flag died.
          clipSilhouette: true,
          textures: { baseColorTexture: 'checker', normalMap: 'normalGrad', displacementMap: 'heightGrad' },
        }),
      ));
      parallax.setPosition([-3.4, 0.9, 4.6]);
      parallax.setRotation([0, 34, 0]);   // oblique, so the offset is non-zero on two visible faces
      scene.addNode(parallax);
      window.__parallaxMaterial = () => {
        const n = engine.scene && [...engine.scene.models].find(m => m.name === 'parallaxCube');
        if (!n) return 'missing';
        const m = n.model.material;
        // The flag is what the shader branches on, and the scale is what it marches with. Reporting
        // both means a scene that silently lost its height map cannot read as "parallax covered".
        return JSON.stringify({
          map: String(m.textures.get('displacementMap') ?? null),
          has: m.properties.get('hasDisplacementMap') === true || m.properties.get('hasDisplacementMap') === 1,
          scale: m.properties.get('dispScale'),
          clip: m.properties.get('clipSilhouette') === true || m.properties.get('clipSilhouette') === 1,
        });
      };

      // 1c. An alpha-CUTOUT material, and a masked shadow caster.
      //
      // The mask slot exists on Basic, Blinn-Phong and PBR, and the cutout has to agree in three
      // places at once: the forward shader, the deferred G-buffer twin, and the DEPTH pass. The depth
      // pass is the one that had nothing — an ordinary mesh cast a solid silhouette no matter what its
      // surface discarded — so this object is positioned to drop a shadow onto the ground, where a
      // regression shows as a solid rectangle instead of a pierced one.
      //
      // The mask is read from RED, so this is a grayscale map, not an RGBA cutout.
      const msk = document.createElement('canvas');
      msk.width = msk.height = 64;
      const mg = msk.getContext('2d');
      for (let y = 0; y < 64; y++)
        for (let x = 0; x < 64; x++) {
          // Big holes on a coarse grid: a fine pattern would alias into the shadow map and make the
          // baseline depend on filtering rather than on the cutout.
          const on = ((x >> 4) + (y >> 4)) & 1;
          const v = on ? 255 : 0;
          mg.fillStyle = `rgb(${v}, ${v}, ${v})`;
          mg.fillRect(x, y, 1, 1);
        }
      cleo.TextureManager.Instance.addTextureFromBase64(msk.toDataURL('image/png'), { mipMap: true }, 'cutoutMask');

      const cutout = new cleo.ModelNode('cutoutQuad', new cleo.Model(
        cleo.Geometry.Plane(2.4, 2.4),
        cleo.Material.PBR({
          baseColor: [0.85, 0.8, 0.7], metallic: 0.0, roughness: 0.6,
          // A mask TAKES PRECEDENCE over the base colour's alpha, so this also pins that ordering:
          // 'checker' is opaque, and if the mask were ignored nothing would be discarded at all.
          textures: { baseColorTexture: 'checker', mask: 'cutoutMask' },
          alphaCutoff: 0.5,
        }, { side: 'double' }),
      ));
      // Tilted and raised so it both faces the camera and casts onto the ground below it.
      cutout.setPosition([-1.2, 2.4, 5.2]);
      cutout.setRotation([70, 0, 0]);
      scene.addNode(cutout);
      window.__cutoutMaterial = () => {
        const n = engine.scene && [...engine.scene.models].find(m => m.name === 'cutoutQuad');
        if (!n) return 'missing';
        const m = n.model.material;
        // Both halves reported: a scene that lost the mask, or kept it with the threshold reset to 0,
        // would still draw and would otherwise read as "cutout covered".
        return JSON.stringify({
          mask: String(m.textures.get('maskMap') ?? null),
          has: m.properties.get('hasMaskMap') === true || m.properties.get('hasMaskMap') === 1,
          cutoff: m.properties.get('alphaCutoff'),
          casts: m.config.castShadow !== false,
        });
      };

      // 2. Transparent, wireframe, and the two non-default cull modes.
      //
      // Four separate nodes rather than one with flags flipped: they take different queues and
      // different pipeline state, and a scene that only ever holds one of them at a time cannot catch
      // an ordering bug between them.
      const glass = new cleo.ModelNode('transparent', new cleo.Model(
        cleo.Geometry.Cube(1.1, 1.1, 1.1),
        cleo.Material.PBR({ baseColor: [0.35, 0.8, 0.95], metallic: 0.0, roughness: 0.15, opacity: 0.45 },
                          { transparent: true }),
      ));
      glass.setPosition([2.6, 0.95, 2.9]);
      scene.addNode(glass);

      const wire = new cleo.ModelNode('wireframe', new cleo.Model(
        cleo.Geometry.Sphere(16, 0.6),
        cleo.Material.Basic({ color: [0.95, 0.85, 0.2] }, { wireframe: true }),
      ));
      wire.setPosition([-1.2, 1.9, 3.2]);
      scene.addNode(wire);

      const doubleSided = new cleo.ModelNode('doubleSided', new cleo.Model(
        cleo.Geometry.Plane(1.6, 1.6),
        cleo.Material.PBR({ baseColor: [0.9, 0.45, 0.7], metallic: 0.0, roughness: 0.6 },
                          { side: 'double' }),
      ));
      doubleSided.setPosition([0.4, 1.6, 3.4]);
      doubleSided.setRotation([0, 35, 0]);
      scene.addNode(doubleSided);

      const backFace = new cleo.ModelNode('backFace', new cleo.Model(
        cleo.Geometry.Cube(0.8, 0.8, 0.8),
        cleo.Material.PBR({ baseColor: [0.2, 0.9, 0.4], metallic: 0.0, roughness: 0.7 },
                          { side: 'back' }),
      ));
      backFace.setPosition([1.5, 1.9, 3.6]);
      scene.addNode(backFace);

      // A caster that does NOT cast: the shadow queue's exclusion, which nothing tested.
      const noShadow = new cleo.ModelNode('noShadow', new cleo.Model(
        cleo.Geometry.Cube(0.7, 1.4, 0.7),
        cleo.Material.PBR({ baseColor: [0.95, 0.6, 0.1], metallic: 0.0, roughness: 0.5 },
                          { castShadow: false }),
      ));
      noShadow.setPosition([-2.6, 1.2, -1.4]);
      scene.addNode(noShadow);

      // Emissive only: the bloom mask's own input. Bright enough to clear the 0.4 threshold the
      // `bloom` configuration sets at exposure 2, which nothing in `base` does.
      const glow = new cleo.ModelNode('emissive', new cleo.Model(
        cleo.Geometry.Sphere(20, 0.35),
        cleo.Material.PBR({ baseColor: [0.02, 0.02, 0.02], metallic: 0, roughness: 1,
                            emissiveFactor: [2.4, 1.6, 0.4] }),
      ));
      glow.setPosition([3.1, 2.2, -1.2]);
      scene.addNode(glow);

      // 3. A merged, multi-material model — `_drawSubmeshes`' RANGE path.
      //
      // Every model in every other scene has one material, so the loop that applies a material per
      // index range and draws a slice of the index buffer had never run. The two ranges split the
      // cube's 36 indices down the middle, which is enough to make a wrong `firstIndex` visible.
      const merged = cleo.Geometry.Cube(1.0, 1.0, 1.0);
      const half = Math.floor(merged.indices.length / 2);
      const submeshed = new cleo.ModelNode('submeshed', new cleo.Model(
        merged,
        [cleo.Material.PBR({ baseColor: [0.9, 0.3, 0.3], metallic: 0.1, roughness: 0.4 }),
         cleo.Material.PBR({ baseColor: [0.3, 0.3, 0.9], metallic: 0.6, roughness: 0.2 })],
        [{ start: 0, count: half }, { start: half, count: merged.indices.length - half }],
      ));
      submeshed.setPosition([-4.4, 1.0, -2.2]);
      scene.addNode(submeshed);
      window.__submeshCount = () => {
        const n = engine.scene && [...engine.scene.models].find(m => m.name === 'submeshed');
        return n ? n.model.submeshes.length : -1;
      };

      // 4. A model LOD group — distinct from the terrain LOD `full` already covers.
      //
      // `LodGroupNode` shows exactly one child subtree and hides the rest, so a bug that shows two (or
      // none) is a draw-count difference the gate reads directly. Distances are set so level 0 is the
      // one the fixed camera selects, which keeps the frame deterministic.
      const lodGroup = new cleo.LodGroupNode('lodGroup');
      lodGroup.distances = [0, 40, 80];
      lodGroup.cullDistance = 0;
      lodGroup.setPosition([4.2, 0.9, 0.4]);
      scene.addNode(lodGroup);
      for (let level = 0; level < 3; level++) {
        const child = new cleo.ModelNode('lod' + level, new cleo.Model(
          cleo.Geometry.Sphere(24 - level * 8, 0.65),
          cleo.Material.PBR({ baseColor: [0.4 + level * 0.2, 0.7, 0.9 - level * 0.2],
                              metallic: 0.2, roughness: 0.5 }),
        ));
        lodGroup.addChild(child);
      }
      window.__lodLevel = () => {
        const g = engine.scene && [...engine.scene.nodes].find(n => n.name === 'lodGroup');
        return g ? g.activeLod : -1;
      };

      // 5. An INSTANCED batch whose mesh carries LOD index buffers.
      //
      // `_recordFoliageDraw` and `_drawInstancedGroup` used to bail to `Mesh.drawInstanced` — a raw
      // `gl` path — whenever `hasLods` was true, and were widened onto `activeIndexBuffer` without any
      // scene ever having such a mesh. This is that scene.
      const lodInstanced = new cleo.Model(
        cleo.Geometry.Sphere(20, 0.3),
        cleo.Material.PBR({ baseColor: [0.85, 0.55, 0.95], metallic: 0.3, roughness: 0.35 }),
      );
      for (let i = 0; i < 6; i++) {
        const n = new cleo.ModelNode('lodInst' + i, lodInstanced);
        n.setPosition([-5 + i * 1.1, 0.35, 4.2]);
        scene.addNode(n);
        if (!n.initialized) n.initializeModel();
      }
      // Coarser index sets over the SAME vertex buffer, which is what a terrain LOD level is. Built
      // from the base indices by dropping every other triangle rather than from a decimator: the point
      // is that a second index buffer exists and is selected, not that it is a good simplification.
      const baseIndices = lodInstanced.geometry.indices;
      const decimate = (step) => {
        const out = [];
        for (let t = 0; t < baseIndices.length; t += 3)
          if ((t / 3) % step === 0) out.push(baseIndices[t], baseIndices[t + 1], baseIndices[t + 2]);
        return out;
      };
      lodInstanced.mesh.setLodIndices([decimate(2), decimate(4)]);
      window.__instancedHasLods = () => lodInstanced.mesh.hasLods;

      // 6. Terrain layer textures.
      //
      // The landscape `full` builds is untextured, so `u_layerCount` is 0 and every branch in
      // chunks/terrainLayers.wgsl that reads an albedo, a normal or a height map is skipped — the
      // height-aware blend included. Two layers with different maps make the splat blend do real work.
      //
      // Terrain marches its height field exactly as a standard material does, so this layer covers the
      // BLENDED four-layer march (one shared ray, chunks/terrainLayers.wgsl) that `parallaxCube` — a
      // single-field standard PBR material — does not reach. Deeper than the 0.05 default so the march
      // runs several steps at this camera angle rather than resolving in one.
      const land = [...scene.landscapes][0];
      if (land) {
        const rock = cleo.TerrainMaterial.Create('pbr', {
          baseColor: [0.62, 0.6, 0.58], metallic: 0.0, roughness: 0.85,
          textures: { baseColorTexture: 'checker', normalMap: 'normalGrad' },
        });
        rock.tiling = 8;
        rock.displacementScale = 0.09;
        rock.heightBlend = 1.5;
        // `heightRocks`, NOT `aoGrad`, and the difference is the whole gate below.
        //
        // `aoGrad` is a 32x32 LINEAR RAMP, and it made the march inert here in two independent ways.
        // Its split lands at `log2(32/8) = 2`, which the marched level sat past while `parallaxLod`
        // floored the base-uv footprint before the per-layer tiling shift — so both taps of
        // `residualHeight` hit the same mip and the residual was identically zero at every fragment.
        // That floor has moved behind the shift, so the level now resolves to 0 and the taps do differ;
        // what remains is the deeper problem, which is that a linear ramp has almost no residual to
        // carry even in principle. Either way the assertions passed throughout, because they read a
        // UNIFORM rather than pixels.
        //
        // 256 texels of fine noise puts the split at `log2(256/8) = 5`, comfortably above the level a
        // near-field fragment resolves, so the marched half is real and the A/B in meshCheck can see it.
        rock.textures.set('displacementMap', 'heightRocks');
        // TERRAIN AMBIENT OCCLUSION. Terrain hardcoded `ao = 1` until now, so it took full ambient
        // everywhere while a mesh beside it got cavity darkening. The map rides in the ALPHA of the
        // packed `u_albedo0` -- terrain's nine texture units were full, and `addLayer` only ever
        // sampled `.rgb`, so the channel was already there and unused. Layer 1 deliberately has no
        // occlusion map, which keeps the `hasAO == 0` branch and the weighted blend of a mapped
        // against an unmapped layer on the gated path too.
        rock.textures.set('occlusionMap', 'aoTerrain');
        land.terrain.setLayer(0, rock);

        const moss = cleo.TerrainMaterial.Create('pbr', {
          baseColor: [0.34, 0.5, 0.22], metallic: 0.0, roughness: 0.7,
          textures: { baseColorTexture: 'metalGrad', normalMap: 'normalGrad' },
        });
        moss.tiling = 14;
        moss.auto = true;
        moss.hRange = [0, 3];
        moss.sRange = [0, 0.5];
        land.terrain.setLayer(1, moss);

        // TERRAIN VERTEX DISPLACEMENT, which had no coverage at all.
        //
        // This terrain is `size 24, resolution 33` and the layer tiles 8x — so it gets four vertices
        // per repeat of its height map. That is the WORST case for the band split, which is exactly why
        // the gate belongs here: at this sample rate a point-sampled bake aliases into low-frequency
        // blobs, and a band-limited one must not. The split level lands high, so almost all of the
        // relief is carried by the march rather than the vertices — also worth exercising.
        // No mode to set: a terrain layer displaces because it has a height map. The depth is WORLD
        // METRES as authored — 0.35 m here, whatever the terrain's size or the layer's tiling. It used
        // to be tiled uv converted by `size / tiling`, which made this same number mean 1.05 m.
        rock.displacementScale = 0.35;
        land.terrain.setLayer(0, rock);

        // Reports what HAPPENED, not what was asked for. A bake that never ran leaves the mode set and
        // the surface identical to the sculpted heights, which reads as "displacement covered" in a
        // baseline while covering nothing — so the spread between the rendered surface and `_heights`
        // is the number that matters.
        window.__terrainDisplaced = () => {
          const land = engine.scene && [...engine.scene.landscapes][0];
          if (!land) return JSON.stringify({ error: 'no landscape' });
          const t = land.terrain;
          const heights = t.heights;
          const surface = t.renderHeights;
          let moved = 0, maxDelta = 0;
          if (surface) {
            for (let i = 0; i < heights.length; i++) {
              const d = Math.abs(surface[i] - heights[i]);
              if (d > 1e-6) moved++;
              if (d > maxDelta) maxDelta = d;
            }
          }
          const m = t.material;
          return JSON.stringify({
            baked: !!surface,
            moved,
            total: heights.length,
            maxDelta: +maxDelta.toFixed(4),
            // A displaced layer must STAY in the march, carrying the residual the grid cannot hold.
            // `u_hasHeight` also drives `layerHeights`, which the height-aware blend needs.
            marches: m.properties.get('u_hasHeight0') === 1,
            // THE SPLIT, as the shader will read it. `u_marchDepth0` is the residual's depth already
            // converted to base uv, and it must be POSITIVE: a zero there is the state this whole round
            // was about — the geometry carrying the coarse band and nothing drawing the fine one.
            // `u_splitLod0` is where the two halves meet, in the packed texture's mip space.
            marchDepth: +(m.properties.get('u_marchDepth0') || 0).toFixed(6),
            splitLod: +(m.properties.get('u_splitLod0') || 0).toFixed(3),
            residRange: +(m.properties.get('u_residRange0') || 0).toFixed(4),
            // The relief depth the ENGINE will apply, in world metres. Read straight off the layer,
            // because that IS the amplitude now — re-deriving it here with a `size / tiling` conversion
            // is what let the old assertion keep passing after the engine stopped doing that.
            amplitude: +(t.layers[0] ? t.layers[0].dispScale : 0).toFixed(4),
            // `lod`, not `displaceLod`: a chunk carries its LOD level and its displace KEY, and there
            // has never been a `displaceLod` on one. This reported `[null]` for every chunk, which reads
            // exactly like a terrain that has not picked a level yet.
            chunkLods: t.chunks.map(c => c.lod),
            // A layer with no height map has nothing to split and nothing to march.
            otherLayerMarchDepth: +(m.properties.get('u_marchDepth1') || 0).toFixed(6),
            // The dense mesh, reported from what was actually BUILT rather than from the config: a
            // mapping that ignored the density would leave the vertex count at its density-1 value.
            // The chunk's OWN density, derived from the detail target and the layers — not the config's
            // fixed multiplier, which is only the fallback when the target is 0.
            renderDensity: t.densityFor(0),
            chunkVerts: t.chunks[0] ? t.chunks[0].model.geometry.vertexCount : 0,
            // From the TERRAIN's density, not `chunks[0].density` — which this used to read and which
            // has never existed on a chunk. Density moved from per-chunk to one number for the whole
            // terrain (`Every chunk is built at one density now`), and nothing updated this line, so
            // `expectedVerts` was `Math.pow(NaN, 2)` -> null. The gate that reads it could then only
            // pass in the one state where the comparison is vacuous — before any chunk exists, where
            // both sides are 0 — which is precisely the state it was written to reject.
            expectedVerts: t.chunks[0]
              ? Math.pow((t.chunks[0].c1 - t.chunks[0].c0) * t.densityFor(0) + 1, 2) : 0,
            chunkCount: t.chunks.length,
          });
        };
        window.__terrainLayers = () => land.terrain.layers.filter(l => l && l.albedoId).length;

        // THE MARCH, MEASURED IN PIXELS. Every other assertion about it reads a uniform, and a uniform
        // being right is not the same as the effect reaching the screen — the residual march was
        // completely inert on this page for a whole round while `marchDepth > 0` passed, because the
        // fixture's height map was a linear ramp and `residualHeight`'s two taps landed on the same mip.
        //
        // Setting the depth to 0 is the one switch that removes the march and changes nothing else: the
        // bake, the weights, the blend and every texture stay exactly as they are. Capture a frame each
        // way and the signature must differ.
        //
        // The override has to SURVIVE A FRAME, which is the part that is not obvious: `syncPackedLayers`
        // runs once per landscape per frame and calls `_writeMarchUniforms`, so a plain property write
        // is overwritten before anything is composited. The first attempt at this probe reported 0/128
        // for exactly that reason and looked like a shader that ignored the uniform. The pack is fully
        // resolved by the time this runs, so suspending the sync for the two captures changes nothing
        // else about the frame.
        let marchDepth0 = null;
        let syncPacked = null;
        window.__setMarchDepth = (v) => {
          const t = land.terrain, m = t.material;
          if (marchDepth0 === null) marchDepth0 = m.properties.get('u_marchDepth0');
          if (syncPacked === null) syncPacked = t.syncPackedLayers.bind(t);
          if (v === null) { t.syncPackedLayers = syncPacked; syncPacked = null; }
          else { t.syncPackedLayers = () => {}; }
          m.properties.set('u_marchDepth0', v === null ? marchDepth0 : v);
          return String(m.properties.get('u_marchDepth0'));
        };
      } else {
        window.__terrainLayers = () => -1;
      }

      // 7. An animated sprite, held STILL.
      //
      // `loop: false` over a one-frame list leaves it on frame 0 for the life of the scene, so the
      // animated-sprite path is exercised without making the signature depend on when the capture
      // happened — the discipline the whole `full` block keeps.
      const animTiles = cleo.gridTileset('animcheck.ts', 'checker', 8, 8);
      const animSprite = new cleo.AnimatedSpriteNode('animSprite',
        new cleo.Sprite({ tileset: animTiles, tileIndex: 27, tint: [0.9, 0.9, 0.4] }),
        { frames: [27], fps: 1, loop: false, constraints: 'cylindrical' });
      animSprite.setPosition([1.2, 1.3, 2.2]);
      scene.addNode(animSprite);
    } catch (e) {
      window.__everySceneError = String((e && e.stack) || e);
    }

    // ---------------------------------------------------------------------------------------------
    // `?scene=every2d` — the 2D half.
    //
    // "2D" in this engine is a CAMERA and its content, not a second renderer: an orthographic
    // projection plus the xy grid plane. Two renderer branches exist solely for it — the grid's fade
    // radius (`renderer.ts`, `_activeCamera.type === 'orthographic'`) and the sky's perspective
    // override — and neither had ever been inside a gated frame. Not one measured pixel, on either
    // backend, has ever come from an ortho projection.
    //
    // The 3D props are HIDDEN rather than never built. The page's instrumentation reaches for three
    // base-scene nodes by name — `camera` for the motion configurations, `probe` for the probe
    // preview, `cube` for the outline mask — so the base block has to run whatever profile is asked
    // for. Hiding the rest keeps every other profile on a byte-identical code path (nothing about
    // base/full/every changes) while making what this profile actually RENDERS 2D content.
    // ---------------------------------------------------------------------------------------------
    if (twoDScene) try {
      // Orthographic, and framed on the tile grid below. `near` stays positive and `far` well past the
      // content so nothing is clipped by the ortho box, which is a different failure from a wrong
      // projection and would be easy to mistake for one.
      camera.camera.type = 'orthographic';
      camera.camera.left = -8; camera.camera.right = 8;
      camera.camera.bottom = -4.5; camera.camera.top = 4.5;
      camera.camera.near = 0.1; camera.camera.far = 100;
      // In FRONT of the plane, yawed 180 to look back at it. Two facts decide this and both cost a
      // run to find: `Node.worldForward` is (0,0,1) at identity rotation, so an unrotated camera
      // faces AWAY from content in front of it and renders nothing but sky; and tilemap quads face
      // +Z, so viewing them from -Z shows their back faces and culls every one. Standing at +Z and
      // turning round satisfies both. Depth decreases away from the viewer: background at -z.
      camera.setPosition([0, 0, 12]);
      camera.setRotation([0, 180, 0]);
      engine.renderer.setGridPlane('xy');
      window.__cameraType = () => (engine.scene && engine.scene.activeCamera
        ? engine.scene.activeCamera.type : 'none');

      // Hide the 3D props. `cube` stays visible — the outline configuration selects it — and so do the
      // lights, which is what proves the lighting path still runs under an ortho projection.
      for (const n of scene.models) {
        if (n.name === 'cube') continue;
        n.visible = false;
      }

      // A cubemap sky, the one sky kind no gated scene has had. `full` uses SkyAtmosphereNode because
      // the skyFog and godRays configurations need it; nothing claims the sky here, so the skybox goes
      // where it can actually be seen. Six distinct faces, so a face-ordering or orientation bug is
      // visible rather than symmetric.
      const face = (r, g, b, label) => {
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const fg = c.getContext('2d');
        fg.fillStyle = `rgb(${r}, ${g}, ${b})`;
        fg.fillRect(0, 0, 32, 32);
        // A corner mark: a rotated face still fills the same way, and only an asymmetric mark says so.
        fg.fillStyle = '#ffffff';
        fg.fillRect(2, 2, 8, 4);
        fg.fillStyle = '#000000';
        fg.fillRect(2, 2, 4, 4);
        return c.toDataURL('image/png');
      };
      // The base scene's SkyAtmosphereNode has to GO, not just be hidden: `_renderSky` prefers a
      // baked atmosphere cube over a skybox whenever one exists, so leaving it in place would
      // build the cubemap and never draw it.
      scene.removeNodesByName('sky');
      const skybox = await cleo.Skybox.fromBase64({
        posX: face(200, 60, 60), negX: face(60, 200, 60),
        posY: face(60, 60, 200), negY: face(200, 200, 60),
        posZ: face(200, 60, 200), negZ: face(60, 200, 200),
      });
      scene.addNode(new cleo.SkyboxNode('skybox', skybox));

      // A tilemap with more than one layer. `full` has a single-layer map; a second layer is what makes
      // the per-layer draw and the chunk's layer ordering do work, and it is what a 2D game has.
      const tiles = cleo.gridTileset('twodtiles.ts', 'checker', 8, 8);
      const map = new cleo.Tilemap({ kind: 'orthogonal', cellWidth: 1, cellHeight: 1 });
      map.registerTileset(tiles);
      map.addLayer({ tilesetId: tiles.id });
      map.addLayer({ tilesetId: tiles.id });
      for (let row = 0; row < 4; row++)
        for (let col = 0; col < 16; col++) {
          // A closed-form pattern, not a random one: the whole scene has to be identical between the
          // two backend windows the diff compares.
          map.setTile(0, col, row, ((col * 3 + row * 5) & 7) + ((col + row) & 1) * 8);
          // The second layer is SPARSE, which is what makes it a second layer rather than a second
          // copy: a chunk that is empty in one layer and populated in another is where a per-layer
          // draw can lose its ordering.
          if (((col + row * 2) & 3) === 0) map.setTile(1, col, row, 40 + ((col * row) & 7));
        }
      const mapNode2d = new cleo.TilemapNode('tiles2d', map);
      // A floor BAND across the lower third, which is what a 2D game's tilemap looks like and
      // what leaves the sprites and quads somewhere to be seen. Hung from its TOP edge, because
      // `cellMath.ts` places row 0 at `-(row + 0.5) * cellHeight` and rows run DOWNWARD — anchored
      // at the bottom instead, the whole map sits below the ortho box with one row in frame.
      mapNode2d.setPosition([-8, -1, -1]);
      scene.addNode(mapNode2d);
      window.__tile2dLayers = () => map.layers.length;

      // Sprites in `free` mode — a 2D game does not billboard toward the camera, it places quads on a
      // plane. One tinted, one untinted, one animated and held on a single frame.
      const spriteTiles2d = cleo.gridTileset('twodsprites.ts', 'checker', 8, 8);
      const place = (name, tile, tint, x, y) => {
        const s = new cleo.SpriteNode(name,
          new cleo.Sprite({ tileset: spriteTiles2d, tileIndex: tile, tint }), 'free');
        s.setPosition([x, y, 0.5]);
        scene.addNode(s);
        return s;
      };
      place('hero', 12, [1, 1, 1], -4.5, 0.7);
      place('coin', 21, [1.0, 0.85, 0.2], 0.6, 2.3);
      place('enemy', 33, [0.9, 0.3, 0.35], 4.8, 1.1);

      const anim2d = new cleo.AnimatedSpriteNode('anim2d',
        new cleo.Sprite({ tileset: spriteTiles2d, tileIndex: 44, tint: [0.4, 0.9, 1.0] }),
        { frames: [44], fps: 1, loop: false, constraints: 'free' });
      anim2d.setPosition([2.6, 3.4, 0.5]);
      scene.addNode(anim2d);

      // Unlit and transparent quads: the two material kinds a 2D scene is mostly made of, and the
      // blend queue under an ortho projection, which is where a depth-range mistake would show.
      const quad = (name, geom, material, x, y, z) => {
        const n = new cleo.ModelNode(name, new cleo.Model(geom, material));
        n.setPosition([x, y, z]);
        // STOOD UP. `Geometry.Plane` lies in XZ with a +Y normal — it is a floor, not a sprite —
        // so to a camera looking down -Z it is edge-on and renders as a sliver. Rotating here
        // rather than at each call site is what keeps the three of them agreeing.
        n.setRotation([90, 0, 0]);
        scene.addNode(n);
        return n;
      };
      quad('unlitQuad', cleo.Geometry.Plane(2.2, 1.4),
           cleo.Material.Basic({ color: [0.25, 0.85, 0.55], textures: { base: 'checker' } },
                               { side: 'double' }),
           -3.2, -2.6, 0.2);
      quad('fadeQuad', cleo.Geometry.Plane(2.6, 1.6),
           cleo.Material.Basic({ color: [1.0, 0.4, 0.6], opacity: 0.5 },
                               { transparent: true, side: 'double' }),
           3.4, -2.4, 0.6);
      // One LIT quad, so the ortho frame is not entirely unlit: the deferred G-buffer and the lighting
      // pass both have to survive a projection with no perspective divide.
      quad('litQuad', cleo.Geometry.Plane(2.0, 2.0),
           cleo.Material.PBR({ baseColor: [0.8, 0.8, 0.85], metallic: 0.1, roughness: 0.5,
                               textures: { baseColorTexture: 'checker' } },
                             { side: 'double' }),
           -6.2, 2.9, 0.2);
    } catch (e) {
      window.__twoDSceneError = String((e && e.stack) || e);
    }

    engine.setScene(scene);
    scene.start();
    engine.isPaused = false;
    engine.run();

    // Cascade updates are STAGGERED by default (cascade 1 every 2nd frame, cascade 2 every 4th), so the
    // number of shadow-caster draws in any single frame depends on the frame index. That makes a
    // one-frame stat snapshot non-deterministic and useless for a before/after diff. Pin it.
    engine.renderer.shadowStagger = false;
    // Draw-time GL errors are invisible otherwise: the engine's only error checks are in the texture
    // upload paths, and `gl.getError` reports a global sticky flag, so a bad draw surfaced as a texture
    // failure at whatever unrelated call site looked next. Costs a driver round trip per stage, which is
    // why it is opt-in and enabled here rather than by default.
    engine.renderer.debugGLErrors = true;

    // The selection outline (`outline` writes the mask, `outlinePost` expands and composites it) draws
    // only when the renderer HAS a selected node. Nothing in a harness scene ever set one, so both
    // programs compiled and never drew a pixel in any capture. Pin a selection in the full profile.
    // Remembered so `__select()` can put it back — see the hook below.
    if (fullScene) { engine.renderer.setSelectedNode(cube.id); window.__defaultSelectedId = cube.id; }

    // `probePreview` renders a baked probe's cubemap to an equirect strip for the editor's inspector.
    // It is off-frame — it targets its own FBO — so it can never appear in a viewport signature and has
    // to be invoked deliberately. Returns a data URL, or '' if the probe never baked.
    window.__probePreview = (width) => engine.renderer.renderProbePreview(probe, width || 64);

    // The renderer itself, for ad-hoc probing from a harness script. Every other hook here is a
    // named operation; this one exists because diagnosing 'why did that pass not run' needs to read
    // arbitrary renderer state, and a harness that cannot do that ends up guessing.
    window.__renderer = engine.renderer;

    window.__stats = () => ({ ...cleo.frameStats });
    window.__renderStats = () => ({ ...engine.renderer.stats });

    // Which shader programs this scene actually compiled. ShaderManager keys its registry by the name
    // the renderer asked for, so this answers "what did the screenshots exercise?" as a measurement
    // rather than as a reading of the draw code. Private field on purpose — nothing ships this.
    window.__shaderNames = () => Array.from(engine.renderer._shaderManager._shaders.keys()).sort();

    // The skeleton overlay is the ONLY consumer of the `basicInstanced` program — it draws joint
    // spheres and bone connectors instanced, depth-test off, in the gizmo pass. Without it that shader
    // was converted to WGSL with nothing exercising it. Off by default and enabled for one shot,
    // because always-on-top geometry would alter every other shot in the gallery.
    window.__setSkeletonOverlay = (on) => {
      if (!on) { engine.renderer.setSkeletonOverlay(null); return; }
      const m4 = cleo.Vec.mat4;
      const at = (x, y, z, s) => {
        const m = m4.create();
        m4.translate(m, m, [x, y, z]);
        m4.scale(m, m, [s, s, s]);
        return m;
      };

      const joints = [at(-0.7, 2.0, 0, 0.30), at(0, 2.5, 0, 0.30), at(0.7, 2.0, 0, 0.30)];
      const bones = [at(-0.35, 2.25, 0, 0.16), at(0.35, 2.25, 0, 0.16)];
      const pack = (mats) => {
        const out = new Float32Array(mats.length * 16);
        mats.forEach((m, i) => out.set(m, i * 16));
        return out;
      };
      engine.renderer.setSkeletonOverlay({
        jointMatrices: pack(joints), jointCount: joints.length, jointColor: [1.0, 0.75, 0.1],
        boneMatrices: pack(bones), boneCount: bones.length, boneColor: [0.2, 0.8, 1.0],
      });
    };

    // The skeleton overlay is `basicInstanced`'s only consumer and, like the gizmos, draws with the
    // depth test off. captureGallery gives it a shot and programCoverage a bind, but neither is a
    // signature — so on in the full profile, where it has one. The gallery still toggles it per shot,
    // which overrides this.
    if (fullScene) window.__setSkeletonOverlay(true);

    // Every program's uniform-block layout as the DRIVER reports it, for checking the offsets computed
    // from the WGSL type rules. See tools/harness/uniformLayoutCheck.js.
    window.__uniformLayouts = () => {
      const out = {};
      for (const [name, shader] of engine.renderer._shaderManager._shaders)
        out[name] = shader.describeBlockLayout();
      return out;
    };
    // AUTO-EXPOSURE OFF for every gated scene, and this is not a way of dodging a baseline move.
    //
    // Adaptation is TEMPORAL: the exposure eases toward the metered target over about a second, so a
    // captured frame would depend on how many frames had elapsed and how fast the machine ran them.
    // That is the same shape as the terrain-density race that made the dense-mesh gate decide its own
    // result by luck, and it is not worth re-learning. The feature is gated deterministically by the
    // `autoExposure` entry in passConfigs.js, which turns it on with the adaptation forced instant.
    engine.renderer.autoExposureEnabled = false;
    engine.renderer.exposure = 2.0;

    window.__setExposure = (v) => { engine.renderer.exposure = v; };

    // Assign renderer feature toggles by name, so the driver can walk a table of configurations without
    // the page knowing which ones exist. Reports back what it actually set: a silently ignored key would
    // otherwise make a pass look covered when it never ran.
    window.__setRender = (patch) => {
      const applied = [];
      for (const key of Object.keys(patch)) {
        // Some settings are methods rather than properties (the grid is set through setGridVisible /
        // setGridPlane, and only mirrored back as a read-only getter), so prefer a matching setter.
        const setter = 'set' + key.charAt(0).toUpperCase() + key.slice(1);
        if (typeof engine.renderer[setter] === 'function') {
          engine.renderer[setter](patch[key]);
          applied.push(key);
          continue;
        }
        if (!(key in engine.renderer)) continue;
        engine.renderer[key] = patch[key];
        applied.push(key);
      }
      return applied;
    };
    // Motion blur reprojects against the PREVIOUS frame's view matrix, so a static scene produces zero
    // velocity and the pass, while it runs, changes nothing. Moving the camera by a fixed amount gives it
    // something to blur — deterministically, unlike letting a controller drift.
    window.__moveCamera = (dx, dy, dz) => {
      camera.setPosition([4 + dx, 4 + dy, 4 + dz]);
    };
    // Continuous motion, driven per frame, for the one pass that needs it: a single nudge decays to zero
    // velocity within a frame, long before capturePage can compose the result.
    // Rate and amplitude are chosen so every capture lands near t=0, where sin() is close to linear and
    // its DERIVATIVE — the velocity motion blur actually reprojects — is at its maximum and barely
    // changing. A faster oscillation put captures at arbitrary phases, including the turning points where
    // velocity is zero and the blur legitimately vanishes, which made the check fail about a third of the
