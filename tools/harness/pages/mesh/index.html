    // time for a reason that had nothing to do with the shader.
    let motionHandle = null;
    // Motion advances PER RENDERED FRAME, not on a wall-clock timer.
    //
    // Motion blur reprojects against the PREVIOUS frame's view matrix, so its velocity is the
    // difference between two consecutive renders. A `setInterval` cannot guarantee one tick between
    // them: this window is never shown, rAF is starved, and the frames the harness forces with
    // `capturePage` can arrive closer together than the timer fires. The camera is then in the same
    // place two frames running, velocity is zero, the gather early-outs — and the check fails saying
    // "the pass did nothing", which is true and has nothing to do with the pass.
    //
    // rAF fires exactly when a frame is produced, forced ones included, so consecutive rendered
    // frames differ by construction.
    window.__startMotion = (amp) => {
      let t = 0;
      const step = () => {
        if (motionHandle === null) return;
        t += 0.006;
        camera.setPosition([4 + Math.sin(t) * amp, 4, 4]);
        motionHandle = requestAnimationFrame(step);
      };
      motionHandle = requestAnimationFrame(step);
    };
    window.__stopMotion = () => {
      if (motionHandle) cancelAnimationFrame(motionHandle);
      motionHandle = null;
      camera.setPosition([4, 4, 4]);
    };
    // Sky-atmosphere features, toggled per pass configuration.
    //
    // Distance fog and god rays are gated on the node, not the renderer, and both are off by default:
    // enabling them in `base` would fold their cost and their look into every other measurement.
    // Probe state, for the pass gate: intensity 0 is the control, so the configuration measures the
    // probe's actual contribution rather than the scene's ambient.
    window.__probeState = () => {
      const p = window.__probe;
      return p ? { baked: p.hasBakedMaps, bounded: p.bounded, intensity: p.intensity } : 'no probe';
    };
    window.__setProbe = (patch) => {
      const p = window.__probe;
      if (!p) return 'no probe';
      for (const key of Object.keys(patch)) p[key] = patch[key];
      return Object.keys(patch).join(',');
    };

    window.__setSky = (patch) => {
      const node = scene.getNodeByName ? scene.getNodeByName('sky') : null;
      const sky = node || [...(scene.nodes || [])].find(n => n && n.nodeType === 'skyAtmosphere');
      if (!sky) return 'no sky node';
      for (const key of Object.keys(patch)) sky[key] = patch[key];
      return Object.keys(patch).join(',');
    };

    // Material properties, by node name. The third sibling of __setProbe/__setLight, and it exists
    // for the same reason: a pass config reaches renderer state and nothing else, and some gates need
    // to move the SURFACE. Specular occlusion is the case in point — its correction only diverges
    // from plain AO at low roughness, so measuring it needs a smoother material than the fixture
    // authors anywhere.
    window.__setMaterial = (name, patch) => {
      const node = (scene.getNodeByName ? scene.getNodeByName(name) : null)
                || [...(scene.nodes || [])].find(n => n && n.name === name);
      const material = node && node.model && node.model.material;
      if (!material) return "no material " + name;
      const applied = [];
      for (const key of Object.keys(patch)) {
        if (!material.properties.has(key)) continue;
        material.properties.set(key, patch[key]);
        applied.push(key);
      }
      return applied.join(",");
    };

    // The deferred env-map fallback, on demand.
    //
    // That branch (`u_useEnvMap` in deferredLighting.wgsl) has never been reachable from any harness
    // scene, and it needs TWO independent things that no page supplied. First, `scene.environmentMap` —
    // the deferred pass reads that alone (`renderer.ts`, `_setDeferredLighting`), unlike the forward one
    // which takes the probe's own cube from `probeForPoint`, so a skybox does not reach it. Second, a
    // BOUNDED probe: the fallback is scaled by `rest = (1 - w0) * (1 - w1)`, and this page's probe is
    // unbounded, so `probeWeight` returns 1 and `rest` is 0 whatever the env flag says.
    //
    // Six faces drawn here rather than loaded, so the bytes are a valid PNG the browser will decode, and
    // each face a different hue so a reflection of it is unmistakable. Built once and cached: creating a
    // cubemap per toggle would measure the upload path rather than the shading.
    let __envCube = null;
    const __makeFace = (hex) => new Promise((resolve) => {
      const c = document.createElement('canvas');
      c.width = c.height = 32;
      const gg = c.getContext('2d');
      gg.fillStyle = hex;
      gg.fillRect(0, 0, 32, 32);
      // A bright corner so the face is not flat — a constant cube reflects identically from every
      // direction, which would make the case pass for the wrong reason.
      gg.fillStyle = '#ffffff';
      gg.fillRect(0, 0, 12, 12);
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = c.toDataURL('image/png');
    });
    window.__setEnvMap = async (enabled) => {
      if (!enabled) { scene.environmentMap = null; return 'off'; }
      if (!__envCube) {
        const hues = ['#b03030', '#30b030', '#3030b0', '#b0b030', '#b030b0', '#30b0b0'];
        const [posX, negX, posY, negY, posZ, negZ] = await Promise.all(hues.map(__makeFace));
        const tex = new cleo.Texture({ target: 'cubemap', flipY: true });
        tex.create({ posX, negX, posY, negY, posZ, negZ }, 32, 32);
        __envCube = tex;
      }
      scene.environmentMap = __envCube;
      return 'on';
    };

    // A normal map, on demand, for whichever material the caller names.
    //
    // Horizon occlusion cannot be gated without one. The term compares the reflection ray against the
    // GEOMETRIC normal, and on a surface with no normal map the shading and geometric normals are the
    // same vector — `reflect` can never send a ray below the normal it reflected about, so the term is
    // identically 1 and a differential measures two identical frames.
    //
    // On demand rather than authored into the scene, which is the same choice `__setEnvMap` makes and
    // for the same reason: a normal map on a base-scene object would move every base baseline in the
    // repo to gate one feature. `__setMaterial` cannot do this — it patches scalar PROPERTIES only, and
    // a normal map is a texture plus its `hasNormalMap` flag.
    let __gateNormal = null;
    window.__setNormalMap = (name, enabled) => {
      const node = (scene.getNodeByName ? scene.getNodeByName(name) : null)
                || [...(scene.nodes || [])].find(n => n && n.name === name);
      const material = node && node.model && node.model.material;
      if (!material) return 'no material ' + name;
      if (!enabled) {
        material.textures.delete('normalMap');
        material.properties.set('hasNormalMap', false);
        return 'off';
      }
      if (!__gateNormal) {
        // A REAL normal map: a flat (128,128,255) would leave the TBN path mathematically idle and the
        // term it is here to exercise would stay at 1. Steep enough (+-110 of 128) that the perturbed
        // reflection actually crosses the surface plane at this camera's angle on the cube.
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const g = c.getContext('2d');
        for (let y = 0; y < 32; y++)
          for (let x = 0; x < 32; x++) {
            const bump = Math.sin(x * 0.9) * Math.cos(y * 0.9);
            g.fillStyle = `rgb(${Math.round(128 + bump * 110)}, ${Math.round(128 - bump * 110)}, 190)`;
            g.fillRect(x, y, 1, 1);
          }
        cleo.TextureManager.Instance.addTextureFromBase64(c.toDataURL('image/png'), { mipMap: true },
                                                          'gateNormal');
        __gateNormal = 'gateNormal';
      }
      material.textures.set('normalMap', __gateNormal);
      material.properties.set('hasNormalMap', true);
      return 'on';
    };
    // Light state, by node name. The sibling of __setProbe, and it exists for the same reason: a pass
    // config can only patch RENDERER properties (see passConfigs.js `__setRender`), and the things the
    // lighting gate has to move — a light's sourceRadius, a sun's angularRadius — live on the light,
    // not on the renderer. Returns the keys it applied, so a renamed property fails loudly rather than
    // leaving the configuration silently measuring nothing.
    window.__setLight = (name, patch) => {
      const node = (scene.getNodeByName ? scene.getNodeByName(name) : null)
                || [...(scene.nodes || [])].find(n => n && n.name === name);
      if (!node || !node.light) return 'no light ' + name;
      const applied = [];
      for (const key of Object.keys(patch)) {
        if (!(key in node.light)) continue;
        node.light[key] = patch[key];
        applied.push(key);
      }
      return applied.join(',');
    };
    // Where a named node lands on screen, in 0..1 viewport coordinates with y already flipped to
    // top-down so a driver can turn it straight into a capture rect.
    //
    // The lighting gate crops to a box around one object, because a full-frame 8x8 grid cannot resolve
    // a specular highlight (see signature.js). Deriving the box from the node's WORLD position rather
    // than from measured pixel coordinates is what keeps that gate from silently drifting off its
    // subject the first time anyone nudges the camera or the window size.
    window.__projectToScreen = (name) => {
      const node = (scene.getNodeByName ? scene.getNodeByName(name) : null)
                || [...(scene.nodes || [])].find(n => n && n.name === name);
      if (!node) return null;
      const camNode = scene.activeCamera;
      const cam = camNode && camNode.camera;
      if (!cam) return null;
      const p = node.worldPosition;
      // Two steps rather than a combined matrix: `Camera` exposes view and projection separately and
      // the page has no matrix library. Column-major, as gl-matrix stores them.
      const m = (a, x, y, z, w) => [
        a[0] * x + a[4] * y + a[8] * z + a[12] * w,
        a[1] * x + a[5] * y + a[9] * z + a[13] * w,
        a[2] * x + a[6] * y + a[10] * z + a[14] * w,
        a[3] * x + a[7] * y + a[11] * z + a[15] * w,
      ];
      const view = m(cam.viewMatrix, p[0], p[1], p[2], 1);
      const clip = m(cam.projectionMatrix, view[0], view[1], view[2], view[3]);
      if (!(Math.abs(clip[3]) > 1e-6)) return null;
      return { x: (clip[0] / clip[3]) * 0.5 + 0.5, y: 0.5 - (clip[1] / clip[3]) * 0.5,
               behind: clip[3] < 0 };
    };

    window.__lightState = (name) => {
      const node = (scene.getNodeByName ? scene.getNodeByName(name) : null)
                || [...(scene.nodes || [])].find(n => n && n.name === name);
      if (!node || !node.light) return 'no light ' + name;
      const l = node.light;
      return { intensity: l.intensity, sourceRadius: l.sourceRadius, angularRadius: l.angularRadius,
               range: l.range };
    };

    // Aim the camera above the horizon.
    //
    // The cloud slab sits at altitude 800..1500 and the scene camera is pitched 30 degrees DOWN to
    // frame the models, with a vertical half-FOV well under that — so no view ray in the normal shot
    // ever has a positive y component, every ray misses the slab, and the raymarch returns zero for
    // every pixel. The pass still binds and still runs, which is exactly why binding is not evidence:
    // `volumetricClouds`, `cloudTemporalResolve` and `cloudUpsample` all showed up as covered while
    // contributing nothing. Re-framing the whole scene around one pass would move every other check,
    // so the sky is looked at on demand instead.
    window.__lookUp = (on) => {
      camera.setRotation(on ? [-22, -135, 0] : [30, -135, 0]);
      return on ? 'up' : 'default';
    };

    // Yaw the camera 180 degrees so NOTHING in the scene is in front of it.
    //
    // The one framing no other check uses, and the only one that can see a missing frustum test: every
    // pass in the default shot has the whole scene in view, so a queue collected with no cull test at
    // all draws exactly the same picture and the same counts as one that culls correctly. The deferred
    // pipeline's forward-overlay queues (opaque Blinn-Phong/custom, and transparent) were collected
    // with no test for exactly as long as that was true.
    // Select a node by name (or clear), so the selection outline can be put over something other than
    // the one PBR cube the full scene selects. The mask draws the SOURCE mesh through a position-only
    // program, so which material the selected mesh was packed for is exactly what it exercises.
    window.__select = (name) => {
      // No argument restores whatever the scene selected at setup. A check that borrows the selection
      // has to give it back: the full scene selects a cube on purpose, and leaving it cleared removes
      // that outline from every capture afterwards — which showed up as a one-cell shading drift and
      // read exactly like driver noise.
      if (name === undefined) { engine.renderer.setSelectedNode(window.__defaultSelectedId || null); return 'restored'; }
      if (!name) { engine.renderer.setSelectedNode(null); return 'cleared'; }
      const node = engine.scene.root.children.find(n => n.name === name)
                 || Array.from(engine.scene.models).find(n => n.name === name);
      if (!node) return 'missing:' + name;
      engine.renderer.setSelectedNode(node.id);
      return node.name;
    };

    window.__lookAway = (on) => {
      camera.setRotation(on ? [30, 45, 0] : [30, -135, 0]);
      return on ? 'away' : 'default';
    };

    // Models in the scene, so the check above can assert that ALL of them were rejected rather than
    // just "fewer than before" — which a partial fix would also satisfy.
    window.__modelCount = () => (engine.scene ? engine.scene.models.size : -1);

    // Cloud parameters, for A/B-ing the pass. The clouds are scene-node state rather than renderer
    // state, so `__setRender` cannot reach them and neither could passCheck.
    window.__setClouds = (patch) => {
      if (!window.__clouds) return 'no cloud node';
      for (const key of Object.keys(patch)) window.__clouds[key] = patch[key];
      return Object.keys(patch).join(',');
    };

    window.__renderState = (keys) => {
      const out = {};
      for (const k of keys) out[k] = engine.renderer[k];
      return out;
    };

    // Real-driver compile of every custom-material prelude.
    //
    // The screen prelude is now GENERATED from an interface description so the ES and Vulkan dialects
    // cannot drift apart. Generated text that reads correctly can still fail to compile — a declaration
    // emitted after its first use, a dropped semicolon — and no unit test sees that, because unit tests
    // have no GL driver. `tryCompileCustom` builds and links a real program, so calling it here is the
    // only place that answer exists.
    const CUSTOM_SOURCES = {
      screen: {
        uniforms: [
          { name: 'intensity', type: 'float', value: 1 },
          { name: 'tint', type: 'vec3', value: [1, 1, 1] },
          { name: 'invert', type: 'bool', value: false },
          { name: 'mask', type: 'sampler2D', value: '' },
        ],
        // Touches every built-in the screen prelude is documented to provide, so a name dropped while
        // restructuring the prelude fails here rather than in somebody's project.
        body: `
vec4 fragment() {
    vec3 c = texture(u_screenTexture, fragTexCoord).rgb;
    float d = texture(u_depth, fragTexCoord).r;
    vec3 w = reconstructWorldPos(fragTexCoord, d);
    float fog = clamp(length(w - u_viewPos) / 100.0, 0.0, 1.0);
    vec2 ct = fragTexCoord - 0.5;
    float vig = 1.0 - dot(ct, ct) * u_intensity;
    float pulse = 0.5 + 0.5 * sin(u_time * PI);
    float sun = u_sunVisible * max(0.0, 1.0 - length(fragTexCoord - u_sunUV) * 8.0);
    vec3 t = mix(c * vig, toLinear(u_tint), fog * 0.2);
    t *= texture(u_mask, fragTexCoord * (u_resolution / u_resolution)).r;
    if (u_invert) t = vec3(1.0) - t;
    return vec4(toSrgb(t * u_exposure + sun * pulse + dot(u_sunDir, vec3(0.0, 1.0, 0.0)) * 0.0), 1.0);
}
`,
      },
      forward: {
        uniforms: [
          { name: 'base', type: 'vec3', value: [1, 1, 1] },
          { name: 'metal', type: 'float', value: 0 },
          { name: 'detail', type: 'sampler2D' },
        ],
        body: `
vec4 fragment() {
    vec3 n = getNormal();
    vec3 d = texture(u_detail, fragTexCoord * 2.0).rgb;
    float sh = shadowCalculation();
    vec3 Lo = vec3(0.0);
    Lo += evaluateDirectionalLight(u_dirLight, n, normalize(u_viewPos - fragPos), u_base * d,
                                  u_metal, 0.5, sh);
    float counts = float(u_numPointLights + u_numSpotlights);
    // The detail texture is added unconditionally, not only through the lit term: a material that is
    // black because it is unlit and one that is black because its sampler is bound wrong look the
    // same, and only one of those is a regression.
    return vec4(Lo + u_sceneAmbient * u_base * counts * 0.0 + d * 0.6 + u_time * 0.0, 1.0);
}
`,
      },
      deferred: {
        uniforms: [{ name: 'base', type: 'vec3', value: [1, 1, 1] },
                   { name: 'detail', type: 'sampler2D' }],
        body: `
void surface(inout Surface s) {
    s.albedo = u_base * texture(u_detail, fragTexCoord * 2.0).rgb;
    s.normal = getNormal();
    s.ao = 1.0;
}
`,
      },
      // Proves a failure is still reported rather than swallowed by the widened return shape.
      broken: { uniforms: [], body: 'vec4 fragment() { return notAThing(); }' },
    };

    // Custom materials that DRAW, not merely compile.
    //
    // The three preludes were compile-tested and none of them was ever rasterised, so the runtime-
    // compiled forward and deferred programs — their lighting, their shadow lookups and their user
    // samplers — had no pixel coverage. Both use a user sampler as well as the engine built-ins,
    // because a bind group has to get the engine-then-user ordering right and nothing else checks it.
    if (fullScene) try {
      const makeCustom = (mode, pos, color) => {
        const spec = CUSTOM_SOURCES[mode];
        const m = cleo.CustomMaterial.Create('pbr', mode);
        m.uniforms = spec.uniforms.map(u => ({ ...u }));
        m.fragmentSource = spec.body;
        m.properties.set('base', color);
        m.textures.set('detail', 'checker');
        m.refreshType();
        const node = new cleo.ModelNode(mode + 'Custom',
          new cleo.Model(cleo.Geometry.Sphere(24, 0.5), m));
        node.setPosition(pos);
        scene.addNode(node);
        return node;
      };
      makeCustom('forward', [-1.5, 0.55, 3.3], [1.0, 0.45, 0.15]);
      makeCustom('deferred', [-0.2, 0.55, 3.6], [0.2, 0.9, 0.5]);
      window.__customDrawn = () => {
        let n = 0;
        for (const m of (engine.scene ? engine.scene.models : [])) if (m.name.endsWith('Custom')) n++;
        return n;
      };
    } catch (e) {
      window.__customDrawError = String((e && e.stack) || e);
    }

    window.__compileCustomOne = (mode) => {
      const spec = CUSTOM_SOURCES[mode];
      const glMode = mode === 'broken' ? 'screen' : mode;
      const r = cleo.tryCompileCustom(glMode, spec.body, spec.uniforms);
      return {
        ok: !!r.ok,
        error: r.error ? String(r.error).slice(0, 600) : null,
        hasWgsl: !!r.wgsl,
        wgslError: r.wgslError ? String(r.wgslError).slice(0, 300) : null,
      };
    };

    window.__compileCustom = () => {
      const out = {};
      for (const mode of Object.keys(CUSTOM_SOURCES)) out[mode] = window.__compileCustomOne(mode);
      return out;
    };

    window.__ready = true;
  } catch (e) {
    window.__error = String((e && e.stack) || e);
  }
})();
</script>
</body>
</html>
