# The pull-request gate: typecheck and test what the pull request changed. Nothing here deploys -- merges into main
# are shipped by release.yml, which runs the same tests.yml first.
#
# WHAT RUNS. The `changes` job asks tools/ci/affected.mjs which areas the pull request touched (its own commits:
# merge-base..head). Each job below runs for its areas only, and the engine is the dependency of everything: an
# engine change typechecks and tests every app. A job skipped because its area did not change is not a failure;
# `CI result` at the bottom is the one check branch protection should require, and it reads every other job.
#
# Severity is deliberately not uniform:
#
#   typecheck  WARNS for the engine and the editor. `tsc --noEmit` is the only thing that checks the editor at all
#              (Vite transforms through esbuild, which strips types without looking at them), so it has to run --
#              but a type error blocks nothing that a green test suite says is working. It reports as an annotation
#              plus a job-summary block, and the job stays green. The app-kit and Creator typechecks BLOCK: both
#              started clean.
#   tests      FAIL.   Plus a coverage floor. They live in tests.yml, which release.yml calls too, so the bar for
#              shipping is the same file as the bar for merging.
#
# None of these touch a secret, so they run for fork pull requests too.
name: CI

on:
  pull_request:
    branches: [main]
  # Everything, on demand.
  workflow_dispatch:

# A newer push to the same branch makes the older run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.affected.outputs.engine }}
      appkit: ${{ steps.affected.outputs.appkit }}
      editor: ${{ steps.affected.outputs.editor }}
      creator: ${{ steps.affected.outputs.creator }}
      examples: ${{ steps.affected.outputs.examples }}
    steps:
      # Full history: the merge base of the pull request's base and head has to be in the clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No setup-node and no install: affected.mjs imports nothing outside node: and the repository.
      - name: Which areas changed
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node tools/ci/affected.mjs --base "$BASE" --head "$HEAD"
          else
            node tools/ci/affected.mjs --all
          fi

  typecheck-engine:
    name: Typecheck engine (warn)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every job here reads the Node major from .nvmrc so there is one source of truth.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The product version lives in four places at once (three package.json files, their lockfiles, and
      # src/version.ts, which drops the fixed `1.` prefix the others cannot store). Only
      # tools/bump-version.mjs writes them; this catches a hand-edit that touched one and missed the rest.
      # A warning here and fatal in release.yml: drift only becomes dangerous at the moment of publishing.
      - name: Version consistency
        id: version
        continue-on-error: true
        shell: bash
        run: node tools/bump-version.mjs --check 2>&1 | tee version.log

      - name: Typecheck
        id: tsc
        continue-on-error: true
        shell: bash
        run: npm run typecheck 2>&1 | tee tsc.log

      - name: Report
        if: always() && (steps.tsc.outcome == 'failure' || steps.version.outcome == 'failure')
        shell: bash
        run: |
          if [ "${{ steps.tsc.outcome }}" = failure ]; then
            echo "::warning title=Engine typecheck failed::$(grep -c 'error TS' tsc.log) TypeScript error(s) -- non-blocking"
            {
              echo "### :warning: Engine typecheck failed (non-blocking)"
              echo '```'
              cat tsc.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.version.outcome }}" = failure ]; then
            echo "::warning title=Version drift::package.json, its lockfiles and src/version.ts disagree -- non-blocking"
            {
              echo "### :warning: Version drift (non-blocking)"
              echo '```'
              cat version.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # One job for the three application typechecks: they share the engine declaration build and the workspace install,
  # which are most of the job's time, and each step runs only for its own area.
  typecheck-apps:
    name: Typecheck applications
    needs: changes
    if: needs.changes.outputs.editor == 'true' || needs.changes.outputs.creator == 'true' || needs.changes.outputs.appkit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # dist/ is untracked and applications/node_modules/cleo points at it, so the engine's declarations must be
      # emitted before the applications can resolve -- let alone typecheck against -- `cleo`. This is also the
      # only automated check on that .d.ts tree, which the editor compiles against in strict mode.
      - name: Build engine declarations (the applications resolve cleo -> ../../dist)
        run: npm run build

      - name: Install application deps
        run: npm ci
        working-directory: applications

      - name: Typecheck editor
        id: tsc
        if: needs.changes.outputs.editor == 'true'
        continue-on-error: true
        shell: bash
        working-directory: applications/editor
        run: npm run typecheck 2>&1 | tee tsc.log

      - name: Report
        if: always() && steps.tsc.outcome == 'failure'
        shell: bash
        working-directory: applications/editor
        run: |
          echo "::warning title=Editor typecheck failed::$(grep -c 'error TS' tsc.log) TypeScript error(s) -- non-blocking"
          {
            echo "### :warning: Editor typecheck failed (non-blocking)"
            echo '```'
            cat tsc.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Blocking, unlike the editor's: both are new and start clean.
      - name: Typecheck app-kit
        if: needs.changes.outputs.appkit == 'true'
        working-directory: applications/app-kit
        run: npm run typecheck

      - name: Typecheck Cleo Creator
        if: needs.changes.outputs.creator == 'true'
        working-directory: applications/creator
        run: npm run typecheck

  tests:
    name: Unit tests
    needs: changes
    uses: ./.github/workflows/tests.yml
    with:
      engine: ${{ needs.changes.outputs.engine == 'true' }}
      appkit: ${{ needs.changes.outputs.appkit == 'true' }}
      editor: ${{ needs.changes.outputs.editor == 'true' }}
      creator: ${{ needs.changes.outputs.creator == 'true' }}
      examples: ${{ needs.changes.outputs.examples == 'true' }}

  # The one check to require. A job skipped for its area reports `skipped`, which is fine; one that failed or was
  # cancelled is not. `always()` so this runs -- and fails -- even when something it needs did.
  ci-result:
    name: CI result
    needs: [changes, typecheck-engine, typecheck-apps, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) echo "::error title=CI failed::a required job failed or was cancelled"; exit 1 ;;
          esac
