# Cuts a release when a pull request from `development` is merged into `main`: runs the tests, bumps
# the version, writes the PR's own description into the changelog, tags, builds, publishes and
# deploys -- and on a breaking release, also builds and attaches the desktop installers.
#
# THE CHANGELOG IS THE PULL REQUEST DESCRIPTION. It used to be a list of commit subjects between two
# tags, which is not what CHANGELOG.md reads like: its entries are prose, and prose is what a reviewer
# has already written by the time a branch is ready to merge. tools/release-pr.mjs is the one place
# that reads a PR -- it strips the template's HTML comments, drops the `Release:` marker and demotes
# top-level headings so they nest under the version -- and tools/changelog.mjs still owns the file's
# shape. The description becomes the GitHub Release body too, so the two cannot disagree.
#
# HOW FAR IT BUMPS. A `release:breaking` / `release:feature` / `release:fix` label on the PR decides;
# failing that, a `Release: <level>` line in the description; failing that, `fix`. A `no-release` label
# skips the release entirely, and so does a merge from any branch other than `development`. Two
# release labels is an error rather than a coin toss -- see tools/release-pr.mjs.
#
# The version scheme is 1.<breaking>.<feature>.<fix>. npm only accepts three-component semver, so the
# leading `1.` is a fixed product-line prefix that exists only in tags and in the UI -- package.json
# stores the remaining x.y.z. tools/bump-version.mjs owns that mapping and is the only thing that
# rewrites the three package.json files, their lockfiles and src/version.ts.
#
# `workflow_dispatch` survives as the manual fallback, and it still takes its notes from the commit
# list: there is no pull request to read when a human triggers it by hand.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: What kind of release is this?
        required: true
        type: choice
        default: fix
        options:
          - fix        # z -- fixes and refactors
          - feature    # y -- major features
          - breaking   # x -- breaking changes

# Pushing the bump commit and the tag, and creating the GitHub Release.
permissions:
  contents: write

# Two merges landing close together must not race each other's push to main, and cancelling a release
# that has already tagged is far worse than making the second one wait.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Whether this event releases at all, and how far. A JOB rather than an `if:` on each job below,
  # because a skipped job has no outputs for the next one to read -- and because "no release, and here
  # is why" is worth saying out loud in the run summary instead of leaving as a grey skip.
  gate:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        env:
          # The body is untrusted text written by whoever opened the PR. It travels as an environment
          # variable and is never interpolated into a shell line; a `${{ }}` inside a `run:` would
          # paste it into the script itself, which is a shell injection with extra steps.
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT: ${{ github.event_name }}
          MANUAL_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          decline() {
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo 'bump=' >> "$GITHUB_OUTPUT"
            echo "### No release: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
            echo "bump=$MANUAL_BUMP" >> "$GITHUB_OUTPUT"
            echo "### Manual release ($MANUAL_BUMP), notes from the commit list" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          [ "$MERGED" = true ] || decline 'the pull request was closed without merging.'
          [ "$HEAD_REF" = development ] || decline "merged from '$HEAD_REF'; only 'development' cuts a release."
          case "$PR_LABELS" in *'"no-release"'*) decline 'the no-release label is set.' ;; esac

          # Writes release= and bump=. Fails loudly on two release labels rather than picking one.
          node tools/release-pr.mjs --level

          # The notes are rendered here too, and thrown away, purely so an empty or comment-only
          # description fails in twenty seconds rather than after the whole suite has run.
          node tools/release-pr.mjs --notes "$RUNNER_TEMP/notes-check.md"
          echo "### Releasing $(node tools/release-pr.mjs --level) from '$HEAD_REF'" >> "$GITHUB_STEP_SUMMARY"

  # The same file ci.yml calls, so nothing can be released past a suite that a merge would have been
  # blocked on. Typechecks are NOT re-run here: they are advisory in ci.yml, and a warning that does not
  # block a merge has no business blocking a release either.
  tests:
    name: Unit tests
    needs: gate
    if: needs.gate.outputs.release == 'true'
    uses: ./.github/workflows/tests.yml

  release:
    name: Bump, tag & publish
    runs-on: ubuntu-latest
    needs: [gate, tests]
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      # `ref: main` explicitly: on a `pull_request` event `github.ref` is refs/pull/N/merge, which is
      # not a branch anything can be pushed back to. The merge commit is already on main by the time
      # `closed` fires, so this is the tree that was just approved.
      #
      # Full history and tags: the manual changelog path diffs against the previous tag, and the editor
      # build reads `git describe --exact-match` to decide whether it may drop the `-dev` suffix.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Before anything is written. A description that somehow survives the gate but not this would
      # otherwise fail with the version already rewritten in the working tree.
      - name: Release notes from the pull request
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node tools/release-pr.mjs --notes "$RUNNER_TEMP/notes.md"

      # Fatal here, unlike in ci.yml, where the same check only warns: a hand-edit that moved one of the
      # four version sites and not the others would otherwise be baked into a tag that cannot be moved.
      - name: Version consistency
        run: node tools/bump-version.mjs --check

      - name: Bump version
        id: bump
        run: node tools/bump-version.mjs ${{ needs.gate.outputs.bump }}

      - name: Update changelog
        if: github.event_name == 'pull_request'
        run: node tools/changelog.mjs --release-from ${{ steps.bump.outputs.version }} "$RUNNER_TEMP/notes.md"

      # The manual path has no pull request to read, so it falls back to the commit list between tags.
      - name: Update changelog (manual)
        if: github.event_name == 'workflow_dispatch'
        run: node tools/changelog.mjs --release ${{ steps.bump.outputs.version }} "$RUNNER_TEMP/notes.md"

      # Commit and tag BEFORE building. The editor stamps its version from `git describe --exact-match`
      # on HEAD, so a build made before the tag exists ships labelled `-dev` -- the artifact attached to
      # the release would then disagree with the release it is attached to.
      - name: Commit and tag
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Explicit paths rather than `-a`: on a first release CHANGELOG.md is untracked, and `-a` skips it.
          git add package.json package-lock.json src/version.ts CHANGELOG.md editor/package.json editor/package-lock.json desktop/package.json desktop/package-lock.json
          git commit -m 'chore(release): v${{ steps.bump.outputs.version }}'
          git tag 'v${{ steps.bump.outputs.version }}'

      - name: Build engine and editor
        run: npm ci && npm run build && npm run editor:install && npm run editor:build

      - name: Package editor bundle
        run: cd editor/dist && zip -qr "$RUNNER_TEMP/cleo-editor-v${{ steps.bump.outputs.version }}.zip" .

      - name: Push
        run: git push --atomic origin HEAD:main 'refs/tags/v${{ steps.bump.outputs.version }}'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create 'v${{ steps.bump.outputs.version }}' \
            --title 'v${{ steps.bump.outputs.version }}' \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/cleo-editor-v${{ steps.bump.outputs.version }}.zip"

      - name: Summary
        run: echo "### Released v${{ steps.bump.outputs.version }} (${{ needs.gate.outputs.bump }})" >> "$GITHUB_STEP_SUMMARY"

      # CI will NOT fire for the push above -- GitHub suppresses workflow triggers for pushes made with
      # the default GITHUB_TOKEN -- so ci.yml's deploy job never runs for a release commit. Without this
      # step the live editor would keep serving the previous, `-dev`-labelled build. It reuses the build
      # from two steps up, so it costs nothing extra.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: ./editor
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CLEO_EDITOR }}
          channelId: live
          projectId: cleo-editor

  # Breaking releases only. Three runners each doing a full engine + editor + player build before
  # electron-builder even starts is by far the most expensive thing in this repo, and an installer is
  # worth handing out for "the shape of your project files changed" -- not for a fix digit. Everything
  # else in the release is already published by the job above; this only adds assets to it.
  installers:
    name: Desktop installer (${{ matrix.os }})
    needs: [gate, release]
    if: needs.gate.outputs.bump == 'breaking'
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing to package should not withhold the two that succeeded.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # The tag the release job just pushed, not the branch head: buildVersion.js reads
      # `git describe --exact-match` off HEAD, and only an exact tag match drops the `-dev` suffix.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # electron-builder packages ../editor/dist as extraResources, so the editor must be built first --
      # and with the production engine, since this is what ships in the installer.
      - name: Build engine and editor
        run: npm ci && npm run build && npm run editor:install && npm run editor:build

      # Nothing here is signed. Without this, electron-builder hunts for a keychain identity on macOS and
      # fails the job; unsigned is the honest outcome, not a silent one.
      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm ci && npm run dist

      # bash on all three runners so one glob works everywhere. nullglob because each runner produces
      # exactly one of these three and an unmatched glob would otherwise reach gh as a literal filename.
      # --clobber keeps a re-run of a failed matrix leg from colliding with what it uploaded last time.
      #
      # Matched on the package version rather than by extension alone: electron-builder never cleans
      # dist/, so a bare *.exe also picks up whatever a previous build left there. A hosted runner starts
      # empty and would not hit that, but attaching a stale installer to a release is not a failure mode
      # worth leaving open. Note this is the package.json version (x.y.z), not the 1.x.y.z tag.
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          pkg=$(node -p "require('./desktop/package.json').version")
          installers=(desktop/dist/*"$pkg"*.exe desktop/dist/*"$pkg"*.dmg desktop/dist/*"$pkg"*.AppImage)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error title=No installer::electron-builder produced nothing matching $pkg"
            ls -l desktop/dist || true
            exit 1
          fi
          printf 'uploading: %s\n' "${installers[@]}"
          gh release upload 'v${{ needs.release.outputs.version }}' --clobber "${installers[@]}"
