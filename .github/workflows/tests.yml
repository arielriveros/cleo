# The unit-test gate, as a reusable workflow. Called by ci.yml (every pull request to main) and by release.yml
# (before anything is tagged or published), so the bar a release has to clear is literally the same file as the bar
# a merge has to clear, rather than a copy of it that drifts.
#
# Each suite runs only for the areas its caller says changed (tools/ci/affected.mjs). The callers pass what the
# change touched; the defaults are "everything", so a caller that passes nothing still gets the whole gate. The
# engine closure (an engine change turns on every app) is affected.mjs's, not this file's.
#
# The engine and editor suites run vitest with coverage thresholds enforced inside their configs -- 90% statements,
# functions and lines over an explicit allowlist of the modules the tests actually target. See the long comment in
# vitest.config.ts for why the allowlist has to be explicit.
name: Tests

on:
  workflow_call:
    inputs:
      engine:
        type: boolean
        default: true
      appkit:
        type: boolean
        default: true
      editor:
        type: boolean
        default: true
      creator:
        type: boolean
        default: true
      examples:
        type: boolean
        default: true

jobs:
  test-engine:
    name: Test engine
    if: inputs.engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The example projects' binary data (examples/*/data.lock.json), from the repository's example-data release,
      # cached on the locks. Their suites run in this job and the engine's coverage counts on them; and a commit
      # whose text names data no release holds fails here.
      - uses: actions/cache@v4
        with:
          path: build/example-packs
          key: example-packs-${{ hashFiles('examples/*/data.lock.json') }}
          restore-keys: example-packs-
      - name: Fetch the examples' data
        run: npm run examples:fetch
      - name: Check the examples against their locks and the release
        run: npm run examples:check -- --remote

      # No build step: the suite is pure (node env, no DOM, no GL) and imports the engine source. The examples'
      # host suites (tick budgets, real sockets) are left out: they measure real time on a busy runner.
      - name: Test
        env:
          CLEO_TEST_HOST: '0'
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: node tools/coverage-summary.mjs coverage/coverage-summary.json Engine >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-engine
          path: coverage/lcov.info
          if-no-files-found: warn

  # The examples' own suites, when the engine job (which runs them as part of the whole root suite) does not. They
  # run for an editor change too: they read and write each example through the editor's folder codec (@editor/…).
  test-examples:
    name: Test examples
    if: ${{ !inputs.engine && (inputs.examples || inputs.editor) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: build/example-packs
          key: example-packs-${{ hashFiles('examples/*/data.lock.json') }}
          restore-keys: example-packs-
      - name: Fetch the examples' data
        run: npm run examples:fetch
      - name: Check the examples against their locks and the release
        run: npm run examples:check -- --remote

      - name: Test
        env:
          CLEO_TEST_HOST: '0'
        run: npm run test:examples

  test-editor:
    name: Test editor
    if: inputs.editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The root install is here for resolution, not for a build: applications/editor/vitest.config.ts aliases `cleo`
      # to the engine source, whose own imports (cannon-es, gl-matrix, uuid, sucrase) resolve out of the
      # root node_modules. That alias is why this job needs no `npm run build:dev` and stays fast.
      - run: npm ci

      - name: Install editor deps
        run: npm ci
        working-directory: applications

      # The published player (public/player/, git-ignored): tests/playerBundles.test.ts checks its chunk graph --
      # which files every game ships, and that each physics backend sits in its own part -- and skips without it.
      - name: Build the published player
        run: npx vite build --config vite.player.config.ts
        working-directory: applications/editor

      - name: Test
        run: npm run test:coverage
        working-directory: applications/editor

      - name: Coverage summary
        if: always()
        run: node tools/coverage-summary.mjs applications/editor/coverage/coverage-summary.json Editor >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-editor
          path: applications/editor/coverage/lcov.info
          if-no-files-found: warn

  # Same arrangement as the editor job: engine source resolves out of the root install, the apps' dependencies out
  # of the applications/ workspace install.
  test-app-kit:
    name: Test app-kit
    if: inputs.appkit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install application deps
        run: npm ci
        working-directory: applications

      - name: Test app-kit
        run: npm test
        working-directory: applications/app-kit

  test-creator:
    name: Test Cleo Creator
    if: inputs.creator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install application deps
        run: npm ci
        working-directory: applications

      - name: Test Cleo Creator
        run: npm test
        working-directory: applications/creator
